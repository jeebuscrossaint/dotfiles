# greetd, hosting the Quickshell greeter.
#
# Install to /etc/greetd/config.toml. See INSTALL.md -- the ordering matters,
# because a greeter that fails on vt1 with no agetty behind it is a machine you
# cannot log into.

[terminal]
# vt1, where agetty-tty1 normally sits. Disable that service or they fight over
# the console.
vt = 1

[default_session]
# XDG_RUNTIME_DIR is set by hand, and this is the whole reason the first attempt
# failed with "greeter exited without creating a session". elogind only creates
# /run/user/<uid> for a real login session, and greetd starts the greeter
# outside one -- so /run/user/967 does not exist and both cage and Quickshell
# refuse to start without a runtime dir.
#
# /run/greeter is created by the runit service before privileges are dropped
# (see sv/greetd/run), because the greeter user cannot make it itself.
#
# HOME and the XDG dirs point there too: greetd's `greeter` has / as its home,
# so anything Quickshell wants to cache or write state to would land in an
# unwritable place.
#
# cage is a one-window kiosk compositor; it exists to host exactly this. -s
# enables client-side scaling, -m last keeps the greeter on the last-used output
# rather than mirroring.
#
# `qs -p <file>` runs a single-file Quickshell config. The greeter has to live
# somewhere world-readable, since $HOME here is 700.
command = "sh -c 'export XDG_RUNTIME_DIR=/run/greeter HOME=/run/greeter XDG_CACHE_HOME=/run/greeter/cache XDG_STATE_HOME=/run/greeter/state; exec cage -s -m last -- qs -p /etc/greetd/greeter.qml'"
user = "greeter"
