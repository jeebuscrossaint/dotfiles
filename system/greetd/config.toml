# greetd, hosting tuigreet.
#
# Install to /etc/greetd/config.toml. See INSTALL.md -- the ordering matters,
# because a greeter that fails on vt1 with no agetty behind it is a machine you
# cannot log into.

[terminal]
# vt1, where agetty-tty1 normally sits. Disable that service or they fight over
# the console.
vt = 1

[default_session]
# tuigreet draws on the VT itself. That is the whole point of the switch away
# from the Quickshell greeter: there is no cage, no Qt, no compositor and no
# graphical stack under the login screen, so none of what the old config spent
# forty lines on applies any more -- no XDG_RUNTIME_DIR to fake, no HOME to
# redirect, no client-side-decoration argument with Qt.
#
#   --remember               keep the last username in the field
#   --remember-user-session  and the session that user last chose
#   --sessions               where the session desktop files live. mango installs
#                            /usr/share/wayland-sessions/mango.desktop, which is
#                            what makes it selectable here.
#   --time                   a clock, since there is no bar on the far side either
#
# Ctrl+Alt+F2 still reaches a text console from this screen; that is the escape
# hatch and it comes from the kernel, not from anything configured here.
command = "tuigreet --remember --remember-user-session --time --sessions /usr/share/wayland-sessions"
user = "greeter"
