# wob — the level OSD for volume and brightness.
#
# Fed a value per line on stdin through a FIFO ($XDG_RUNTIME_DIR/wob.sock), which
# mango's exec-once creates and pipes in. ~/.local/bin/osd writes to it.
#
# Why wob and not the notification daemon: wob is ONE layer-shell surface. It
# cannot stack, ever, no matter how fast you mash the key -- it just resets its
# own timeout. dunst achieved the same thing with a stack_tag, which was a
# dunst-only feature and silently stopped working when the session moved to
# fnott, at which point every volume keypress left another popup on screen.
#
# Colours are Framer (base16), RRGGBBAA with NO leading '#' -- wob's format.
# Writing them with a '#' is a parse error, not a fallback.

timeout = 900
max = 100
width = 320
height = 36
border_offset = 0
border_size = 1
bar_padding = 3

# Bottom centre, lifted clear of waybar (22px tall, position bottom). Anything
# less than about 40 and the bar sits on top of the status line.
anchor = bottom center
margin = 60

background_color = 181818E6   # base00, slightly translucent
border_color = 747474FF       # base03
bar_color = 20BCFCFF          # base0D, the accent

# Volume can exceed 100% (wpctl ceiling here is 150%), so overflow needs to be
# visible rather than clamped: past max the bar wraps and turns base08, which
# reads as "you are now boosting" instead of "the bar is stuck full".
overflow_mode = wrap
overflow_bar_color = FD886BFF        # base08
overflow_background_color = 181818E6
overflow_border_color = FD886BFF

orientation = horizontal

# Selected by writing "<value> muted" to the FIFO. The level stays real so you
# can see what you have silenced, while the colour says it is silenced.
[style.muted]
bar_color = 747474FF          # base03 -- drained, not alarming
border_color = 747474FF
background_color = 181818E6
