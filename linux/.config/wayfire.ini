# wayfire — the stacking compositor, third session alongside mango (tiling) and
# labwc (stacking, no effects). Started with ~/.local/bin/wayfire-run.
#
# Why wayfire when labwc already does stacking: labwc has NO animations and NO
# exposé, at all — checked against its full 0.20 config reference, the words do not
# appear. Those are the two things that actually make macOS feel like macOS, and
# wayfire has both natively (`scale` = Exposé, `expo` = Mission Control, `animate` =
# open/close). Nothing else in this stack changes: same waybar, same swaylock, same
# scripts, same coat.
#
# VALIDATE AFTER EDITING: `wayfire-check`. This matters more here than anywhere else
# in these dotfiles, because wayfire SILENTLY IGNORES both unknown sections and
# unknown keys — a typo is not an error, it is a setting that quietly does nothing.
# wayfire-check reads /usr/share/wayfire/metadata/*.xml and tells you.
#
# Reloading: wayfire watches this file and applies changes live. There is no reload
# keybind and none is needed.
#
# Key syntax is <modifier> KEY_NAME, modifiers <super> <alt> <ctrl> <shift>, and
# `|` separates alternatives for one action. Key names are Linux input names
# (KEY_Q, KEY_ENTER, KEY_GRAVE), NOT xkb keysyms — this is the single biggest
# difference from rc.xml and mango's config.

[core]
# Plugin list is deliberate, not the shipped default. Anything here costs memory and
# per-frame work, so each entry is something actually used:
#   autostart command       the session and the keybinds below
#   decoration              server-side titlebars (see [decoration])
#   animate                 open/close/minimize animations
#   scale expo              Exposé and Mission Control
#   idle session-lock       screen blanking and swaylock, natively (see [idle])
#   move resize grid place   mouse window management + half/quarter snapping
#   switcher fast-switcher  alt-tab
#   vswitch                 workspace switching
#   window-rules wm-actions per-app rules, fullscreen/always-on-top actions
#   alpha zoom              per-window opacity, screen magnifier
#   foreign-toplevel        what waybar's taskbar/ext-workspaces talk to
#   shortcuts-inhibit       so a VM or game can grab Super
#   oswitch                 multi-monitor focus
#
# NOT enabled: blur (per-frame shader pass; this is a battery-first laptop with a
# 2560x1600 240Hz OLED and blur is off in mango for the same reason), cube (a 3D
# workspace cube is not macOS), wobbly (wobbling windows are Compiz, not Aqua),
# simple-tile (mango is the tiling session), invert, fisheye, wrot.
plugins = \
  autostart command decoration animate scale expo idle session-lock \
  move resize grid place switcher fast-switcher vswitch \
  window-rules wm-actions alpha zoom \
  foreign-toplevel shortcuts-inhibit oswitch

# Workspaces are a GRID here, not a flat list — this is the biggest conceptual
# difference from sway/labwc/mango. 3x3 gives the nine the muscle memory expects,
# and binding_1..9 below map onto it.
vwidth = 3
vheight = 3

# Force server-side decorations so GTK apps get the same titlebar as everything else
# rather than drawing their own. Without this the session looks like two different
# window managers depending on the toolkit.
preferred_decoration_mode = server

# Close the topmost view, not whatever the pointer is over.
close_top_view = <super> KEY_C

[input]
xkb_layout = us
kb_repeat_rate = 50
kb_repeat_delay = 200

# flat for the mouse, and the touchpad gets acceleration — the same split the sway,
# mango and labwc configs all use. Flat on a touchpad makes crossing 2560px a
# multi-swipe affair.
mouse_accel_profile = flat
mouse_cursor_speed = 0.0
touchpad_accel_profile = adaptive
tap_to_click = true
natural_scroll = false
disable_touchpad_while_typing = true

[output:eDP-1]
mode = 2560x1600@240000
position = 0,0
scale = 1.000000

[output:HDMI-A-1]
mode = 3840x2160@30000
position = 2560,0
scale = 1.000000

# ============================================================== decoration ====
# wayfire's built-in decorator. Its buttons are already CIRCLES (cairo_arc in
# plugins/decor/deco-theme.cpp) with a hover animation, which is most of the macOS
# shape for free.
#
# What it cannot do: colour them. The red/amber/green are hardcoded in C++ and only
# drawn on HOVER, so at rest the circles take the titlebar colour — the inverse of
# macOS. There is no button-image option either. Firedecor is the plugin that fixes
# this and it is archived; see THIRD-PARTY.md for why it was rejected.
#
# active_color / inactive_color / font_color are coat's to write once the wayfire
# module exists. Values here are placeholders until then.
[decoration]
font = Adwaita Sans
font_scale = 0.8
title_height = 30
border_size = 1
# macOS order, left to right. Note this is the ORDER string; wayfire decides the side.
button_order = close minimize maximize
button_scale = 0.7
button_padding = 6
active_color = \#1A1A1AFF
inactive_color = \#1A1A1ACC
font_color = \#BABABAFF

# ================================================================ animate =====
# The reason for this whole session. zoom in/out is the Aqua scale effect;
# squeezimize is the genie-ish minimize. Durations are deliberately SHORTER than
# wayfire's 400ms defaults: 400ms reads as sluggish on a 240Hz panel.
[animate]
open_animation = zoom
close_animation = zoom
minimize_animation = squeezimize
duration = 220ms circle
squeezimize_duration = 180ms linear
startup_duration = 200ms linear
# fire is Compiz burning windows. Explicitly off so nothing enables it by accident.
fire_enabled_for = none

# =================================================== exposé / mission control =
# The two headline bindings.
#   W-e        spread the current workspace's windows      (macOS App Exposé)
#   W-S-e      spread every workspace's windows            (closer to Mission Control)
#   W-grave    the workspace grid                          (Mission Control proper)
#
# bg_color/text_color are coat's once the module exists.
[scale]
toggle = <super> KEY_E
toggle_all = <super> <shift> KEY_E
spacing = 40
outer_margin = 24
inactive_alpha = 0.75
allow_zoom = false
middle_click_close = true
title_overlay = all
title_font_size = 14
title_position = center
bg_color = \#0C1118E6
text_color = \#BABABAFF

[expo]
toggle = <super> KEY_GRAVE
select_workspace_1 = KEY_1
select_workspace_2 = KEY_2
select_workspace_3 = KEY_3
select_workspace_4 = KEY_4
select_workspace_5 = KEY_5
select_workspace_6 = KEY_6
select_workspace_7 = KEY_7
select_workspace_8 = KEY_8
select_workspace_9 = KEY_9

# ==================================================================== idle ====
# THIS IS THE wlopm REPLACEMENT, and the reason wayfire helps here: blanking happens
# inside the compositor, so there is no swayidle -> D-Bus -> wlopm round trip and no
# `after-resume` hack to power the outputs back on.
#
# (Worth being honest: wlopm itself answers in 3ms, so the ~10s lid-open delay was
# almost certainly kernel/GPU resume on this hybrid Intel+nvidia box rather than
# wlopm. This removes a moving part and one class of failure; it may not remove the
# 10s. Measure it once this session is real.)
#
# disable_on_fullscreen defaults true and is left there deliberately — it is what
# stops the screen blanking during a film or Minecraft.
# screensaver_timeout -1 kills the built-in zooming-cube screensaver.
[idle]
dpms_timeout = 600
screensaver_timeout = -1
disable_on_fullscreen = true

# ================================================================= window =====
[wm-actions]
toggle_fullscreen = <super> <shift> KEY_F
toggle_always_on_top = <super> <shift> KEY_A
toggle_showdesktop = <super> KEY_D
minimize = <super> KEY_MINUS

# W-f maximizes (titlebar and buttons stay), W-S-f is real fullscreen — the split
# asked for, same as labwc. grid slot 0 is "maximize", restore toggles back.
[grid]
slot_c = <super> KEY_F | <super> KEY_M | <super> KEY_A
slot_l = <super> <shift> KEY_H | <super> <shift> KEY_LEFT
slot_r = <super> <shift> KEY_L | <super> <shift> KEY_RIGHT
slot_t = <super> <shift> KEY_K | <super> <shift> KEY_UP
slot_b = <super> <shift> KEY_J | <super> <shift> KEY_DOWN
slot_tl = <super> <ctrl> KEY_U
slot_tr = <super> <ctrl> KEY_I
slot_bl = <super> <ctrl> KEY_J
slot_br = <super> <ctrl> KEY_K
restore = <super> <shift> KEY_N

[move]
activate = <super> BTN_LEFT
enable_snap = true
snap_threshold = 30
join_views = false

[resize]
activate = <super> BTN_RIGHT

[alpha]
modifier = <super> <alt>
min_value = 0.20

[zoom]
modifier = <super> <ctrl>
speed = 0.01

# ================================================================== focus =====
[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB
speed = 200

[fast-switcher]
activate = <super> KEY_TAB

[oswitch]
next_output = <super> KEY_DOT
next_output_with_win = <super> <shift> KEY_DOT

# ============================================================== workspaces ====
# Nine, on Super+1..9, via vswitch's dynamic binding_ list. Super+Shift+N SENDS the
# window without following, which is what sway's `move container to workspace` and
# labwc's SendToDesktop follow="no" both did.
[vswitch]
duration = 250ms circle
gap = 20
wraparound = false
binding_1 = <super> KEY_1
binding_2 = <super> KEY_2
binding_3 = <super> KEY_3
binding_4 = <super> KEY_4
binding_5 = <super> KEY_5
binding_6 = <super> KEY_6
binding_7 = <super> KEY_7
binding_8 = <super> KEY_8
binding_9 = <super> KEY_9
send_win_1 = <super> <shift> KEY_1
send_win_2 = <super> <shift> KEY_2
send_win_3 = <super> <shift> KEY_3
send_win_4 = <super> <shift> KEY_4
send_win_5 = <super> <shift> KEY_5
send_win_6 = <super> <shift> KEY_6
send_win_7 = <super> <shift> KEY_7
send_win_8 = <super> <shift> KEY_8
send_win_9 = <super> <shift> KEY_9
binding_left = <super> <alt> KEY_LEFT
binding_right = <super> <alt> KEY_RIGHT
with_win_left = <super> <alt> <shift> KEY_LEFT
with_win_right = <super> <alt> <shift> KEY_RIGHT

# ================================================================ commands ====
# Every one of these is the same program the mango and labwc sessions launch — one
# set of session scripts, three compositors.
[command]
binding_term = <super> KEY_Q | <super> <shift> KEY_ENTER
command_term = foot

binding_menu = <super> KEY_D
command_menu = menu-run

binding_browser = <super> <shift> KEY_B
command_browser = firefox

binding_clip = <super> KEY_V
command_clip = sh -c 'cliphist list | menu -i -p clip | cliphist decode | wl-copy'

binding_theme = <super> KEY_T
command_theme = theme-pick
binding_theme_random = <super> <shift> KEY_T
command_theme_random = theme-random

binding_screenshot = <super> <shift> KEY_S
command_screenshot = swayscreenshot
binding_screenshot_edit = <super> <shift> KEY_E
command_screenshot_edit = swayscreenshot-edit
binding_pick = <super> <shift> KEY_P
command_pick = pickcolor

binding_lock = <super> KEY_L | <super> KEY_ESC
command_lock = swaylock -f

binding_bar = <super> KEY_P
command_bar = pkill -SIGUSR1 -x waybar

# Media keys. `osd` performs the change AND draws the indicator as a notification,
# so there is no OSD daemon in any of the three sessions.
binding_volup = KEY_VOLUMEUP
command_volup = osd volume up
binding_voldown = KEY_VOLUMEDOWN
command_voldown = osd volume down
binding_volmute = KEY_MUTE
command_volmute = osd volume mute
binding_micmute = KEY_MICMUTE
command_micmute = osd mic mute
binding_play = KEY_PLAYPAUSE
command_play = osd playpause
binding_brightup = KEY_BRIGHTNESSUP
command_brightup = osd brightness up
binding_brightdown = KEY_BRIGHTNESSDOWN
command_brightdown = osd brightness down

# =============================================================== autostart ====
# wf-shell is NOT started: waybar is the bar in all three sessions and running both
# would give two panels fighting for the same exclusive zone.
[autostart]
autostart_wf_shell = false

00_dbus = dbus-update-activation-environment --all
10_wallpaper = swaybg -m fill -i /home/amarnath/jbwallpapers/wallpapers/Matanuska-River-ENBLA05.jpg
20_notify = fnott
30_bar = waybar
# config-wayfire, not the shared swayidle config: this one only LOCKS. Screen
# blanking is [idle] above, and having both swayidle's wlopm line and wayfire's dpms
# fighting over the same outputs is exactly the sort of double-handling that makes
# "the screen won't come back" bugs.
40_idle = swayidle -w -C /home/amarnath/.config/swayidle/config-wayfire
50_clip_text = wl-paste --type text --watch cliphist store
51_clip_image = wl-paste --type image --watch cliphist store
52_clip_persist = wl-clip-persist --clipboard regular
60_polkit = start-polkit
70_canvas = canvas-notify
80_vibrance = nvibrant 1023 1023 1023 1023
90_audio = audio-ensure
99_completions = refresh-paru-completions

# ============================================================ window rules ====
# Syntax is "on <event> if <condition> then <action>", which is nothing like mango's
# windowrule= or labwc's <windowRule>.
[window-rules]
pip_on_top = on created if title contains "Picture-in-Picture" then set always_on_top true
pinentry_top = on created if app_id contains "pinentry" then set always_on_top true
