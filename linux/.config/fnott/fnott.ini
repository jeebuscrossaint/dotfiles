# ~/.config/fnott/fnott.ini — the notification daemon for the mango session.
#
# The only on-screen surface in that session. There is no bar: `status` draws the
# whole readout through here on Super+S, and `osd` draws volume, brightness and
# the lock keys the same way. That is what makes a bar process and an OSD daemon
# both unnecessary -- one surface, drawn on demand, nothing to restart when the
# theme changes.
#
# coat patches colours and fonts into this file IN PLACE (fnott.tera) and leaves
# every other line alone, so the geometry and timeouts here are ours and survive
# a `coat set`. The colour values below are placeholders for a first run; do not
# hand-tune them, coat overwrites them.

[main]
# overlay, not top: `status` and the volume OSD have to be readable over a
# fullscreen window, which a top-layer surface is not.
layer=overlay

anchor=top-right
stacking-order=top-down
edge-margin-vertical=12
edge-margin-horizontal=12
notification-margin=8

border-size=1
# Square, like everything else in this session.
border-radius=0
padding-vertical=10
padding-horizontal=14

# `status` prints an aligned block eleven lines deep, which is what sets these:
# too narrow and the monospace columns wrap into nonsense. max-height keeps a
# long body from becoming a full-height slab.
min-width=380
max-width=560
max-height=600

# coat writes SFMono here, which is also what makes status' columns line up.
title-font=SFMono Nerd Font Mono:size=10
summary-font=SFMono Nerd Font Mono:size=10
body-font=SFMono Nerd Font Mono:size=10

background=181818ff
border-color=52494Eff
title-color=96A6C8ff
summary-color=F4F4FFff
body-color=F4F4FFff
progress-bar-color=96A6C8ff

# osd replaces its own popup rather than stacking, so a held volume key does not
# need a long life here. status asks for 8s explicitly with -t.
default-timeout=5
max-timeout=30

max-icon-size=48

[low]
title-color=52494Eff
border-color=52494Eff

[normal]
title-color=96A6C8ff
border-color=52494Eff

[critical]
title-color=F43841ff
border-color=F43841ff
background=181818ff
default-timeout=0
