# fnott — notification daemon, replacing dunst.
#
# Same author as foot, and Wayland-native (layer-shell) rather than an X11 daemon
# running under XWayland. In OpenBSD ports and Arch extra, which is why it is
# here instead of dunst or mako.
#
# Colours are Framer (base16), matching the bar and the borders. They are ARGB
# with the alpha FIRST -- fnott's format, not the RRGGBBAA that most Wayland
# tools use. Getting that backwards gives you an invisible popup.
#
# NOTE ON THE OSD: ~/.local/bin/osd draws the volume/brightness popups. Under
# dunst it passed `int:value:N` to get a progress bar and a stack-tag to update
# one popup in place. fnott honours neither hint, so those popups will render as
# plain text until the script is taught fnott's own idiom (`--replace-id`, and no
# meter). Text still tells you the number, so nothing is broken -- it is just
# less pretty than it was.

[main]
notification-margin=8
edge-margin-vertical=10
edge-margin-horizontal=10
border-size=1
border-radius=0
max-width=420
max-height=200
title-font=MartianMono Nerd Font Mono:size=10
summary-font=MartianMono Nerd Font Mono:size=10
body-font=MartianMono Nerd Font Mono:size=10
background=ff181818
border-color=ff747474
title-color=ff20bcfc
summary-color=ffd0d0d0
body-color=ffd0d0d0
progress-bar-height=4
progress-bar-color=ff20bcfc
default-timeout=5
idle-timeout=0
anchor=top-right
stacking-order=top-down
layer=overlay

[low]
title-color=ff747474
border-color=ff747474
default-timeout=3

[normal]
title-color=ff20bcfc
border-color=ff747474

[critical]
title-color=fffd886b
border-color=fffd886b
background=ff2a1a16
# 0 = never expire. A critical notification you miss is a critical notification
# that did not happen.
default-timeout=0
