# foot terminal configuration
include=~/.config/foot/coat-theme.ini

[main]
term=xterm-256color
pad=0x0

# foot's default is 80x24, the 1978 VT100 default, which on a 2560x1600 panel at
# font size 12 is a postage stamp. This is the size a NEW window opens at; it says
# nothing about resizing afterwards.
#
# chars rather than initial-window-size-pixels (the two are mutually exclusive)
# because this is a terminal: what matters is that 120 columns of code fit, and that
# stays true if the font size changes or the window opens on the 4K external instead
# of the laptop panel. A pixel size would silently mean fewer columns the moment coat
# bumped the font.
#
# Only affects floating/stacking sessions. Under mango the layout decides the size
# and this is ignored.
initial-window-size-chars=120x34

[mouse]
hide-when-typing=yes
