# ~/.config/hypr/hyprland.conf
# Ported from the sway config — same keybinds, monitors, autostarts. Colours come
# from coat (sourced below). Docs: https://wiki.hyprland.org

# ── Monitors (name, res@hz, position, scale, extra) ─────────────────────────
# bitdepth,10 keeps the 10-bit OLED output (sway had render_bit_depth 10).
monitor = eDP-1, 2560x1600@240, 0x0, 1, bitdepth, 10
monitor = HDMI-A-1, 3840x2160@30, 2560x0, 1, bitdepth, 10
monitor = , preferred, auto, 1   # fallback for any other display

# ── Programs ────────────────────────────────────────────────────────────────
$terminal = kitty
# menu-run, not fuzzel directly: it is the .desktop launcher wrapper every
# compositor config here calls, so the launcher can be swapped without editing
# this file. `menu` is its dmenu-mode sibling.
$menu     = menu-run
$mod      = SUPER

source = ~/.config/hypr/coat-theme.conf

# ── GPU: Intel-primary, dGPU on demand via prime-run ────────────────────────
# The eDP panel is wired to the Intel iGPU (card1) in Hybrid mode, so Intel MUST
# be primary: it scans out to the panel with no cross-GPU copy.
#
# Do NOT make NVIDIA (card0) primary. It renders on the dGPU then copies every
# frame back to Intel (reverse PRIME), which stutters badly at 2560x1600@240.
# Tried and reverted. For games, `prime-run <cmd>` instead.
#
# aquamarine wants the REAL cardN nodes (rejects by-path symlinks). If a kernel
# update renumbers them (black screen), check with:
#   for c in /sys/class/drm/card[0-9]/device/vendor; do echo "$c $(cat $c)"; done
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0
env = __GLX_VENDOR_LIBRARY_NAME,mesa
# HW video decode on the Arc iGPU (needs intel-media-driver)
env = LIBVA_DRIVER_NAME,iHD
# GTK4's Vulkan renderer picks the discrete GPU when both are present.
env = GSK_RENDERER,gl
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1
env = _JAVA_AWT_WM_NONREPARENTING,1

# ── Cursor ──────────────────────────────────────────────────────────────────
# macOS pointer converted to hyprcursor, tracked at linux/.local/share/icons/macOS
# (hyprcursors/ for Wayland-native + cursors/ for XWayland).
env = HYPRCURSOR_THEME,macOS
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,macOS
env = XCURSOR_SIZE,24
# If the cursor ever flickers on Nvidia: cursor { no_hardware_cursors = true }

# ── Autostart ───────────────────────────────────────────────────────────────
exec-once = dbus-update-activation-environment --all
exec-once = dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = /usr/lib/xdg-desktop-portal-hyprland
exec-once = /usr/libexec/xdg-desktop-portal
exec-once = hypridle
# config-hyprland.jsonc, not the shared config: the shared one's modules-left
# streams mango's IPC and idles empty here.
exec-once = waybar -c /home/amarnath/.config/waybar/config-hyprland.jsonc
exec-once = fnott
exec-once = awww-daemon
exec-once = start-polkit
# audio-ensure, NOT a bare artix-pipewire-launcher: the bare launcher skips
# wireplumber, leaving a stack that looks alive with only a null sink behind it.
exec-once = audio-ensure
exec-once = refresh-paru-completions
# Clipboard history (cliphist) — recall with $mod+V
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# Keeps the selection alive after the app that owns it exits.
exec-once = wl-clip-persist --clipboard regular
exec-once = hyprpm reload -n
# Off: it forced a lone window to true fullscreen and hid the bar.
#exec-once = hypr-smart-full

# ── Input ───────────────────────────────────────────────────────────────────
input {
    kb_layout    = us
    repeat_delay = 200
    repeat_rate  = 50
    follow_mouse = 1
    sensitivity  = 0
    accel_profile = flat
    touchpad {
        natural_scroll = false
    }
}

cursor {
    inactive_timeout = 3
}

gesture = 3, horizontal, workspace
gesture = 4, up, dispatcher, gloview:toggle

# accel_profile=flat above is for mice only, like sway's `input type:pointer`.
device {
    name = asup1207:00-093a:3012-touchpad
    accel_profile = adaptive
    natural_scroll = false
}

# ── Layout / borders / gaps ─────────────────────────────────────────────────
# gaps_in is HALF mango's gappi: Hyprland puts it on each window's own edge, so
# two neighbours make 30px of gutter.
general {
    border_size     = 0
    gaps_in         = 15
    gaps_out        = 15
    layout          = dwindle
    resize_on_border = false
    # THREE stops with the first and last the same colour: a symmetric gradient
    # has no seam, so the rotation below reads as breathing rather than spinning.
    col.active_border   = $base0D $base0C $base0D 45deg
    # base03, not base01: base01/02/04/06 resolve near base00 in many base16
    # schemes and the border disappears.
    col.inactive_border = $base03
}

dwindle {
    preserve_split  = false
}

# ── Eye candy ───────────────────────────────────────────────────────────────
decoration {
    rounding = 10
    # Squircle corners. 2.0 is a plain circular arc; raising the exponent makes
    # the corner a superellipse -- flatter through the middle, tighter where it
    # meets the straight edges, which is the Apple corner. 4.0 is the point where
    # it reads as intentional without going lozenge-shaped. Range is 1.0-10.0.
    #
    # mango has no equivalent -- it takes border_radius and nothing else -- so
    # this is Hyprland-only.
    rounding_power = 4.0

    active_opacity   = 1.0
    inactive_opacity = 0.90

    # Copied from mango's blur_params_* so a window looks the same under either
    # compositor. Heavier than most community configs (they run 6/2 or 3/3); if
    # battery takes a hit, 6/2 survives the look.
    blur {
        enabled = true
        size    = 10
        passes  = 3
        noise      = 0.02
        contrast   = 1.0
        brightness = 0.95
        vibrancy   = 0.25
        vibrancy_darkness = 0.0
        new_optimizations = true
        # Blur what is behind a translucent window rather than skipping it: this
        # is what frosts the terminal background.
        ignore_opacity = true
        popups   = true
        special  = true
        # xray blurs the WALLPAPER through everything instead of the windows
        # actually behind you, flattening the stack the moment two overlap.
        xray = false
    }

    # The offset is the point: a macOS shadow is cast DOWNWARD, not evenly in a
    # ring, which is what makes a window look lifted rather than outlined.
    shadow {
        enabled      = true
        range        = 30
        render_power = 10
        offset       = 0 0
        scale        = 4.0
        color        = $coat_shadow
    }

    # Off: kinder to OLED, and inactive_opacity already answers "which is focused".
    dim_inactive = false
}

animations {
    enabled = true

    # No overshoot anywhere. macSpring, the curve that provided it, is gone rather
    # than left defined-but-unused, so it cannot get picked up again by accident:
    #
    #   bezier = macSpring, 0.34, 1.12, 0.44, 1.00
    #
    # The 1.12 is the overshoot -- a bezier control point past 1.0 carries the
    # value beyond its target and lets it settle back, which is the jiggle. Every
    # node that used it now uses macOut.
    #
    # macOut ends at 1.00 and approaches it from below, so nothing ever travels
    # past where it is going. That is the whole rule now; the earlier
    # appear-versus-travel split existed only to decide who was allowed to
    # overshoot, and with nothing overshooting it has nothing left to decide.
    bezier = macOut,    0.22, 1.00, 0.36, 1.00
    bezier = macStd,    0.25, 0.10, 0.25, 1.00   # borders
    # Opacity wants almost-linear: an eased ramp flickers at the start and smears
    # at the end.
    bezier = macFade,   0.50, 0.50, 0.75, 1.00

    # Durations are DECISECONDS: 3 = 300ms. `global` is the parent of the whole
    # tree, so a node added by a future Hyprland version is animated rather than
    # silently instant.
    animation = global, 1, 4, macOut

    # ── windows ─────────────────────────────────────────────────────────────
    # popin 96%, the same as the layer surfaces below -- fuzzel's open is the
    # animation this is copying. 4% of scale is small enough that the FADE is what
    # you see; at 94% it read as a pop.
    # slide, so a new window travels in from the nearest screen edge instead of
    # scaling up in place, and the neighbours slide over to make room -- the two
    # read as windows pushing each other rather than one appearing on top.
    #
    # The FADE is not named here and does not need to be: fadeIn is a separate
    # node that always runs on open, so `slide` already is slide-plus-fade.
    #
    # NOT `slidefade`. Hyprland stores it and `hyprctl animations` reports it
    # back, so it looks like it took -- but the window path dispatches on
    # `animList[0] == "slide"` exactly, and anything else falls through to
    # applyPopin. It would silently render as a pop while claiming to be a slide.
    #
    # applySlide sets size.from = size.to, so this is pure translation with no
    # scaling, and with no direction given it picks the monitor edge nearest the
    # window's midpoint -- a window opening on the right comes in from the right.
    #
    # `gnomed` was tried here and is not worth it on a tiler: the window unfolds
    # vertically from a zero-height line, designed for GNOME's floating windows,
    # and just fights the retile around it.
    animation = windows,     1, 4,   macOut, slide
    animation = windowsIn,   1, 4,   macOut, slide
    animation = windowsOut,  1, 4,   macOut,    slide
    # The retile of windows already on screen, and the reason a second window
    # opening feels busier than the first on an empty workspace: the new window
    # fades in either way, but the neighbours also move.
    #
    # slide, matching the open: the neighbours translate to their new slots rather
    # than scaling into them, which is the half that sells "pushed aside".
    #
    # 400ms, the same as windowsIn. Opening a second window is ONE event with two
    # halves -- the new window fading in and its neighbours resizing to make room
    # -- and when the two run at different lengths the slower half is still moving
    # after the faster one has settled, which is what made it feel abrupt.
    #
    # The workspace nodes CANNOT -- they reject popin, and take only slide,
    # slidevert, slidefade, slidefadevert and fade -- so those stay a slide.
    animation = windowsMove, 1, 4,   macOut,    slide

    # ── borders ─────────────────────────────────────────────────────────────
    animation = border,      1, 4,   macStd
    # OFF, and it was doing nothing visible anyway: general:border_size is 0, so
    # the gradient this rotated was being drawn on a border zero pixels wide. The
    # loop still repainted the focused window every frame forever to animate it
    # (~4.5% CPU here), which also defeats vfr -- the compositor can never idle on
    # a still desktop.
    #
    # Duration was never a lever: 6s and 3s repaint at the same rate, so the only
    # settings are on and off. To bring it back, this needs border_size >= 1 as
    # well -- and `1, 30, linear, once` gives one sweep per window open instead of
    # a permanent cost.
    animation = borderangle, 0, 80, linear

    # ── layer surfaces (waybar, fnott, fuzzel) ──────────────────────────────
    animation = layers,      1, 4,   macOut, popin 96%
    animation = layersIn,    1, 4,   macOut, popin 96%
    animation = layersOut,   1, 2.7,   macOut,    popin 96%

    # ── fades ───────────────────────────────────────────────────────────────
    # Timed to the window durations above on purpose -- every window node is
    # 1, 4 now, so the fade and the slide finish together in both directions.
    # Change one of a pair without the other and the opacity finishes early while
    # the geometry keeps travelling, which is what reads as a pop. With a shorter fade the opacity finishes early and the last of the
    # scale plays out on an already solid window, which is the part that reads as
    # a pop rather than a fade. Bumping only fadeIn would reintroduce exactly that.
    animation = fade,           1, 4,   macFade
    animation = fadeIn,         1, 4,   macFade
    animation = fadeOut,        1, 4,   macFade
    animation = fadeSwitch,     1, 2.7,   macFade
    animation = fadeShadow,     1, 4,   macFade
    animation = fadeDim,        1, 2.7,   macFade
    animation = fadeLayers,     1, 4,   macFade
    animation = fadeLayersIn,   1, 4,   macFade
    animation = fadeLayersOut,  1, 2.7,   macFade

    # ── workspaces ──────────────────────────────────────────────────────────
    # Slide, and 300ms rather than 400 -- the old timing was sluggish for
    # something you do constantly.
    #
    # `fade` is a valid style here and was tried: it puts both spaces at partial
    # opacity over the wallpaper at once, so the whole screen goes translucent
    # mid-switch. Slide keeps each space solid and moves it.
    animation = workspaces,     1, 4, macOut, slide
    animation = workspacesIn,   1, 4, macOut, slide
    animation = workspacesOut,  1, 4, macOut, slide
    # The scratchpad is the one place a spring belongs on a full-screen surface:
    # it is summoned rather than switched to, and 30% keeps the rise short.
    animation = specialWorkspace, 1, 4, macOut, slidefadevert 30%

    # ── misc ────────────────────────────────────────────────────────────────
    animation = zoomFactor,  1, 4, macOut
}

# ── Other animation styles ──────────────────────────────────────────────────
# Drop-in replacements for the bezier + animation lines above. Comment the macOS
# set out, paste one in, $mod+Shift+C to reload. `hyprctl configerrors` names any
# node rejected after an update.
#
# 1. HYPRLAND STOCK — what ships in the example config. Fast, no overshoot.
#
#    bezier = easeOutQuint,  0.23, 1.00, 0.32, 1.00
#    bezier = easeInOutCubic,0.65, 0.05, 0.36, 1.00
#    bezier = almostLinear,  0.50, 0.50, 0.75, 1.00
#    bezier = quick,         0.15, 0.00, 0.10, 1.00
#    animation = windows,    1, 4.79, easeOutQuint
#    animation = windowsIn,  1, 4,  easeOutQuint, popin 87%
#    animation = windowsOut, 1, 1.49, linear,       popin 87%
#    animation = border,     1, 5.39, easeOutQuint
#    animation = fade,       1, 3.03, quick
#    animation = layers,     1, 3.81, easeOutQuint
#    animation = layersIn,   1, 4,    easeOutQuint, fade
#    animation = layersOut,  1, 1.5,  linear,       fade
#    animation = workspaces, 1, 1.94, almostLinear, fade
#
# 2. BUBBLY — this config's earlier style (commit 3259764) plus the community's
#    `overshot`. wsBounce overshoots to 1.30 vs macSpring's 1.12, so windows
#    visibly bounce past and spring back. Gets tiring on a work machine.
#
#    bezier = overshot, 0.05, 0.90, 0.10, 1.05
#    bezier = wsBounce, 0.22, 1.30, 0.30, 1.00
#    bezier = ease,     0.25, 0.10, 0.25, 1.00
#    animation = windows,    1, 2.5, wsBounce, popin 90%
#    animation = windowsOut, 1, 2,   ease,     popin 90%
#    animation = border,     1, 2.5, ease
#    animation = layers,     1, 3,   wsBounce, popin 80%
#    animation = fade,       1, 2,   ease
#    animation = workspaces, 1, 2.4, wsBounce, slide
#
# 3. BATTERY — halved durations, one decel curve, no overshoot, slidevert on
#    spaces (fewer pixels than horizontal on a 2560-wide panel). Cheaper still:
#    `enabled = false`, which loses the whole look — try that first.
#
#    bezier = fast, 0.22, 1.00, 0.36, 1.00
#    animation = global,     1, 1.5, fast
#    animation = windows,    1, 1.5, fast, popin 97%
#    animation = windowsOut, 1, 1,   fast, popin 97%
#    animation = fade,       1, 1,   fast
#    animation = workspaces, 1, 1.5, fast, slidevert
#    animation = borderangle, 0, 30, linear

# Hand a fullscreen window's buffer straight to the display and skip compositing
# it. Costs nothing when it does not apply -- Hyprland falls back on its own the
# moment anything needs drawing over the top.
#
# `render` is TOP-LEVEL, not inside misc: nested it is rejected as
# <misc:render:direct_scanout> does not exist.
#
# vrr is deliberately not set. This panel has no vrr_capable node anywhere under
# /sys/class/drm, so there is no variable refresh to turn on.
render {
    direct_scanout = true
}

misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    force_default_wallpaper  = 0   # awww draws the wallpaper
}

# ── Window rules (0.53+ syntax: match conditions first, then rule + value) ──
#windowrule = match:class ^(pavucontrol|nm-connection-editor|blueman-manager)$, float on
windowrule = match:title ^(Open File|Save File|Choose Files|Save As)$, float on
#windowrule = match:title Picture-in-Picture, float on
windowrule = match:title Picture-in-Picture, pin on

# ── Layer blur (0.53+ syntax) ───────────────────────────────────────────────
# waybar's own background is transparent -- the visible surfaces are the island
# slabs -- so this frosts the whole layer RECTANGLE: one strip of glass running
# the full width with the islands on it. That is what ties them back into one bar.
#
# It needs waybar's bar margin at 0. A bar margin OFFSETS the layer surface
# without shrinking it, so at "0 10 0 10" the strip started ten pixels in and ran
# off the right edge; config.jsonc insets the end islands in CSS instead.
#
# `ignore_alpha 0.5` would confine the blur to each island. Tried and rejected --
# the long strip is the point. The field name is `ignore_alpha` on 0.56;
# ignorealpha/ignorezero/blur_ignore_alpha are all "invalid field type", and a bad
# layerrule fails silently.
#
# `hyprctl layers` prints namespaces if a rule does not take.
layerrule = match:namespace waybar, blur on
layerrule = match:namespace fnott, blur on
layerrule = match:namespace notifications, blur on
layerrule = match:namespace launcher, blur on

# ── Plugins (hyprpm) ────────────────────────────────────────────────────────
# hyprpm builds from source and pins to the running Hyprland's ABI, so every one
# of these needs a rebuild after a compositor update:
#
#   hyprpm add https://github.com/hyprwm/hyprland-plugins   # hyprbars
#   hyprpm add https://github.com/fedsfarm/gloview
#   hyprpm add https://github.com/VirtCode/hypr-dynamic-cursors
#   hyprpm add https://github.com/daxisunder/hyprfocus
#   hyprpm enable hyprbars gloview dynamic-cursors hyprfocus
#
# NEVER sudo hyprpm: the cache lives in /var/cache/hyprpm/$USER and a root run
# leaves it owned by root, breaking every later call.
plugin {
    # Mission-Control-style overview. Also has gloview:desktop and
    # gloview:allworkspaces if those want their own keys.
    gloview {
        strip_offset        = 44                # push the top strip below waybar
        backdrop_color      = $coat_ov_backdrop
        strip_active_border = $coat_ov_accent
        select_border       = $coat_ov_accent
        hover_border        = $coat_ov_accent2
    }

    # x86_64 only. stretch squishes the cursor in the direction of motion.
    dynamic-cursors {
        enabled   = true
        mode      = stretch
        threshold = 2   # min angle change (deg) before reshaping
        shake {
            enabled = false
        }
    }

    # hyprglass removed — its render didn't work on 0.56 and fought native blur.

    # Subtle flash on focus change. Lineage matters if re-adding: the original
    # VortexCoyote/hyprfocus is unmaintained and daxisunder's fork is the one that
    # tracks current Hyprland. hyprwm/hyprland-plugins ships its OWN hyprfocus (a
    # different plugin, same name); this config is not written for that one.
    hyprfocus {
        enabled = yes
        animate_floating = yes
        animate_workspacechange = yes
        focus_animation = flash
        # 1.00, not 1.05: that last control point was an overshoot too, so the
        # focus flash sprang past its target opacity and settled back.
        bezier = focusIn,  0.15, 0.85, 0.30, 1.00
        bezier = focusOut, 0.20, 0.60, 0.35, 1.00
        # Only `flash` is really configurable: focus_animation accepts "bounce"
        # but there is no plugin:hyprfocus:bounce:* section behind it.
        #
        # Dip FAST, recover SLOW. 0.70 because inactive_opacity is 0.90 -- the dip
        # has to go clearly below where the eye is coming from.
        flash {
            flash_opacity = 0.70
            in_bezier  = focusIn
            in_speed   = 0.6
            out_bezier = focusOut
            out_speed  = 1.8
        }
    }

    # macOS traffic-light title bars. If the old square-corner ghost ever returns
    # after an update: `hyprpm disable hyprbars`.
    hyprbars {
        bar_height   = 28
        bar_color    = $coat_surface
        bar_blur     = false
        col.text     = $base05
        bar_text_size   = 12
        bar_text_font   = MartianMono Nerd Font Mono
        bar_text_weight = 600
        bar_text_align  = center
        bar_title_enabled = true
        bar_buttons_alignment = left
        bar_padding        = 12                 # left edge to first dot
        bar_button_padding = 8                  # between dots
        icon_on_hover      = true
        inactive_button_color = $base03
        bar_part_of_window        = true        # keeps rounding sane
        bar_precedence_over_border = true
        on_double_click = hyprctl dispatch fullscreen 1

        # bgcolor, size, icon, on-click, fgcolor. L→R: red, yellow, green, mapped
        # to coat's base08/0A/0B rather than fixed macOS hex. No real minimize in a
        # tiler, so yellow stashes to the scratchpad and green zooms.
        hyprbars-button = $base08, 12, ×, hyprctl dispatch killactive,                    $base00
        hyprbars-button = $base0A, 12, −, hyprctl dispatch movetoworkspace special:magic, $base00
        hyprbars-button = $base0B, 12, +, hyprctl dispatch fullscreen 1,                   $base00
    }
}

# ── Keybinds ────────────────────────────────────────────────────────────────
bind = $mod, Q, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, C, killactive
bind = $mod SHIFT, C, exec, hyprctl reload
# The pgrep guard matters: session-lock allows exactly one lock client, so a
# manual lock on top of an idle lock gave two password prompts.
bind = $mod, L,      exec, hyprlock
bind = $mod, Escape, exec, pgrep -x swaylock >/dev/null || swaylock -f
# SIGUSR1 is waybar's show/hide. NEVER SIGUSR2 -- it aborts waybar.
bind = $mod, P, exec, pkill -SIGUSR1 -x waybar
bind = $mod, T, exec, theme-pick
bind = $mod SHIFT, T, exec, theme-random
bind = $mod SHIFT, S, exec, screenshot
bind = $mod SHIFT, E, exec, screenshot-edit
# Through `menu`, not fuzzel directly -- same reason as $menu above.
bind = $mod, V, exec, cliphist list | menu -i -p clip | cliphist decode | wl-copy
bind = $mod SHIFT, V, togglefloating
bind = $mod, F,       fullscreen, 1   # maximize: keeps the bar + gaps
bind = $mod SHIFT, F, fullscreen, 0   # true fullscreen: bar hidden
bind = $mod, M,       fullscreen, 1   # muscle memory

# ── Hyprland-native window management ───────────────────────────────────────
# Scratchpad: a hidden workspace to toggle on top of anything.
bind = $mod, grave,       togglespecialworkspace, magic
bind = $mod SHIFT, grave, movetoworkspace, special:magic

# Tabbed window groups
bind = $mod, G,   togglegroup
bind = $mod, Tab, changegroupactive, f

# Dwindle layout controls
bind = $mod, backslash, layoutmsg, togglesplit
bind = $mod, U,         pseudo

bind = $mod, A, gloview:toggle

# Focus (arrows)
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Move window (arrows + vim keys)
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move container to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Hold $mod to drag-move / drag-resize (sway floating_modifier)
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Resize submap ($mod+R, then arrows/hjkl, Esc/Enter to exit)
bind = $mod, R, submap, resize
submap = resize
binde = , left,  resizeactive, -20 0
binde = , right, resizeactive,  20 0
binde = , up,    resizeactive,  0 -20
binde = , down,  resizeactive,  0  20
binde = , H, resizeactive, -20 0
binde = , L, resizeactive,  20 0
binde = , K, resizeactive,  0 -20
binde = , J, resizeactive,  0  20
bind = , escape, submap, reset
bind = , return, submap, reset
submap = reset

# ── Media / brightness keys ─────────────────────────────────────────────────
# `osd` does the change AND draws the display, as a notification. There is no OSD
# daemon here by design: nothing to kill on a theme change, nothing to silently
# die and take the media keys with it. The backlight device is baked into it.
bindel = , XF86AudioRaiseVolume,  exec, osd volume up
bindel = , XF86AudioLowerVolume,  exec, osd volume down
bindl  = , XF86AudioMute,         exec, osd volume mute
bindl  = , XF86AudioMicMute,      exec, osd mic mute
bindl  = , XF86AudioPlay,         exec, osd playpause
bindl  = , XF86Launch3,           exec, osd playpause
bindl  = , XF86AudioNext,         exec, osd next
bindl  = , XF86AudioPrev,         exec, osd prev
# Still requires the kernel param i915.enable_dpcd_backlight=1.
bindel = , XF86MonBrightnessUp,   exec, osd brightness up
bindel = , XF86MonBrightnessDown, exec, osd brightness down
# If the firmware turns out to step the LED itself these would double-step --
# change both to `osd kbd show`, which only reports.
bindel = , XF86KbdBrightnessUp,   exec, osd kbd up
bindel = , XF86KbdBrightnessDown, exec, osd kbd down
bindl  = , XF86TouchpadToggle,    exec, osd touchpad
# Binding these does not stop them working: the compositor only declines to
# forward the key, and xkb has already pushed the LED. osd waits out the few ms.
bindl  = , Caps_Lock,             exec, osd capslock
bindl  = , Num_Lock,              exec, osd numlock
