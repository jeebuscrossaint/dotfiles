# ~/.config/hypr/hyprland.conf
# ============================================================================
# Ported from the sway config — same keybinds, monitors, autostarts — plus the
# eye candy sway/SwayFX couldn't give you on Artix: animations, blur, shadows,
# rounded corners. Colours come from coat (sourced below), like your sway theme.
# Docs: https://wiki.hyprland.org
# ============================================================================

# ── Monitors (name, res@hz, position, scale, extra) ─────────────────────────
# bitdepth,10 keeps your 10-bit OLED output (sway had render_bit_depth 10).
monitor = eDP-1, 2560x1600@240, 0x0, 1, bitdepth, 10
monitor = HDMI-A-1, 3840x2160@30, 2560x0, 1, bitdepth, 10
monitor = , preferred, auto, 1   # fallback for any other display

# ── Programs ────────────────────────────────────────────────────────────────
$terminal = kitty
# menu-run, not fuzzel directly: it is the .desktop launcher wrapper every
# compositor config here calls, so the launcher underneath can be swapped
# without editing this file. `menu` is its dmenu-mode sibling (used below).
$menu     = menu-run
$mod      = SUPER

# ── Colours from coat (generated by `coat apply hyprland`) ──────────────────
# Sets col.active_border / col.inactive_border / shadow color from your scheme,
# exactly like `include ~/.config/sway/coat-theme` did for sway.
source = ~/.config/hypr/coat-theme.conf

# ── GPU: Intel-primary (iGPU drives the display; dGPU on demand via prime-run) ─
# The internal eDP panel is physically wired to the Intel iGPU (card1) in
# Hybrid/MSHybrid BIOS mode, so Intel MUST be the primary compositor: it scans
# frames straight out to the panel with NO cross-GPU copy = smooth 240Hz.
#
# NOTE: do NOT make NVIDIA (card0) primary here. It renders the desktop on the
# dGPU but then has to copy every frame back to Intel for scanout (reverse
# PRIME), which STUTTERS badly at 2560x1600@240 — the desktop feels laggy even
# though the GPU is stronger. Been there, reverted it. The dGPU strength is for
# GAMES, not for compositing the desktop.
#
# For fast games (Minecraft!): launch them with `prime-run <cmd>` — that runs
# the game 100% on the RTX 4070 while the desktop stays smooth on Intel. This is
# the correct split, and it's why Minecraft was "mid": it wasn't offloaded.
#
# aquamarine wants the REAL /dev/dri/cardN nodes (rejects by-path symlinks).
# Order = Intel first. Mapping: card0=NVIDIA(0x10de), card1=INTEL(0x8086). If a
# kernel update renumbers them (black screen), check and fix with:
#   for c in /sys/class/drm/card[0-9]/device/vendor; do echo "$c $(cat $c)"; done
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0
env = __GLX_VENDOR_LIBRARY_NAME,mesa
# HW video decode on the Arc iGPU (needs: paru -S intel-media-driver)
env = LIBVA_DRIVER_NAME,iHD
# GTK4 defaults to its Vulkan renderer, which with both GPUs present picks the
# discrete one — force the GL renderer so GTK4 apps use the iGPU (no dGPU wake).
env = GSK_RENDERER,gl
# App-toolkit env, same set mango exports.
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1
env = _JAVA_AWT_WM_NONREPARENTING,1

# ── Cursor (macOS) ──────────────────────────────────────────────────────────
# macOS pointer (apple_cursor v2.0.1) converted to hyprcursor with hyprcursor-util
# and merged with its xcursor form into one theme dir, tracked in the dotfiles at
# linux/.local/share/icons/macOS (hyprcursors/ + cursors/ side by side).
# HYPRCURSOR = crisp scalable cursor for Wayland-native apps + Hyprland itself.
# XCURSOR = same macOS theme for XWayland apps (games, some Electron).
env = HYPRCURSOR_THEME,macOS
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,macOS
env = XCURSOR_SIZE,24
# If the cursor ever flickers/disappears on Nvidia, uncomment:
# cursor { no_hardware_cursors = true }

# ── Autostart (mirrors your sway `exec` lines; autotiling-rs dropped —
#    Hyprland's dwindle layout auto-tiles natively) ──────────────────────────
exec-once = dbus-update-activation-environment --all
exec-once = dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = /usr/lib/xdg-desktop-portal-hyprland
exec-once = /usr/libexec/xdg-desktop-portal
exec-once = hypridle
# The Hyprland bar, not the shared config. config.jsonc's modules-left is
# custom/mangotags + custom/mangotitle streaming mango's IPC, which under
# Hyprland idle to an empty label -- no tags, no title. config-hyprland.jsonc is
# a small `include` overlay on it that swaps in the native hyprland/workspaces +
# hyprland/window modules and inherits everything else. style.css is found in
# ~/.config/waybar on its own, so coat still owns the colours.
exec-once = waybar -c /home/amarnath/.config/waybar/config-hyprland.jsonc
# fnott, not dunst: dunst is retired here. fnott is a coat module, is in OpenBSD
# ports, and the OSD below is a notification, so it draws that too.
exec-once = fnott
# awww, not swaybg: animated gifs and cross-fades, and it survives output hotplug.
exec-once = awww-daemon
exec-once = start-polkit
# audio-ensure, NOT a bare artix-pipewire-launcher. The bare launcher skips
# wireplumber, which leaves a stack that looks alive (pipewire + pipewire-pulse
# up) with nothing but a null sink behind it; audio-ensure detects exactly that
# and repairs it with `artix-pipewire-launcher restart`.
exec-once = audio-ensure
exec-once = refresh-paru-completions
# Clipboard history (cliphist) — recall with $mod+V
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# Keeps the selection alive after the app that owns it exits.
exec-once = wl-clip-persist --clipboard regular
# Load hyprpm plugins (gloview, dynamic-cursors, hyprfocus) on startup
exec-once = hyprpm reload -n
# Smart fullscreen: auto-maximize a lone window on its workspace
exec-once = hypr-smart-full

# ── Input (from sway: flat accel, natural scroll off, fast repeat) ──────────
input {
    kb_layout    = us
    repeat_delay = 200
    repeat_rate  = 50
    follow_mouse = 1
    sensitivity  = 0
    accel_profile = flat
    touchpad {
        natural_scroll = false
    }
}

cursor {
    inactive_timeout = 3   # hide cursor after 3s idle (sway: hide_cursor 3000)
}

# 3-finger touchpad swipe between workspaces (0.53+ gesture syntax)
gesture = 3, horizontal, workspace
# 4-finger swipe up → gloview overview
gesture = 4, up, dispatcher, gloview:toggle

# Touchpad: adaptive acceleration (matches sway's default). The global
# accel_profile=flat above is for mice only, like sway's `input type:pointer`.
device {
    name = asup1207:00-093a:3012-touchpad
    accel_profile = adaptive
    natural_scroll = false
}

# ── Layout / borders / gaps ─────────────────────────────────────────────────
# Geometry is mango's, deliberately: a 10px corner (Big Sur's window radius), a
# hairline border and 30px of gap. The shadow is what separates a window from the
# wallpaper, which is why the border can afford to be 1px.
#
# gaps_in is HALF of what mango calls gappi: Hyprland puts gaps_in on each
# window's own edge, so two neighbours make 30px of gutter, matching gappih=30.
# gaps_out is to the monitor edge and is the same number in both.
general {
    # 2px, not the 1px hairline: the border breathes now (see borderangle in the
    # animations block) and a single pixel of moving gradient is a thing you have
    # to go looking for.
    border_size     = 2
    gaps_in         = 15
    gaps_out        = 30
    layout          = dwindle
    resize_on_border = true
    # border colours from coat variables ($baseXX, sourced above)
    # THREE stops, and the first and last are the same colour. That is what makes
    # the rotation read as BREATHING instead of spinning: with two stops you watch
    # a seam travel around the window, but a symmetric gradient has no seam, so the
    # accent swells through base0C and back with nothing visibly chasing itself.
    col.active_border   = $base0D $base0C $base0D 45deg
    # base03, not base01: base01/02/04/06 are the untrustworthy slots in a lot of
    # base16 schemes -- some resolve within a shade or two of base00 and the
    # border disappears. base03 is mango's bordercolor for the same reason.
    col.inactive_border = $base03
}

dwindle {
    preserve_split  = true
}

# ── Eye candy ───────────────────────────────────────────────────────────────
decoration {
    rounding = 10   # mango's border_radius

    # 0.90 on unfocused windows is mango's unfocused_opacity, and it is the cheap
    # half of "which window am I typing in" -- the other half is the border.
    # App-level transparency (kitty's background from coat) still shows through
    # and gets frosted by the blur below: that is the see-through-terminal look,
    # not this.
    active_opacity   = 1.0
    inactive_opacity = 0.90

    # Blur values copied from mango's blur_params_* so a window looks the same
    # under either compositor. mango: radius 10, 3 passes, noise 0.02,
    # brightness 0.95, contrast 1.0, saturation 1.25.
    blur {
        enabled = true
        size    = 10
        passes  = 3         # 3, not 4: fewer passes against a wide radius leaves
                            # the frost slightly uneven rather than a clean smear,
                            # which is the look — and it is lighter on battery.
        noise      = 0.02
        contrast   = 1.0
        brightness = 0.95
        vibrancy   = 0.25   # Hyprland's saturation-pull knob (default 0.1696)
        vibrancy_darkness = 0.0
        new_optimizations = true
        # For reference, this is HEAVIER than most community configs: JaKooLit's
        # dots run size 6 / passes 2 and a shadow range of 6, and plenty of rices
        # sit at size 3 / passes 3. The wide radius plus the offset shadow below is
        # what makes this read as macOS glass rather than a thin outline -- but if
        # battery life takes a visible hit, 6/2 is the community's answer and the
        # look survives it.
        # true: blur what is behind a translucent window rather than skipping it.
        # This is what frosts the terminal background.
        ignore_opacity = true
        popups   = true     # menus and tooltips get the same glass
        special  = true     # and the scratchpad workspace behind its window
        # xray stays OFF. It blurs the WALLPAPER through everything instead of the
        # windows actually behind you, which flattens the whole stack -- fine for a
        # single-window screenshot, wrong the moment two windows overlap.
        xray = false
    }

    # The macOS signature, and the biggest single win in the whole config. Note
    # the offset: a macOS shadow is cast DOWNWARD, not evenly in a ring, which is
    # what makes a window look lifted rather than outlined. mango: blur 40,
    # size 25, y+12.
    shadow {
        enabled      = true
        range        = 30
        render_power = 3    # lower = gentler falloff (softer edge)
        offset       = 0 12
        scale        = 1.0
        color        = $coat_shadow   # coat base00, alpha set in the template
    }

    # dim_inactive stays off — kinder to OLED and less distracting. The 0.90
    # opacity above already answers "which one is focused".
    dim_inactive = false
}

animations {
    enabled = true

    # macOS motion is SPRING physics (UISpringTimingParameters: mass/stiffness/
    # damping), and Apple's springs are lightly UNDER-damped — quick rise, a
    # small overshoot, then settle. Hyprland has no spring easing, so the honest
    # approximation is a bezier whose 2nd control point pushes past 1.0 to
    # overshoot, then eases back. macSpring overshoots to ~1.1 (a refined settle,
    # NOT the old bubbly wsBounce 1.30). On the way OUT there's no spring, so
    # close/fade use a plain decel curve.
    bezier = macSpring, 0.34, 1.12, 0.44, 1.00   # gentle ~1.1 overshoot + settle (open/spaces)
    bezier = macOut,    0.22, 1.00, 0.36, 1.00   # decel-only, no overshoot (close/fade)
    bezier = macStd,    0.25, 0.10, 0.25, 1.00   # gentle standard (borders)
    # Fades want almost-linear: an eased opacity ramp reads as a flicker at the
    # start and a smear at the end. Same curve Hyprland's own default config uses
    # for its fade nodes.
    bezier = macFade,   0.50, 0.50, 0.75, 1.00

    # Durations are in DECISECONDS: 3.5 = 350ms. These match mango's
    # animation_duration_* (250ms open/close, 350ms move) within a frame.
    #
    # `global` is the parent of the whole tree — anything not named below
    # inherits it, so a node added by a future Hyprland version is animated
    # rather than silently instant.
    animation = global, 1, 3, macSpring

    # ── windows ─────────────────────────────────────────────────────────────
    # popin 94%: scale up from 94% + fade, spring settle — an app window
    # springing into place. In/Out split so closing stays quick; nothing bounces
    # on the way out because a spring-back on a window that is leaving reads as a
    # stutter.
    animation = windows,     1, 3.5, macSpring, popin 94%
    animation = windowsIn,   1, 3.5, macSpring, popin 94%
    animation = windowsOut,  1, 2.2, macOut,    popin 94%
    animation = windowsMove, 1, 3,   macSpring, slide   # retile: springy glide

    # ── borders ─────────────────────────────────────────────────────────────
    animation = border,      1, 3,   macStd
    # The breathing border. `loop` rotates the gradient forever; 60 = 6s for a
    # full turn, which against the symmetric gradient above is a slow swell rather
    # than a sweep.
    #
    # KNOW WHAT THIS COSTS. It was off for a reason: a looping animation repaints
    # the focused window every frame forever, which measured ~4.5% CPU here and,
    # worse, defeats vfr entirely -- the compositor can never idle the way it does
    # on a still desktop. Duration is NOT a lever on that; 6s and 3s repaint at the
    # same rate, so the only real settings are on and off.
    #
    # `1, 30, linear, once` instead = one sweep on window open, no permanent cost.
    animation = borderangle, 1, 60, linear, loop

    # ── layer surfaces (waybar, fnott, fuzzel) ──────────────────────────────
    # 96% not 94%: a launcher opening from nearly-full-size feels immediate,
    # where a window wants the extra travel.
    animation = layers,      1, 3,   macSpring, popin 96%
    animation = layersIn,    1, 3,   macSpring, popin 96%
    animation = layersOut,   1, 2.2, macOut,    popin 96%

    # ── fades ───────────────────────────────────────────────────────────────
    # Every fade node named explicitly, including the two that are easy to miss:
    # fadeShadow (a shadow appearing with its window instead of popping in) and
    # fadeDim (only visible if dim_inactive is ever turned on, but it costs
    # nothing to have ready).
    animation = fade,           1, 2.5, macOut
    animation = fadeIn,         1, 2,   macFade
    animation = fadeOut,        1, 1.8, macFade
    animation = fadeSwitch,     1, 2,   macFade
    animation = fadeShadow,     1, 2.5, macFade
    animation = fadeDim,        1, 2,   macFade
    animation = fadeLayers,     1, 2,   macFade
    animation = fadeLayersIn,   1, 2,   macFade
    animation = fadeLayersOut,  1, 1.8, macFade

    # ── workspaces ──────────────────────────────────────────────────────────
    # Spaces switch: a deliberate horizontal slide with the spring settle. macOS
    # Spaces are intentionally a touch slower and heavier than a snappy tiler —
    # 4 = 0.4s. Lower toward 3 for snappier, raise toward 5 for cinematic.
    animation = workspaces,     1, 4, macSpring, slide
    animation = workspacesIn,   1, 4, macSpring, slide
    animation = workspacesOut,  1, 4, macSpring, slide
    # The scratchpad "summon" ($mod+grave): the special workspace rises from the
    # bottom and fades in — macOS summoning a panel from the dock — and reverses
    # on dismiss. slidefadevert combines the vertical slide with the fade; 40%
    # keeps the rise short and floaty rather than a full-height sweep.
    animation = specialWorkspace, 1, 3.5, macSpring, slidefadevert 40%

    # ── misc ────────────────────────────────────────────────────────────────
    # The compositor-level zoom (cursor:zoom_factor). Animated so a zoom in or
    # out ramps instead of jumping a magnification step.
    animation = zoomFactor,  1, 3, macOut
}

# ── Other animation styles ──────────────────────────────────────────────────
# Drop-in replacements for the bezier + animation lines above. Comment the macOS
# set out, paste one in, $mod+Shift+C to reload. If a node name is ever rejected
# after a Hyprland update, `hyprctl configerrors` names it — the tree above is
# 0.56's.
#
# 1. HYPRLAND STOCK — what ships in the example config. Fast, no overshoot at
#    all, shortest of the three. The reference point for "does my curve actually
#    feel better than the default".
#
#    bezier = easeOutQuint,  0.23, 1.00, 0.32, 1.00
#    bezier = easeInOutCubic,0.65, 0.05, 0.36, 1.00
#    bezier = almostLinear,  0.50, 0.50, 0.75, 1.00
#    bezier = quick,         0.15, 0.00, 0.10, 1.00
#    animation = windows,    1, 4.79, easeOutQuint
#    animation = windowsIn,  1, 4.1,  easeOutQuint, popin 87%
#    animation = windowsOut, 1, 1.49, linear,       popin 87%
#    animation = border,     1, 5.39, easeOutQuint
#    animation = fade,       1, 3.03, quick
#    animation = layers,     1, 3.81, easeOutQuint
#    animation = layersIn,   1, 4,    easeOutQuint, fade
#    animation = layersOut,  1, 1.5,  linear,       fade
#    animation = workspaces, 1, 1.94, almostLinear, fade
#
# 2. BUBBLY — this config's own earlier style (commit 3259764) plus the
#    community's `overshot`, which is the single most copied curve in Hyprland
#    ricing. wsBounce overshoots to 1.30 versus macSpring's 1.12, so windows
#    visibly bounce past their target and spring back. Playful; gets tiring on a
#    work machine, which is why it went.
#
#    bezier = overshot, 0.05, 0.90, 0.10, 1.05
#    bezier = wsBounce, 0.22, 1.30, 0.30, 1.00
#    bezier = ease,     0.25, 0.10, 0.25, 1.00
#    animation = windows,    1, 2.5, wsBounce, popin 90%
#    animation = windowsOut, 1, 2,   ease,     popin 90%
#    animation = border,     1, 2.5, ease
#    animation = layers,     1, 3,   wsBounce, popin 80%
#    animation = fade,       1, 2,   ease
#    animation = workspaces, 1, 2.4, wsBounce, slide
#
# 3. BATTERY — motion kept, cost cut. Halve every duration, one decel curve, no
#    overshoot (an overshoot repaints past the target and back), and slidevert on
#    spaces because a vertical slide moves fewer pixels than a horizontal one on
#    a 2560-wide panel. Cheaper still: `enabled = false`, which is one line and
#    loses the whole look — try this first.
#
#    bezier = fast, 0.22, 1.00, 0.36, 1.00
#    animation = global,     1, 1.5, fast
#    animation = windows,    1, 1.5, fast, popin 97%
#    animation = windowsOut, 1, 1,   fast, popin 97%
#    animation = fade,       1, 1,   fast
#    animation = workspaces, 1, 1.5, fast, slidevert
#    animation = borderangle, 0, 30, linear

misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    force_default_wallpaper  = 0   # awww draws the wallpaper (exec-once above)
}

# ── Smart fullscreen ────────────────────────────────────────────────────────
# A single tiled window on a workspace is put into true fullscreen (bar hidden)
# by the smart-fullscreen daemon (see autostart). Opening a second window drops
# it back to tiling.

# ── Window rules (0.53+ syntax: match conditions first, then rule + value) ──
#windowrule = match:class ^(pavucontrol|nm-connection-editor|blueman-manager)$, float on
windowrule = match:title ^(Open File|Save File|Choose Files|Save As)$, float on
# Picture-in-Picture: float + pin across workspaces
#windowrule = match:title Picture-in-Picture, float on
windowrule = match:title Picture-in-Picture, pin on

# ── Layer blur (0.53+ syntax) ───────────────────────────────────────────────
# The bar, the notifications and the launcher get the same glass as windows --
# mango does this with blur_layer=0 and it is half of why the setup reads as one
# surface rather than a bar sitting on top of a desktop.
#
# waybar's own background is transparent (coat's template paints no background on
# the window, only the module text), so what gets frosted here is the wallpaper
# behind a full-width strip. If the bar ever goes opaque again this line quietly
# becomes a no-op rather than breaking anything.
#
# Namespaces: `hyprctl layers` prints them if a rule does not take. fnott's is
# its own name; the `notifications` line is dunst's and is kept only because it
# costs nothing if no such layer exists.
layerrule = match:namespace waybar, blur on
layerrule = match:namespace fnott, blur on
layerrule = match:namespace notifications, blur on
layerrule = match:namespace launcher, blur on

# ── Plugins (hyprpm) ────────────────────────────────────────────────────────
# Enable each once, then `exec-once = hyprpm reload -n` above loads them on every
# startup. hyprpm builds from source and pins to the running Hyprland's ABI, so
# every one of these needs a rebuild after a compositor update:
#
#   hyprpm add https://github.com/hyprwm/hyprland-plugins   # hyprbars
#   hyprpm add https://github.com/fedsfarm/gloview          # gloview
#   hyprpm add https://github.com/VirtCode/hypr-dynamic-cursors
#   hyprpm add https://github.com/daxisunder/hyprfocus      # hyprfocus
#   hyprpm enable hyprbars gloview dynamic-cursors hyprfocus
#
# NEVER sudo hyprpm: the cache lives in /var/cache/hyprpm/$USER and a root run
# leaves it owned by root, at which point every later hyprpm call fails.
plugin {
    # gloview: macOS Mission-Control-style overview, github.com/fedsfarm/gloview.
    # Replaces hymission (which black-screen-crashed on 0.56) and Hyprspace before
    # it. Dispatcher `gloview:toggle`, bound to $mod+A and 4-finger swipe up below;
    # it also has gloview:desktop and gloview:allworkspaces if you want the
    # show-desktop and all-workspaces expo views on their own keys. Full config
    # keys under plugin:gloview:* — see the repo table.
    gloview {
        strip_offset        = 44                # push the top strip below the 36px waybar
        # colours from coat variables (sourced above)
        backdrop_color      = $coat_ov_backdrop
        strip_active_border = $coat_ov_accent
        select_border       = $coat_ov_accent
        hover_border        = $coat_ov_accent2
    }

    # dynamic-cursors: physics-y cursor. mode=stretch squishes the cursor in the
    # direction of motion (comic-style); shake-to-find disabled.
    # x86_64 only. `hyprpm add https://github.com/VirtCode/hypr-dynamic-cursors`
    dynamic-cursors {
        enabled   = true
        mode      = stretch
        threshold = 2   # min angle change (deg) before reshaping; smaller = smoother
        shake {
            enabled = false
        }
    }

    # hyprglass removed — its liquid-glass render didn't work on 0.56 and only
    # fought Hyprland's native blur. Native blur + kitty's transparent bg gives
    # the frosted look instead. Re-trial when it supports 0.56: re-add the block,
    # `hyprpm enable hyprglass`.

    # hyprfocus: subtle flash when window focus changes. The lineage matters when
    # re-adding it — the original VortexCoyote/hyprfocus is unmaintained, pyt0xic
    # forked it and now points at github.com/daxisunder/hyprfocus, which is the one
    # that tracks current Hyprland. The key names below are the same across all
    # three. Note hyprwm/hyprland-plugins ships its OWN hyprfocus (a different
    # plugin, same name); this config is not written for that one.
    hyprfocus {
        enabled = yes
        animate_floating = yes
        animate_workspacechange = yes
        focus_animation = flash
        bezier = focusIn,  0.15, 0.85, 0.30, 1.05
        bezier = focusOut, 0.20, 0.60, 0.35, 1.00
        # Only `flash` is configurable in the hyprwm build that actually loads:
        # focus_animation accepts the string "bounce" but there is no
        # plugin:hyprfocus:bounce:* section behind it, so it animates with
        # nothing to tune. Staying on flash and tuning the flash instead.
        #
        # The shape that reads well: dip FAST, recover SLOW. in_speed 0.6 makes
        # the dip quick enough to register as a flash rather than a fade, and
        # out_speed 1.8 (was 2.5) lets the window ease back instead of snapping,
        # which is the half that looked cheap. 0.70 because inactive_opacity is
        # 0.90 -- the dip has to go clearly below where the eye is coming from.
        flash {
            flash_opacity = 0.70
            in_bezier  = focusIn
            in_speed   = 0.6
            out_bezier = focusOut
            out_speed  = 1.8
        }
    }

    # hyprbars: macOS traffic-light title bars, from the official
    # hyprwm/hyprland-plugins repo. ENABLED — the old square-corner
    # "ghost" that forced this off is no longer visible now that gaps are larger.
    # If it ever returns after an update: `hyprpm disable hyprbars`.
    hyprbars {
        bar_height   = 28                       # ~macOS title bar height
        bar_color    = $coat_shadow             # frosted bar tint from coat (base00)
        bar_blur     = false                     # frost the bar like the rest of the glass
        col.text     = $base05                  # coat foreground — contrasts base00 in both light/dark
        bar_text_size   = 12
        bar_text_font   = MartianMono Nerd Font Mono  # coat.yaml's monospace family
        bar_text_weight = 600                   # semibold — macOS title weight
        bar_text_align  = center                # macOS centres the window title
        bar_title_enabled = true
        # Traffic lights on the LEFT, macOS placement (0.56 supports this).
        bar_buttons_alignment = left
        bar_padding        = 12                 # gap from the left edge to first dot
        bar_button_padding = 8                  # gap between the three dots
        icon_on_hover      = true               # glyphs (× − +) appear only on hover, like macOS
        inactive_button_color = $base03         # coat muted tone — dots grey out when unfocused, like macOS
        bar_part_of_window        = true        # bar counts as window (keeps rounding sane)
        bar_precedence_over_border = true
        on_double_click = hyprctl dispatch fullscreen 1   # macOS: double-click title bar = zoom

        # Syntax: bgcolor, size, icon, on-click, fgcolor(glyph). Order L→R with
        # left alignment: red, yellow, green — mapped to coat's base08/base0A/base0B
        # accents (base16's red/yellow/green slots) instead of fixed macOS hex.
        # Glyph uses base00 for contrast against whatever those accents resolve to.
        # No real "minimize" in a tiler, so yellow stashes to the scratchpad; green zooms.
        hyprbars-button = $base08, 12, ×, hyprctl dispatch killactive,                    $base00
        hyprbars-button = $base0A, 12, −, hyprctl dispatch movetoworkspace special:magic, $base00
        hyprbars-button = $base0B, 12, +, hyprctl dispatch fullscreen 1,                   $base00
    }
}

# ── Keybinds (your sway binds + Hyprland-native extras) ──────────────────────
bind = $mod, Q, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, C, killactive
bind = $mod SHIFT, C, exec, hyprctl reload
# swaylock, not hyprlock: swaylock is the locker for the whole setup and coat
# themes it live, while hyprlock's colours are hardcoded. hyprlock.conf is
# still on disk -- swap both this bind and hypridle.conf back to use it.
# The pgrep guard matters: session-lock allows exactly one lock client, so a
# manual lock on top of an idle lock used to give two password prompts.
bind = $mod, L,      exec, hyprlock
bind = $mod, Escape, exec, pgrep -x swaylock >/dev/null || swaylock -f
# The bar has no toggle script any more; SIGUSR1 is waybar's own show/hide.
# NEVER SIGUSR2 -- it aborts waybar instead of reloading it.
bind = $mod, P, exec, pkill -SIGUSR1 -x waybar
bind = $mod, T, exec, theme-pick                     # fuzzel coat scheme picker
bind = $mod SHIFT, T, exec, theme-random             # random coat scheme
bind = $mod SHIFT, S, exec, screenshot
bind = $mod SHIFT, E, exec, screenshot-edit
# Through `menu`, not fuzzel directly -- same reason as $menu above. This is
# also where the old $mod+Delete wlboard bind went; one clipboard key.
bind = $mod, V, exec, cliphist list | menu -i -p clip | cliphist decode | wl-copy
bind = $mod SHIFT, V, togglefloating
bind = $mod, F,       fullscreen, 1   # maximize: fills the screen, keeps the bar + gaps
bind = $mod SHIFT, F, fullscreen, 0   # true fullscreen: covers everything, bar hidden
bind = $mod, M,       fullscreen, 1   # maximize (same as $mod+F) — kept for muscle memory

# ── Hyprland-native window management (no sway equivalent) ──────────────────
# Scratchpad: a hidden "special" workspace you toss a window into and toggle
# on top of anything. Great for a dropdown terminal, notes, music, chat.
bind = $mod, grave,       togglespecialworkspace, magic
bind = $mod SHIFT, grave, movetoworkspace, special:magic

# Tabbed window groups: stack windows into one tabbed container (like browser
# tabs). $mod+G groups/ungroups; $mod+Tab cycles tabs within the group.
bind = $mod, G,   togglegroup
bind = $mod, Tab, changegroupactive, f

# Dwindle layout controls
bind = $mod, backslash, layoutmsg, togglesplit   # flip the split direction
bind = $mod, U,         pseudo        # pseudo-tile: float-size inside the tile

# gloview plugin: Mission-Control overview (enable via hyprpm first)
bind = $mod, A, gloview:toggle

# Focus (arrows)
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Move window (arrows + vim keys)
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move container to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Mouse: hold $mod to drag-move / drag-resize (sway floating_modifier)
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Resize submap ($mod+R, then arrows/hjkl, Esc/Enter to exit) — like sway's resize mode
bind = $mod, R, submap, resize
submap = resize
binde = , left,  resizeactive, -20 0
binde = , right, resizeactive,  20 0
binde = , up,    resizeactive,  0 -20
binde = , down,  resizeactive,  0  20
binde = , H, resizeactive, -20 0
binde = , L, resizeactive,  20 0
binde = , K, resizeactive,  0 -20
binde = , J, resizeactive,  0  20
bind = , escape, submap, reset
bind = , return, submap, reset
submap = reset

# ── Media / brightness keys (from sway) ─────────────────────────────────────
# `osd` does the change AND draws the on-screen display, as a notification that
# replaces the previous one. It replaces volumectl + avizo/lightctl + swayosd +
# wob all at once: there is no OSD daemon here by design, so there is nothing to
# kill on a theme change and nothing to silently die and take the media keys
# with it. The backlight device (intel_backlight -- the OLED panel is on the
# Intel card, not nvidia_0) is baked into the script, so no -D flag here.
bindel = , XF86AudioRaiseVolume,  exec, osd volume up
bindel = , XF86AudioLowerVolume,  exec, osd volume down
bindl  = , XF86AudioMute,         exec, osd volume mute
bindl  = , XF86AudioMicMute,      exec, osd mic mute
bindl  = , XF86AudioPlay,         exec, osd playpause
bindl  = , XF86Launch3,           exec, osd playpause
bindl  = , XF86AudioNext,         exec, osd next
bindl  = , XF86AudioPrev,         exec, osd prev
# Still requires the kernel param i915.enable_dpcd_backlight=1 for the control
# to actually reach the panel.
bindel = , XF86MonBrightnessUp,   exec, osd brightness up
bindel = , XF86MonBrightnessDown, exec, osd brightness down
# Keyboard backlight. bindel so holding the key repeats. If the firmware turns
# out to step the LED itself these would double-step -- change both to
# `osd kbd show`, which only reports.
bindel = , XF86KbdBrightnessUp,   exec, osd kbd up
bindel = , XF86KbdBrightnessDown, exec, osd kbd down
# fn+F10. Was hypr-touchpad-toggle, which is deleted: osd does the same
# hyprctl device[...] flip and draws the popup, and it is now the only thing
# that touches the flag file both compositors share.
bindl  = , XF86TouchpadToggle,    exec, osd touchpad
# Lock keys. Binding them does not stop them working -- the compositor only
# declines to forward the key to the client, and xkb has already processed the
# keycode and pushed the LED. osd waits out the few ms before reading it.
bindl  = , Caps_Lock,             exec, osd capslock
bindl  = , Num_Lock,              exec, osd numlock

