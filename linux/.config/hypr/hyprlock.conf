# ~/.config/hypr/hyprlock.conf — Hyprland lock screen.
#
# THE active locker under Hyprland: $mod+L and every hypridle path call hyprlock.
# mango reaches this through swayidle; hyprlock speaks ext-session-lock, not a
# Hyprland-only protocol, so the same locker serves both sessions.
#
# Colours and the font come from coat: the hyprland module writes coat-theme.conf
# and this file sources it, so `coat apply hyprland` retints and re-fonts the lock
# screen too ($coat_font, $coat_font_size). Nothing below is a hardcoded colour or
# family except the placeholder's pango span, which cannot take a variable.

source = ~/.config/hypr/coat-theme.conf

# ── Motion ───────────────────────────────────────────────────────────────────
# Speeds are deciseconds (7 = 700ms).
#
#   silk — easeOutExpo. Big fast start, long glide. For the unlock, which wants
#          to get out of the way immediately.
#   veil — ease-in-out. Starts gently instead of snapping. For the LOCK, where
#          easeOutExpo read as the screen slamming shut and then crawling.
#
# No overshoot anywhere, matching hyprland.lua. The old `pop` curve was
# easeOutBack (0.34, 1.56) -- the 1.56 carried the dots past their size and back,
# which is the jiggle that got removed everywhere else.
animations {
    enabled = true

    bezier = silk, 0.16, 1.00, 0.30, 1.00
    bezier = veil, 0.45, 0.05, 0.25, 1.00
    bezier = ease, 0.25, 0.10, 0.25, 1.00

    # Lock takes 600ms and eases in; unlock stays the quick 400ms it was.
    animation = fadeIn,  1, 6, veil
    animation = fadeOut, 1, 4, ease

    # Password field: dots scale in, the outline slides between
    # idle -> checking -> fail, and the field widens for the fail text.
    animation = inputFieldDots,   1, 2, silk
    animation = inputFieldColors, 1, 4, silk
    animation = inputFieldFade,   1, 4, silk
    animation = inputFieldWidth,  1, 3, silk
}

general {
    hide_cursor = true
    text_trim = true
    # How long the fail message sticks around before the field resets.
    fail_timeout = 2000
    # grace and the fade toggles are CLI-only in 0.9.x: --grace, --no-fade-in.
}

# ── Background ───────────────────────────────────────────────────────────────
# Blurred snapshot of whatever was on screen when you locked, so it reads right
# under any coat scheme.
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 7
    noise = 0.0117
    contrast = 0.9
    brightness = 0.72
    vibrancy = 0.20
    vibrancy_darkness = 0.05
    zindex = -10
}

# ── Depth ────────────────────────────────────────────────────────────────────
# A smoked card that lifts the whole cluster off the blur, plus an accent
# hairline under the clock. Both above the background, below every label.
shape {
    monitor =
    size = 620, 470
    color = $coat_ov_backdrop
    rounding = 28
    border_size = 1
    border_color = $base03
    position = 0, 60
    halign = center
    valign = center
    zindex = -5
    shadow_passes = 4
    shadow_size = 14
    shadow_color = $coat_shadow
    shadow_boost = 1.4
}

shape {
    monitor =
    size = 96, 2
    color = $base0D
    rounding = 1
    border_size = 0
    position = 0, 178
    halign = center
    valign = center
    zindex = -4
}

# ── Clock ────────────────────────────────────────────────────────────────────
# Hours, minutes and seconds are ONE label, not two.
#
# They used to be separate, with the seconds pinned at `position = 152, 232`
# against a clock at `0, 268` -- a hand-measured offset standing in for the
# clock's glyph metrics. It cannot track them: the offset was computed for one
# font at one size, so the seconds sat off the baseline and drifted the moment
# either changed.
#
# A pango span inside the same label has no such problem. `rise` lifts the
# seconds to superscript against the SAME baseline the hours sit on, and `size`
# is a percentage of this label's font_size, so both follow font_size together.
#
# alpha rather than a colour: the accent would have to be hardcoded here, and
# pango markup is one of the few places coat's variables cannot reach.
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M<span size="34%" rise="46pt" alpha="60%">%S</span>'
    font_size = 92
    font_family = $coat_font
    color = $base07
    position = 0, 268
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 5
    shadow_color = $coat_shadow
    shadow_boost = 1.2
}

# ── Date ─────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +'%A, %B %d'
    font_size = 20
    font_family = $coat_font
    color = $base05
    position = 0, 132
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $coat_shadow
}

# ── User ─────────────────────────────────────────────────────────────────────
label {
    monitor =
    text =   $USER
    font_size = 15
    font_family = $coat_font
    color = $base05
    position = 0, 40
    halign = center
    valign = center
}

# ── Password field ───────────────────────────────────────────────────────────
# rounding = -1 is a full pill; dots_rounding = -1 makes the dots circles.
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = -1
    dots_size = 0.26
    dots_spacing = 0.35
    dots_rounding = -1
    dots_center = true
    outer_color = $base0D
    inner_color = $coat_ov_backdrop
    font_color = $base07
    check_color = $base0C
    fail_color = $base08
    capslock_color = $base0A
    numlock_color = $base0E
    bothlock_color = $base09
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <i>password</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -60
    halign = center
    valign = center
    zindex = 5
    shadow_passes = 3
    shadow_size = 8
    shadow_color = $coat_shadow
    shadow_boost = 1.2
}
