# Colours and font come from hyprlock-colors.conf, which hyprland.lua writes
# from coat-colors.lua. It is untracked, so a theme switch leaves git clean.
source = ~/.config/hypr/hyprlock-colors.conf

background {
    color = rgb($base00)
}

input-field {
    size = 320, 64
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb($base0D)
    inner_color = rgb($base00)
    font_color = rgb($base05)
    fail_color = rgb($base08)
    check_color = rgb($base0C)
    capslock_color = rgb($base0A)
    position = 0, -80
    halign = center
    valign = center
    fade_on_empty = false
    placeholder_text = <i>password</i>
    hide_input = false
    rounding = 10
    font_family = $font
    font_size = 18
}

label {
    text = $TIME
    color = rgb($base05)
    font_family = $font
    font_size = 64
    position = 0, 120
    halign = center
    valign = center
}

label {
    text = $LAYOUT
    color = rgb($base05)
    font_family = $font
    font_size = 18
    position = 0, 35
    halign = center
    valign = center
}
