# Colours and font come from hyprlock-colors.conf, which hyprland.lua writes
# from coat-colors.lua. It is untracked, so a theme switch leaves git clean.
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = false
}

# Fade the lock UI in/out over the desktop, plus smooth input field motion
animations {
    enabled = true
    bezier = easeOutQuint, 0.22, 1, 0.36, 1
    bezier = easeInQuint, 0.64, 0, 0.78, 0
    animation = fadeIn, 1, 6, easeOutQuint
    animation = fadeOut, 1, 5, easeInQuint
    animation = inputFieldFade, 1, 3, easeOutQuint
    animation = inputFieldColors, 1, 4, easeOutQuint
    animation = inputFieldWidth, 1, 3, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

# Blurred, dimmed screenshot of your desktop
background {
    monitor =
    path = screenshot
    color = rgb($base00)
    blur_passes = 4
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.25
    vibrancy_darkness = 0.2
}

# Greeting
label {
    monitor =
    text = 󰌾  locked
    color = rgb($base04)
    font_size = 16
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    position = 0, 260
    halign = center
    valign = center
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb($base0D)
    font_size = 140
    font_family = $font
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgb($base00)
    position = 0, 140
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgb($base05)
    font_size = 22
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    position = 0, 30
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 340, 62
    outline_thickness = 3
    rounding = 20

    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1

    outer_color = rgb($base0D) rgb($base0E) 45deg
    inner_color = rgb($base01)
    font_color = rgb($base05)
    check_color = rgb($base0C) rgb($base0D) 120deg
    fail_color = rgb($base08) rgb($base0A) 40deg
    capslock_color = rgb($base0A)
    font_family = $font

    fade_on_empty = false
    hide_input = false
    placeholder_text = <span foreground="##$base04"><i>󰌾  $USER</i></span>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgb($base00)

    position = 0, -80
    halign = center
    valign = center
}

# Keyboard layout, small, under the input
label {
    monitor =
    text = $LAYOUT
    color = rgb($base03)
    font_size = 14
    font_family = $font
    position = 0, -150
    halign = center
    valign = center
}
