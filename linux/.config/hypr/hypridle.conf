general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = idle-guard now
    after_sleep_cmd = idle-guard wake
}

listener {
    timeout = 300
    on-timeout = idle-guard lock
    on-resume = idle-guard cancel
}

listener {
    timeout = 330
    on-timeout = idle-guard blank
    on-resume = idle-guard wake
}
