# ~/.config/hypr/hypridle.conf — idle daemon for Hyprland.
#
# The counterpart to ~/.config/hypridle/config, which is what mango runs: same
# 300s/600s timings, same locker. Note $mod+L in hyprland.conf uses hyprlock while
# the idle path here locks with hyprlock, which coat themes live.
#
# The pgrep guard is not optional -- session-lock allows exactly one lock client,
# so a manual lock plus an idle lock gave two password prompts.
#
# Blanking goes through hyprctl dpms rather than hypridle's wlopm: native, and no
# extra binary.

general {
    lock_cmd         = pgrep -x hyprlock >/dev/null || hyprlock
    before_sleep_cmd = pgrep -x hyprlock >/dev/null || hyprlock
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# Lock after 5 minutes idle
# Through idle-guard, not straight to the locker: hypridle fires on INPUT
# idleness alone, so watching a video with the keyboard untouched used to lock the
# screen mid-playback. idle-guard waits out anything that is actually playing, and
# on-resume kills it if you come back first.
#
# It also fixes a real bug in passing -- `hyprlock -f` was wrong. hyprlock has no
# -f flag (that is swaylock's), so this lock silently failed every time.
listener {
    timeout    = 300
    on-timeout = idle-guard lock
    on-resume  = idle-guard cancel
}

# Displays off after 10 minutes
listener {
    timeout    = 600
    on-timeout = idle-guard dpms
    on-resume  = idle-guard cancel; hyprctl dispatch dpms on
}
