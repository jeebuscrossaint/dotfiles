# ~/.config/hypr/hypridle.conf — idle daemon for Hyprland
#
# The Hyprland-native counterpart to ~/.config/swayidle/config, which is what
# mango runs. Same 300s/600s timings, same locker: swaylock, not hyprlock.
# swaylock is the locker for the whole setup and coat themes it live; hyprlock's
# colours are hardcoded. hyprlock.conf is still on disk if you want it back --
# swap the four commands below and the $mod+L/$mod+Escape binds in hyprland.conf.
#
# The pgrep guard is not optional: the session-lock protocol allows exactly one
# lock client, so a manual lock plus an idle lock used to raise two password
# prompts.
#
# Blanking goes through hyprctl dpms rather than swayidle's `wlopm --off "*"`.
# Both work under Hyprland; dpms is native and needs no extra binary.

general {
    lock_cmd         = pgrep -x swaylock >/dev/null || swaylock -f
    before_sleep_cmd = pgrep -x swaylock >/dev/null || swaylock -f
    after_sleep_cmd  = hyprctl dispatch dpms on      # wake displays on resume
}

# Lock after 5 minutes idle
listener {
    timeout    = 300
    on-timeout = pgrep -x swaylock >/dev/null || swaylock -f
}

# Turn the displays off after 10 minutes; back on when you return
listener {
    timeout    = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
