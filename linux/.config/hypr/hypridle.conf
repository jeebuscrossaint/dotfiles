# ~/.config/hypr/hypridle.conf — idle daemon for Hyprland.
#
# Locking goes through ~/.local/bin/lock, which picks the shell's lock when the
# shell is running and hyprlock otherwise -- one place, so this file, idle-guard
# and the mod+L keybind cannot disagree about which locker is in charge. The
# guard inside it is not optional: session-lock allows exactly one lock client,
# and a manual lock on top of an idle lock gave two stacked password prompts.
#
# Blanking goes through hyprctl dpms: native, and no extra binary.

general {
    lock_cmd         = lock
    before_sleep_cmd = lock
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# Everything below goes through idle-guard rather than straight at the locker or
# dpms, because hypridle fires on INPUT idleness alone: a video watched with the
# keyboard untouched used to blank and lock mid-playback. idle-guard waits out
# anything that is audibly playing and on-resume kills it if you come back first.
#
# Video with no sound is already covered a layer down -- mpv and the browsers
# hold a wayland idle inhibitor while playing, and Hyprland then never reports
# the session idle, so no listener here fires at all.

# Screen off after 2 minutes
listener {
    timeout    = 120
    on-timeout = idle-guard dpms
    on-resume  = idle-guard cancel; hyprctl dispatch dpms on
}

# Lock after 5 minutes
listener {
    timeout    = 300
    on-timeout = idle-guard lock
    on-resume  = idle-guard cancel
}

# Blank again 10s after the lock. hyprlock's session-lock surface wakes the
# outputs when it appears, and hypridle fires each listener only once per idle
# period -- without this the panel sits lit on the lockscreen until you touch a
# key, which an OLED does not forgive.
listener {
    timeout    = 310
    on-timeout = idle-guard dpms
    on-resume  = idle-guard cancel; hyprctl dispatch dpms on
}
