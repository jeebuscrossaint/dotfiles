general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = niri msg action power-on-monitors || wlopm --on '*'
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = niri msg action power-off-monitors || wlopm --off '*'
    on-resume = niri msg action power-on-monitors || wlopm --on '*'
}
