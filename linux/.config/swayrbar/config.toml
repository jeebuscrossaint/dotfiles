# swayrbar — status_command for swaybar (the bar block lives in
# ~/.config/sway/coat-bar, generated by coat's swaybar module).
#
# Layout note: swaybar right-aligns the status line, so every module here sits
# on the RIGHT of the bar. Workspaces, the binding-mode indicator and the tray
# are drawn by swaybar itself on the left — they are not modules.
#
# `window` is deliberately FIRST. swayrbar can't truncate titles, and when the
# status line overflows swaybar clips from the left, so a 200-character Firefox
# title eats itself instead of shoving the clock off the screen.

refresh_interval = 1000

[[modules]]
name = "wttr.in"
instance = "0"
format = "?format=%c+%t"
html_escape = false

[[modules]]
name = "window"
instance = "0"
format = "󰖯 {title}"
html_escape = true

[[modules]]
name = "sysinfo"
instance = "0"
format = "󰻠 {cpu_usage:{:.0}}%  󰍛 {mem_usage:{:.0}}%  󰬺 {load_avg_1:{:.2}}"
html_escape = false

[modules.on_click]
Left = ["kitty", "-e", "btop"]

[[modules]]
name = "battery"
instance = "0"
# {state} is omitted on purpose: with the ASUS charge threshold in play the
# kernel reports "Unknown" rather than Discharging/Full most of the time.
format = "󰁹 {state_of_charge:{:.0}}%"
html_escape = false

[[modules]]
name = "pactl"
instance = "0"
format = "󰕾 {volume:{:3}}%{muted}"
html_escape = true

[modules.on_click]
Left = ["pavucontrol"]
Right = ["pactl", "set-sink-mute", "@DEFAULT_SINK@", "toggle"]
WheelUp = ["pactl", "set-sink-volume", "@DEFAULT_SINK@", "+2%"]
WheelDown = ["pactl", "set-sink-volume", "@DEFAULT_SINK@", "-2%"]

[[modules]]
name = "date"
instance = "0"
format = "󰃰 %a %b %-d  %-I:%M %p"
html_escape = false
