# swayrbar — status_command for swaybar (the bar block lives in
# ~/.config/sway/coat-bar, generated by coat's swaybar module).
#
# Layout note: swaybar right-aligns the status line, so every module here sits
# on the RIGHT of the bar. Workspaces and the binding-mode indicator are drawn
# by swaybar itself on the left — they are not modules. (The tray is disabled
# outright via `tray_output none` in the coat-bar template.)
#
# `window` is deliberately FIRST. swayrbar can't truncate titles, and when the
# status line overflows swaybar clips from the left, so a 200-character Firefox
# title eats itself instead of shoving the clock off the screen.
#
# Modules swayrbar offers that are deliberately unused: `ppd` (needs
# power-profiles-daemon on DBus — not a thing on runit), `mpd` (no mpd
# installed; renders a permanent "disconnected"), `cmd` (would not emit output
# for any config shape tried — assumed broken in 0.5.0).

refresh_interval = 1000

[[modules]]
name = "window"
instance = "0"
format = "󰖯 {title}"
html_escape = true

[[modules]]
name = "wttr.in"
instance = "0"
format = "?format=%c+%t"
html_escape = false

[[modules]]
name = "sysinfo"
instance = "0"
format = "󰻠 {cpu_usage:{:.0}}%  󰍛 {mem_usage:{:.0}}%  󰬺 {load_avg_1:{:.2}} {load_avg_5:{:.2}} {load_avg_15:{:.2}}"
html_escape = false

[modules.on_click]
Left = ["foot", "btop"]

[[modules]]
name = "battery"
instance = "0"
# {state} is omitted on purpose: with the ASUS charge threshold in play the
# kernel reports "Unknown" rather than Discharging/Full most of the time.
# {state_of_health} is also skipped — it drifts over months, not seconds.
format = "󰁹 {state_of_charge:{:.0}}%"
html_escape = false

# The wifi module registers under the name `nmcli`, NOT `wifi` — `name = "wifi"`
# logs "Unknown module name" and is silently dropped. {bars} is a ▂▄▆█ glyph
# meter and {signal} is a percentage; both render with a leading space, hence no
# separator between {name} and {bars}.
[[modules]]
name = "nmcli"
instance = "0"
format = "󰖩 {name}{bars}"
html_escape = false

[modules.on_click]
Left = ["foot", "nmtui"]

# wpctl, not pactl: this box is pipewire, so wireplumber is the native source of
# truth rather than the pulse compatibility shim. {volume} is already an integer
# percent and {muted} expands to " muted".
[[modules]]
name = "wpctl"
instance = "0"
format = "󰕾 {volume:{:3}}%{muted}"
html_escape = true

[modules.on_click]
Left = ["pavucontrol"]
Right = ["wpctl", "set-mute", "@DEFAULT_AUDIO_SINK@", "toggle"]
WheelUp = ["wpctl", "set-volume", "@DEFAULT_AUDIO_SINK@", "2%+"]
WheelDown = ["wpctl", "set-volume", "@DEFAULT_AUDIO_SINK@", "2%-"]

[[modules]]
name = "date"
instance = "0"
format = "󰃰 %a %b %-d  %-I:%M %p"
html_escape = false
