# swayrbar — status_command for swaybar (the bar block lives in
# ~/.config/sway/coat-bar, generated by coat's swaybar module).
#
# Layout note: swaybar right-aligns the status line, so every module here sits
# on the RIGHT of the bar. Workspaces and the binding-mode indicator are drawn
# by swaybar itself on the left — they are not modules. (The tray is disabled
# outright via `tray_output none` in the coat-bar template.)
#
# `window` is deliberately FIRST. swayrbar can't truncate titles, and when the
# status line overflows swaybar clips from the left, so a 200-character Firefox
# title eats itself instead of shoving the clock off the screen. With the module
# set below that title is the only elastic element left — everything after it is
# fixed-width by design.
#
# THE cmd MODULE WORKS. The previous note here claimed it was broken in 0.5.0;
# it was being fed the wrong config shape. There is no {output} placeholder and
# no [modules.cmd] table — `format` IS the shell command, run through `sh -c`,
# and its stdout becomes the block text verbatim. Every cmd module below calls
# ~/.config/swayrbar/barstat, which documents its own cost model.
#
# 0.5.0 has no per-module refresh interval, so EVERY module re-runs once a
# second. barstat is built around that: sysfs reads via shell builtins, and
# cache-with-background-refresh for the two fields that need a subprocess.
# All nine fields together cost ~20ms of CPU per second.
#
# A cmd module that prints nothing is dropped by swaybar, separator included —
# that is how media/swap/fan hide themselves when idle.
#
# Modules swayrbar offers that are deliberately unused: `ppd` (needs
# power-profiles-daemon on DBus — not a thing on runit), `mpd` (no mpd
# installed; renders a permanent "disconnected"), `battery` (superseded by
# barstat's `bat` — see below), `pactl` (this box is pipewire, so wpctl).
#
# Dropped on purpose, not forgotten: pending-update count, dGPU power state and
# ACPI platform profile. All three were built and working — `git show 827bbfb`
# has them if they ever look useful again.
#
# NO [modules.on_click] ANYWHERE, deliberately. This bar displays and does not
# act: no launching pavucontrol/btop/nmtui, no scroll-to-change volume or
# brightness. Do not add handlers back module-by-module — the point is that
# nothing on the bar is a control surface.

refresh_interval = 1000

# ---------------------------------------------------------------- foreground

[[modules]]
name = "window"
instance = "0"
format = "󰖯 {title}"
html_escape = true

# Silent when nothing is playing. html_escape MUST stay true here: the block is
# pango markup and track titles are full of & and <.
[[modules]]
name = "cmd"
instance = "media"
format = "$HOME/.config/swayrbar/barstat media"
html_escape = true

# ------------------------------------------------------------------- network

[[modules]]
name = "cmd"
instance = "net"
format = "$HOME/.config/swayrbar/barstat net"
html_escape = false

# The wifi module registers under the name `nmcli`, NOT `wifi` — `name = "wifi"`
# logs "Unknown module name" and is silently dropped. {bars} is a ▂▄▆█ glyph
# meter and {signal} is a percentage; both render with a leading space, hence no
# separator between {name} and {bars}.
[[modules]]
name = "nmcli"
instance = "0"
format = "󰖩 {name}{bars}"
html_escape = false

# --------------------------------------------------------------------- system

[[modules]]
name = "cmd"
instance = "disk"
format = "$HOME/.config/swayrbar/barstat disk"
html_escape = false

# Only load_avg_1 is shown: three averages cost ~15 columns and the 5/15-minute
# figures never say anything the 1-minute one and the CPU% haven't already.
[[modules]]
name = "sysinfo"
instance = "0"
format = "󰻠 {cpu_usage:{:.0}}%  󰍛 {mem_usage:{:.0}}%  󰬺 {load_avg_1:{:.2}}"
html_escape = false

# Silent below 1%.
[[modules]]
name = "cmd"
instance = "swap"
format = "$HOME/.config/swayrbar/barstat swap"
html_escape = false

# ------------------------------------------------------------------- thermals

[[modules]]
name = "cmd"
instance = "temp"
format = "$HOME/.config/swayrbar/barstat temp"
html_escape = false

# Silent while both fans are stopped, which is most of the time.
[[modules]]
name = "cmd"
instance = "fan"
format = "$HOME/.config/swayrbar/barstat fan"
html_escape = false

# --------------------------------------------------------------------- power

[[modules]]
name = "cmd"
instance = "bl"
format = "$HOME/.config/swayrbar/barstat bl"
html_escape = false

# wpctl, not pactl: this box is pipewire, so wireplumber is the native source of
# truth rather than the pulse compatibility shim. {volume} is already an integer
# percent and {muted} expands to " muted".
[[modules]]
name = "wpctl"
instance = "0"
format = "󰕾 {volume:{:3}}%{muted}"
html_escape = true

# Replaces swayrbar's built-in `battery` module. That one could only offer a
# bare percentage here: with the ASUS 80% charge threshold in play the kernel
# reports status "Not charging" rather than Discharging/Full, so {state} was
# permanently useless. barstat derives the state from AC-online + current_now
# instead, and adds draw in watts and a real time-to-empty.
[[modules]]
name = "cmd"
instance = "bat"
format = "$HOME/.config/swayrbar/barstat bat"
html_escape = false

# ---------------------------------------------------------------------- time

[[modules]]
name = "cmd"
instance = "up"
format = "$HOME/.config/swayrbar/barstat up"
html_escape = false

[[modules]]
name = "wttr.in"
instance = "0"
format = "?format=%c+%t"
html_escape = false

[[modules]]
name = "date"
instance = "0"
format = "󰃰 %a %b %-d  %-I:%M:%S %p"
html_escape = false
