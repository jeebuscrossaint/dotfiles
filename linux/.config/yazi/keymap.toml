# Quick Look is gone with the Quickshell shell -- it was a panel in that shell,
# and nothing in the mango session draws it. Space stays on select-toggle, which
# is yazi's own default, and `t` below is kept so muscle memory still works.
#
# [mgr], not [manager]: yazi renamed the section in 25.x and silently ignores
# the old name.
[[mgr.prepend_keymap]]
on = "t"
run = "toggle --state=none"
desc = "Toggle selection (was space)"
