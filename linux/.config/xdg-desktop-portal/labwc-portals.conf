# Portal backend selection for a labwc session.
#
# This file is why screenshots and screen sharing work under labwc, and it has to
# exist: /usr/share/xdg-desktop-portal/portals/wlr.portal declares
#
#     UseIn=wlroots;sway;Wayfire;river;phosh;Hyprland;
#
# and labwc is NOT in that list, so nothing selects the wlr backend on its own.
# portals.conf takes precedence over a backend's UseIn, so naming wlr here
# overrides the omission. mango does not need an equivalent because the mangowm
# package ships /usr/share/xdg-desktop-portal/mango-portals.conf itself.
#
# The filename must match XDG_CURRENT_DESKTOP, which ~/.config/labwc/environment
# sets to `labwc`. Rename one and the other stops working.
#
# Verify inside a session with:
#   busctl --user list | grep portal
#   XDG_CURRENT_DESKTOP=labwc /usr/lib/xdg-desktop-portal -v -r   # noisy, on demand

[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
