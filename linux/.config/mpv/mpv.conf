# mpv — playback tuned for a 240Hz 10-bit OLED on the Intel iGPU.
#
# There was no mpv.conf at all before this, which also meant coat's theme was
# inert: it writes coat-theme.conf and nothing was including it.

# libplacebo renderer. `profile=high-quality` is the current name for what used to
# be gpu-hq, which is deprecated in 0.41.
vo=gpu-next
profile=high-quality

# Decode on the Arc iGPU via VA-API (LIBVA_DRIVER_NAME=iHD is exported by the
# compositor config). auto-safe rather than a hard `vaapi` so a codec the hardware
# cannot handle falls back to software instead of failing to play.
hwdec=auto-safe

# THE smoothness setting on a high-refresh panel. 24fps content on a 240Hz display
# does not divide evenly, so frames land unevenly and pans judder.
# display-resample retimes the video clock to the display, and interpolation
# synthesises the in-between frames.
#
# tscale=oversample keeps that cheap: it blends only where a frame boundary
# actually falls, so it removes the judder without the softening a wider kernel
# would add on every frame. This matters on an iGPU.
video-sync=display-resample
interpolation=yes
tscale=oversample

# 10-bit panel: let mpv dither to the real depth rather than assuming 8.
dither-depth=auto
