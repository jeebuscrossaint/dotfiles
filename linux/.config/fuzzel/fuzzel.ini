# fuzzel — the launcher, replacing wmenu (which had no .desktop support and took
# colours as CLI flags only).
#
# [colors] and [border] are WRITTEN BY COAT: bare 8-digit rrggbbaa with NO leading
# '#' -- unique to fuzzel here, and a '#' gets the value rejected. Change them in
# coat's templates/fuzzel.tera, not here. Everything else is yours.

font=MartianMono Nerd Font Mono:size=11
dpi-aware=no
prompt="❯ "
# WhiteSur-dark, NOT macOS: `macOS` in ~/.local/share/icons is the CURSOR theme, so
# every entry would silently come up blank.
icon-theme=WhiteSur-dark
icons-enabled=yes
# kitty takes the program directly; -e is not a documented kitty flag.
terminal=kitty
layer=overlay

# `lines` counts entries, not pixels.
width=45
lines=12
horizontal-pad=20
vertical-pad=14
inner-pad=6
line-height=22

# Match the .desktop Name AND the executable, most-used first.
match-mode=fzf
sort-result=yes
show-actions=yes

[border]
width=1
radius=8
# Rounds the highlighted row, so the selection reads as a pill. Colour is in [colors].
selection-radius=6

[colors]
background=1D2021f2
text=D5C4A1ff
match=83A598ff
selection=83A598ff
selection-text=1D2021ff
selection-match=1D2021ff
prompt=665C54ff
placeholder=665C54ff
input=D5C4A1ff
counter=737373ff
message = 665C54ff
border = 83A598ff

[key-bindings]
# delete-line-forward=none is REQUIRED, not decoration: Ctrl+K is fuzzel's default
# for it and it refuses a duplicate binding outright. Ctrl+U still clears the line.
delete-line-forward=none
next=Down Control+j
prev=Up Control+k
