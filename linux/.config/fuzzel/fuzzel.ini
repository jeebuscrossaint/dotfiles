# fuzzel — the launcher, replacing wmenu.
#
# Why fuzzel over wmenu:
#   - it has .desktop support (drun), which wmenu has no concept of. ~/.local/bin/menu-run
#     existed only to fake it by listing every executable on PATH, which meant the
#     launcher offered you things like `[` and `zgrep` and could not show an app's real
#     name or icon.
#   - it has a CONFIG FILE. wmenu takes colours as command-line flags only, so coat had
#     to write a flags fragment and every caller had to remember to source it through
#     ~/.local/bin/menu — the reason `theme-pick` was quietly unthemed for a while.
#   - fuzzy matching, and it highlights the matched characters.
#   - it is Wayland-native (no GTK, unlike wofi).
#   - 1.14.1 in Arch AND in OpenBSD ports, identical. wofi is 1.5.1 there against 1.5.3
#     on Arch, and tofi is not in ports at all.
#
# COLOURS ARE WRITTEN BY COAT and are bare 8-digit hex, rrggbbaa, with NO leading '#'
# (unique to fuzzel among everything here — a '#' gets the value rejected). They live in
# [colors] and [border] below; change them in coat's templates/fuzzel.tera, not here.
# Everything outside those two sections is yours.

font=MartianMono Nerd Font Mono:size=11
dpi-aware=no
prompt="❯ "
# WhiteSur-dark, NOT macOS: `macOS` in ~/.local/share/icons is the CURSOR theme this
# repo ships (it contains cursors/ and nothing else), so app icons would silently fail
# to resolve and every entry would come up blank. WhiteSur-dark is the macOS-style
# application icon theme and has an apps/ tree.
icon-theme=WhiteSur-dark
icons-enabled=yes
# kitty takes the program directly; -e is not a documented kitty flag.
terminal=kitty
layer=overlay

# 45 chars wide and 12 lines: enough to read a real .desktop name without the launcher
# becoming a full-screen overlay. `lines` counts entries, not pixels.
width=45
lines=12
horizontal-pad=20
vertical-pad=14
inner-pad=6
line-height=22

# Match on the .desktop Name AND the executable, so both "Firefox" and "firefox" find
# it, and keep the most-used entries first.
match-mode=fzf
sort-result=yes
show-actions=yes

[border]
width=1
radius=8
# Rounds the highlighted row too, so the selection reads as a pill rather than a
# full-width bar. The border COLOUR is not here -- it lives in [colors] border.
selection-radius=6

[colors]
background=1C1C1Cf2
text=D0D0D0ff
match=5FAFD7ff
selection=5FAFD7ff
selection-text=1C1C1Cff
selection-match=1C1C1Cff
prompt=808080ff
placeholder=808080ff
input=D0D0D0ff
counter=737373ff
message = 808080ff
border = 5FAFD7ff

[key-bindings]
# Ctrl+J/K to move, matching the vim-ish habits the rest of this setup has.
#
# delete-line-forward=none is REQUIRED, not decoration: Ctrl+K is fuzzel's default for
# it, and fuzzel refuses a duplicate binding outright ("Control+k already mapped to
# 'delete-line-forward'"). Its own man page documents this exact swap. Losing
# delete-line-forward costs nothing in a one-line launcher prompt -- Ctrl+U still
# clears the whole thing.
delete-line-forward=none
next=Down Control+j
prev=Up Control+k
