# Added by coat — pulls in the generated colour/font fragment.
# Everything below is yours: coat rewrites the fragment, never this file.
include=/home/amarnath/.config/fuzzel/coat-theme.ini

# fuzzel — the launcher.
#
# Colours, font and popup opacity come from coat via the `include=` line below,
# which coat adds itself. Do NOT set font or a [colors] section here: include is
# resolved where it appears, so anything after it overrides the theme.
#
# Everything in this file is geometry and behaviour, which coat does not touch.
dpi-aware=no
prompt="❯ "
# WhiteSur-dark, NOT macOS: `macOS` in ~/.local/share/icons is the CURSOR theme, so
# every entry would silently come up blank.
icon-theme=WhiteSur-dark
icons-enabled=yes
# kitty takes the program directly; -e is not a documented kitty flag.
terminal=kitty
layer=overlay

# `lines` is the MAXIMUM now, not the height: minimal-lines shrinks the window to
# the number of matches, so a query that narrows to one result collapses the box
# instead of leaving twelve empty rows under it.
#
# width and line-height below are the REFERENCE values, for 2560x1600. fuzzel has
# no percentage units -- width is in characters and line-height is in pixels -- so
# the launcher binds in mango's config.conf scale both by the actual screen and
# pass them on the command line. On a 14" 1920x1080 that is 37 columns and a 17px
# line, where these numbers would have been half again too big. Editing them here
# changes the reference, and therefore both machines; they are also what you get
# launching fuzzel by hand.
width=50
lines=14
minimal-lines=yes
horizontal-pad=24
vertical-pad=18
inner-pad=10
line-height=26

# There is no `counter` key here -- it is CLI-only (`fuzzel --counter`), and as an
# ini key it is rejected, which takes the whole config down with it.
placeholder=Search

# Match the .desktop Name AND the executable, most-used first.
match-mode=fzf
sort-result=yes
show-actions=yes

[border]
width=1
# Tracks mango's border_radius. fuzzel is frosted now (blur_layer=1).
radius=12
selection-radius=8   # inset inside the window corner, so smaller

[key-bindings]
# delete-line-forward=none is REQUIRED, not decoration: Ctrl+K is fuzzel's default
# for it and it refuses a duplicate binding outright. Ctrl+U still clears the line.
delete-line-forward=none
next=Down Control+j
prev=Up Control+k
