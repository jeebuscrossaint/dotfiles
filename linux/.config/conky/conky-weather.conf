-- ~/.config/conky/conky-weather.conf — the slow panel, top-left.
--
-- A second instance rather than more lines on the first one. The main panel is
-- already ~910px of a 1600px screen and this is another ~900px; stacked they do
-- not fit, side by side they do. It is also the honest split by update rate:
-- nothing here changes in a second, so this runs at 30s while the main panel
-- runs at 1s. Idea taken from Ben's setup in the Manjaro Conky Showcase 2026,
-- which uses several instances round the screen edges at different intervals.
--
-- Everything in conky.conf's header applies here too -- no drawing primitives,
-- no ${goto}, exec commands under ~200 chars, and validate by rendering to
-- stdout. Read that file first.

local ok, c = pcall(dofile, os.getenv("HOME") .. "/.config/conky/coat-colors.lua")
if not ok or type(c) ~= "table" then
    c = { font = "monospace", base05 = "D0D0D0", base0D = "8AB4F8",
          base03 = "505050", base08 = "F28B82", base00 = "1C1C1C" }
end

conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',

    update_interval = 30,
    double_buffer = true,
    no_buffers = true,

    alignment = 'top_left',
    gap_x = 24,
    gap_y = 24,
    minimum_width = 460,
    maximum_width = 460,
    border_inner_margin = 0,
    border_outer_margin = 0,

    use_xft = true,
    font = c.font .. ':size=' .. c.font_size,
    override_utf8_locale = true,

    default_color = c.base05,
    color1 = c.base0D,
    color2 = c.base05,
    draw_shades = true,
    default_shade_color = c.base00,

    text_buffer_size = 2048,
    short_units = true,
    pad_percents = 2,
}

conky.text = [[
${execi 1800 (curl -sm 15 'https://wttr.in/?format=j1' -o ~/.cache/wx.new && mv -f ~/.cache/wx.new ~/.cache/conky-wx.json) >/dev/null 2>&1 &}${execpi 1800 jq -rf ~/.config/conky/weather.jq ~/.cache/conky-wx.json 2>/dev/null}
${color2}────────────────────────────────────────────${color}
${color1} ${color}${execi 3600 cal --color=never}
${color2}────────────────────────────────────────────${color}
${color1} ${color}${execi 10 pstree -U -T $(pgrep -x mango) | cut -c1-46 | head -16}
${color2}────────────────────────────────────────────${color}
${color1} ${color}${execi 5 tail -n 6 ~/.cache/notifications.log 2>/dev/null | cut -c1-46}]]
