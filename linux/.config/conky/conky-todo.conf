-- ~/.config/conky/conky-todo.conf — ~/todo.md, top-centre.
--
-- The middle is the only free spot: the readout is pinned at 73 of 80 lines and
-- the tree runs the full height of the left edge. Same font size as the readout,
-- and at most 0.2 of the screen wide so it cannot reach either panel.
--
-- Height is declared for the reason given in conky.conf: the Wayland surface is
-- sized from the first frame and never grows. 40 lines is room to add to the
-- list; the surface is transparent, so the unused part costs nothing.

local c = dofile(os.getenv("HOME") .. "/.config/conky/palette.lua")

local cols, lines = 48, 40
local size = c.fit_size(lines, cols, c.size_desktop, 0.2)

conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',

    update_interval = 5,
    double_buffer = true,
    no_buffers = true,

    alignment = 'top_middle',
    gap_x = 0,
    gap_y = 24,
    minimum_width = math.ceil(cols * c.px_per_col * size),
    maximum_width = math.ceil(cols * c.px_per_col * size),
    minimum_height = math.ceil(lines * c.px_per_line * size),
    border_inner_margin = 0,
    border_outer_margin = 0,

    use_xft = true,
    font = c.font .. ':size=' .. size,
    override_utf8_locale = true,

    default_color = c.base05,
    color1 = c.base05,
    color2 = c.fade(c.base05, 3.5, 2)[2],
    draw_shades = true,
    default_shade_color = c.base00,

    text_buffer_size = 8192,
}

conky.text = [[
${execpi 5 awk -v width=]] .. cols .. [[ -f ~/.config/conky/todo.awk ~/todo.md 2>/dev/null}
]]
