-- ~/.config/conky/conky-left.conf — weather over the process tree, top-left.
--
-- One panel rather than two, so the tree cannot end up overlapping the weather
-- when either changes length. The two halves run at different point sizes, which
-- is the only way both fit: the tree is 66 lines by 104 columns and the weather
-- is 22, and 1600px of screen does not hold both at the size the main panel uses.
-- Measured: weather at 10 plus tree at 9 is ~1541px of a 1576px budget, so those
-- two numbers are load-bearing -- change them in coat.yaml and re-measure.
--
-- Calendar and notifications used to live here and were dropped to make room.
-- notify.awk is still in the repo, so putting the notification feed back is one
-- line here plus one exec-once in mango's config.
--
-- Everything in conky.conf's header applies here too. Read that file first.

local ok, c = pcall(dofile, os.getenv("HOME") .. "/.config/conky/coat-colors.lua")
if not ok or type(c) ~= "table" then
    c = { font = "monospace", font_size = 12, base05 = "D0D0D0",
          base0D = "8AB4F8", base03 = "505050", base00 = "1C1C1C",
          size_popups = 10, size_terminal = 9 }
end

-- Sizes come from coat, one slot per half, so both are settable from coat.yaml
-- rather than being arithmetic on a single number here. See the overrides block
-- there: popups is the weather, terminal is the tree.
local wx_size   = c.size_popups or 10
local tree_size = c.size_terminal or 9

conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',

    update_interval = 10,
    double_buffer = true,
    no_buffers = true,

    alignment = 'top_left',
    gap_x = 24,
    gap_y = 24,
    -- The tree is the wide half and it sets this. MEASURED: SFMono is ~9.9px per
    -- character at size 12, so ~7.4px at 9 -- 104 columns is ~770px, not the
    -- ~662 an earlier estimate gave. Under-sizing clips the deep branches off.
    minimum_width = 790,
    maximum_width = 790,
    border_inner_margin = 0,
    border_outer_margin = 0,

    use_xft = true,
    font = c.font .. ':size=' .. wx_size,
    override_utf8_locale = true,

    default_color = c.base05,
    color1 = c.base0D,
    color2 = c.base05,
    draw_shades = true,
    default_shade_color = c.base00,

    text_buffer_size = 4096,
    short_units = true,
}

conky.text = [[
${execi 1800 (curl -sm 15 'https://wttr.in/?format=j1' -o ~/.cache/wx.new && mv -f ~/.cache/wx.new ~/.cache/conky-wx.json) >/dev/null 2>&1 &}${execpi 1800 jq -rf ~/.config/conky/weather.jq ~/.cache/conky-wx.json 2>/dev/null}
${color2}──────────────────────────────────────────────────────────────────────────────────────────${color}
${color1} ${color}process tree ${color2}${execi 10 ps -e --no-headers | wc -l} procs${color}
${font ]] .. c.font .. ':size=' .. tree_size .. [[}${color2}${execi 10 pstree -U -T 1 | cut -c1-104}${color}${font}]]
