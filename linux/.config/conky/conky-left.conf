-- ~/.config/conky/conky-left.conf — the process tree, top-left.
--
-- The tree alone. The weather used to sit above it in this same window and now
-- lives at the bottom of conky.conf: the tree is 104 columns wide and the
-- weather is 55, so stacking them here padded the weather out with half a screen
-- of nothing, and fitting 66 tree lines plus 22 weather lines on a 1600px panel
-- forced the two halves to different point sizes. One block, one size, no
-- fitting problem -- and the left side is now a single thing.
--
-- The tree is rooted at pid 1, so it holds the ~139 userland processes and NOT
-- the ~257 kernel threads: kthreadd is pid 2, a sibling of pid 1 under pid 0, so
-- that whole subtree is outside the tree by construction rather than by a filter.
-- The header counts both and says so, because a total that does not match what is
-- drawn just looks like the tree is broken.
--
-- pstree also folds identical siblings into N*[name] -- 15 such entries standing
-- for 40 processes here. Left on: -c expands them to 91 lines from 66, which is
-- more of the panel than a process list is worth.
--
-- Calendar and notifications used to live here too and were dropped. notify.awk
-- is still in the repo, so putting the notification feed back is one line here
-- plus one exec-once in mango's config.
--
-- Everything in conky.conf's header applies here too. Read that file first.

local c = dofile(os.getenv("HOME") .. "/.config/conky/palette.lua")

-- The tree's own size slot, so it is settable from coat.yaml without dragging
-- the main panel with it. See the overrides block there.
local tree_size = c.size_terminal or 9

-- The cut width, in characters. One source of truth: the window is sized to it
-- and tree.awk truncates to it.
local tree_cols = 104

-- The depth ramp. tree.awk colours a branch by how deep it is, so the colours
-- have to be ORDERED -- eight unrelated hues told you a line's depth only if you
-- had the legend memorised, which is no better than no colour at all. A ramp
-- reads without one: the shallow processes are the bright plain foreground and
-- each level down slides through the primary into the secondary, so the tree
-- visibly recedes as it gets deeper and the top-level services stay the things
-- you see first.
--
-- Foreground, primary, secondary -- the theme's two accents and nothing else,
-- which is also what the right panel is built from. base05 anchors the shallow
-- end because a ramp between two mid-tone accents has no light end to fall from
-- and stops reading as depth. 3.5 rather than the panel's 4.5: this is a fade,
-- and holding every step to reading contrast would flatten the deep half into
-- the shallow half. See c.lift in palette.lua for why a floor is needed at all.
local depth = c.ramp({ c.base05, c.base0D, c.base0E }, 8, 3.5)

conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',

    update_interval = 10,
    double_buffer = true,
    no_buffers = true,

    alignment = 'top_left',
    gap_x = 24,
    gap_y = 24,
    -- Derived, for the same reason as the main panel: a fixed width does not
    -- track a font size change and the anchor stops meaning anything. 104 is the
    -- cut width the pstree pipeline below truncates to; 0.825px per point is
    -- SFMono's measured advance width.
    minimum_width = math.ceil(tree_cols * tree_size * 0.825),
    maximum_width = math.ceil(tree_cols * tree_size * 0.825),
    border_inner_margin = 0,
    border_outer_margin = 0,

    use_xft = true,
    font = c.font .. ':size=' .. tree_size,
    override_utf8_locale = true,

    -- The header takes the same form as the main panel's section heads -- the
    -- name in the accent colour, then a dotted rule -- except the rule is a short
    -- connector rather than a run to the edge, because the process counts follow
    -- it on the same line and their width moves.
    --
    -- color2..color9 are the eight depth steps, in order, which is the whole
    -- palette tree.awk draws with -- it emits slots rather than hex so the ramp
    -- stays here with the rest of the theme and follows coat. Anything deeper
    -- than eight shares the last step.
    default_color = c.base05,
    color1 = c.base0D,   -- accent: header
    color2 = depth[1],
    color3 = depth[2],
    color4 = depth[3],
    color5 = depth[4],
    color6 = depth[5],
    color7 = depth[6],
    color8 = depth[7],
    color9 = depth[8],
    draw_shades = true,
    default_shade_color = c.base00,

    -- A colour code per branch and per name, so the coloured tree is roughly
    -- three times the text it draws.
    text_buffer_size = 16384,
    short_units = true,
}

conky.text = [[
${color1}process tree ${color2}┈┈┈┈┈┈ ${execi 10 ps -e --no-headers -o ppid=,comm= | awk '$1==2||$2=="kthreadd"{k++} $1!=2&&$2!="kthreadd"{u++} END{print u" user · "k" kernel, not shown"}'}${color}
${execpi 10 pstree -U -T 1 | awk -v width=]] .. tree_cols .. [[ -f ~/.config/conky/tree.awk}
]]
