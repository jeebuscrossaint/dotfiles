-- ~/.config/conky/conky-left.conf — the day panel, top-left: weather and ~/todo.md.
--
-- Split from conky.conf so neither side has to shrink its font to fit the other.
-- Everything in conky.conf's header applies here too.

local c = dofile(os.getenv("HOME") .. "/.config/conky/palette.lua")

local cols = 55

-- Weather is 37 lines at worst: the hourly list is longest at 4am (20 rows) and
-- alerts add up to two. The todo is counted at load, plus 3 spare for items added
-- before the next reload -- the surface cannot grow after the first frame.
local todo = io.popen("awk -v width=" .. cols .. " -f ~/.config/conky/todo.awk ~/todo.md 2>/dev/null | wc -l")
local todo_lines = tonumber(todo:read("*a")) or 0
todo:close()
local panel_lines = 37 + todo_lines + 3

local size = c.fit_size(panel_lines, cols, c.size_terminal, 0.38)

conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',

    update_interval = 5,
    double_buffer = true,
    no_buffers = true,

    alignment = 'top_left',
    gap_x = 24,
    gap_y = 24,
    minimum_width = math.ceil(cols * c.px_per_col * size),
    maximum_width = math.ceil(cols * c.px_per_col * size),
    minimum_height = math.ceil(panel_lines * c.px_per_line * size),
    border_inner_margin = 0,
    border_outer_margin = 0,

    use_xft = true,
    font = c.font .. ':size=' .. size,
    override_utf8_locale = true,

    -- Same weights as the main panel; weather.jq and todo.awk emit these slots.
    default_color = c.base05,
    color1 = c.base05,
    color2 = c.fade(c.base05, 3.5, 2)[2],
    color3 = c.lift(c.base08, 4.5),
    draw_shades = true,
    default_shade_color = c.base00,

    -- The weather arrives as one execpi output; 2048 truncates it silently.
    text_buffer_size = 4096,
    short_units = true,
}

conky.text = [[
${execi 60 ~/.config/conky/weather-fetch >/dev/null 2>&1 &}${execpi 60 jq -rf ~/.config/conky/weather.jq ~/.cache/conky-wx.json 2>/dev/null}
${execpi 5 awk -v width=]] .. cols .. [[ -f ~/.config/conky/todo.awk ~/todo.md 2>/dev/null}
]]
