-- ~/.config/conky/conky-left.conf — the process tree, top-left.
--
-- The tree alone. The weather used to sit above it in this same window and now
-- lives at the bottom of conky.conf: the tree is 104 columns wide and the
-- weather is 55, so stacking them here padded the weather out with half a screen
-- of nothing, and fitting 66 tree lines plus 22 weather lines on a 1600px panel
-- forced the two halves to different point sizes. One block, one size, no
-- fitting problem -- and the left side is now a single thing.
--
-- The tree is rooted at pid 1, so it holds the ~139 userland processes and NOT
-- the ~257 kernel threads: kthreadd is pid 2, a sibling of pid 1 under pid 0, so
-- that whole subtree is outside the tree by construction rather than by a filter.
-- The header counts both and says so, because a total that does not match what is
-- drawn just looks like the tree is broken.
--
-- pstree also folds identical siblings into N*[name] -- 15 such entries standing
-- for 40 processes here. Left on: -c expands them to 91 lines from 66, which is
-- more of the panel than a process list is worth.
--
-- Calendar and notifications used to live here too and were dropped. notify.awk
-- is still in the repo, so putting the notification feed back is one line here
-- plus one exec-once in mango's config.
--
-- Everything in conky.conf's header applies here too. Read that file first.

local ok, c = pcall(dofile, os.getenv("HOME") .. "/.config/conky/coat-colors.lua")
if not ok or type(c) ~= "table" then
    c = { font = "monospace", font_size = 12, base05 = "D0D0D0",
          base0D = "8AB4F8", base03 = "505050", base00 = "1C1C1C",
          size_terminal = 9 }
end

-- The tree's own size slot, so it is settable from coat.yaml without dragging
-- the main panel with it. See the overrides block there.
local tree_size = c.size_terminal or 9

conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',

    update_interval = 10,
    double_buffer = true,
    no_buffers = true,

    alignment = 'top_left',
    gap_x = 24,
    gap_y = 24,
    -- Derived, for the same reason as the main panel: a fixed width does not
    -- track a font size change and the anchor stops meaning anything. 104 is the
    -- cut width the pstree pipeline below truncates to; 0.825px per point is
    -- SFMono's measured advance width.
    minimum_width = math.ceil(104 * tree_size * 0.825),
    maximum_width = math.ceil(104 * tree_size * 0.825),
    border_inner_margin = 0,
    border_outer_margin = 0,

    use_xft = true,
    font = c.font .. ':size=' .. tree_size,
    override_utf8_locale = true,

    -- Eight slots because tree.awk colours a branch by its DEPTH and cycles
    -- through all of them. Slots rather than hex in the producer, so the palette
    -- stays here with the rest of the theme and follows coat.
    default_color = c.base05,
    color1 = c.base0D,   -- accent: icons, tree root
    color2 = c.base05,   -- plain foreground, deepest tree
    color3 = c.base08,
    color4 = c.base09,
    color5 = c.base0A,
    color6 = c.base0B,
    color7 = c.base0C,
    color8 = c.base0E,
    draw_shades = true,
    default_shade_color = c.base00,

    text_buffer_size = 4096,
    short_units = true,
}

conky.text = [[
${color1} ${color}process tree   ${color2}${execi 10 ps -e --no-headers -o ppid=,comm= | awk '$1==2||$2=="kthreadd"{k++} $1!=2&&$2!="kthreadd"{u++} END{print u" user · "k" kernel, not shown"}'}${color}
${color2}${execpi 10 pstree -U -T 1 | cut -c1-104 | awk -f ~/.config/conky/tree.awk}${color}
]]
