-- ~/.config/conky/conky.conf — the desktop readout, in place of a bar.
--
-- conky because it is the one desktop monitor in BOTH Arch (extra/conky) and
-- OpenBSD (sysutils/conky), and 1.24 has a native Wayland backend -- `conky -v`
-- prints a Wayland section, so this is layer-shell, not XWayland.
--
-- own_window_type = 'desktop' puts it on the BACKGROUND layer: under windows,
-- visible on an empty tag, costing no screen space and covering nothing. That is
-- the right trade on a tiler. 'override' floats it on top instead.
--
-- The weather block lives at the BOTTOM of this panel, after the readings. It
-- used to sit above the process tree on the left; it is here because the tree is
-- 104 columns wide and the weather is 55, so pairing them wasted most of the
-- left panel's width on padding and forced the two halves to different point
-- sizes to fit. conky-left.conf is the tree alone now.
--
-- NO GPU SECTION, deliberately. The RTX 4070 sits in D3cold and conky's nvidia
-- variables (and nvidia-smi) wake it on every read, which on this machine means
-- holding the discrete card powered for a number nobody is looking at. Check it
-- with `cat /sys/bus/pci/devices/0000:01:00.0/power_state` before reconsidering.
--
-- NO DRAWING PRIMITIVES. conky's Wayland backend implements almost nothing from
-- the X11 one -- `conky -v` lists a dozen X11 features and only "Mouse events"
-- under Wayland. ${stippled_hr}, ${hr}, ${cpugraph}, ${cpubar}, ${membar},
-- ${fs_bar} and ${battery_bar} are X11 drawing calls, and hitting one does not
-- warn or skip: it silently ENDS THE RENDER, so everything below it disappears.
-- That is why the section heads here are literal box characters and every
-- reading is a number. A head is the section's NAME in the accent colour and a
-- dotted rule out to the panel edge: dotted rather than solid because a run of
-- ─ at full foreground weight is more ink than a divider is worth, and named
-- because the sections were only identifiable by their icon before. The dot
-- count is hardcoded per label to reach column 55 -- ${goto} is avoided for the
-- same reason as the bars, so padding is literal. ${goto} is avoided for the same reason -- columns are padded with
-- spaces, which is safe in a monospace face.
--
-- Rendering to stdout does NOT catch this: the console backend happily draws
-- bars that the Wayland one refuses. Check a change by restarting conky and
-- looking at the screen.
--
-- Validate variable NAMES by rendering to stdout:
--   sed 's/out_to_wayland = true/out_to_console=true, total_run_times=1, out_to_wayland=false/' \
--     ~/.config/conky/conky.conf > /tmp/r.conf && conky -c /tmp/r.conf
-- That is how BAT1 (there is no BAT0) was caught. It does NOT catch a variable
-- that parses fine and fails at RUNTIME: ${pa_sink_volume} is gone from this
-- panel for exactly that reason -- see conky_vol in conky.lua.

-- coat writes coat-colors.lua on every `coat set` and signals this process with
-- SIGUSR1 so it re-reads. palette.lua is what actually reads it -- and holds the
-- fallback for a missing or half-written one, plus the contrast floor both panels
-- need to draw an accent onto a wallpaper. See that file.
local c = dofile(os.getenv("HOME") .. "/.config/conky/palette.lua")

-- The whole panel is the foreground at two weights: full for the readings and
-- the section names, dimmed for everything that labels them. No accent, because
-- an accent on every icon is a colour on every line, and a colour on every line
-- is a colour on nothing.
--
-- Dimmed by mixing toward the BACKGROUND, floored at 3.5:1 against it. Not base03
-- -- that was tried and it is a dark grey chosen to sit on a solid background,
-- while this draws onto the wallpaper, so "dim" came out as "gone" on 34 lines.
-- Mixing gives the same effect with a floor under it. Palenight only has 5.2:1
-- between its foreground and its background to spend, so the gap is narrow here
-- by necessity; a scheme with more room gets more.
-- The panel's height in LINES, which is what sets the font size below.
-- MEASURED, not counted from this file: the blocks assembled further down expand
-- at render, and the weather arrives as one ${execpi} that becomes 20.
--
--   sed 's/out_to_wayland = true/out_to_console=true, total_run_times=1, out_to_wayland=false/' \
--     ~/.config/conky/conky.conf > /tmp/r.conf && conky -c /tmp/r.conf | wc -l
--
-- Re-run that after adding or removing a line here.
local panel_lines = 61

-- coat's size is the CEILING, not the size. On this machine it is what you get;
-- on a 14" 1920x1080 the panel would run off the bottom at 11, so it comes down
-- to 9 and fits. 0.38 of the width because the process tree is anchored to the
-- opposite corner at up to half, and the two must not meet in the middle.
local size = c.fit_size(panel_lines, 55, c.size_desktop, 0.38)

local dim = c.fade(c.base05, 3.5, 2)[2]

-- The one colour left, and it is not decoration: the ONLY thing that ever turns
-- red is something wrong -- 80°C, a flat battery, no link, 90°F, a UV of 8.
-- Lifted once here because three text colours reach for it and every one of them
-- is drawn over the wallpaper.
local alert = c.lift(c.base08, 4.5)


-- Machine-specific device names, RESOLVED here rather than written in.
--
-- This file is Lua and conky evaluates it at load (and again on SIGUSR1), so the
-- detection runs here and the answers are interpolated into conky.text as
-- literals. It has to be this way round: ${hwmon}, ${if_up}, ${battery_percent},
-- ${diskio} and friends bind their argument when the text is PARSED, so a
-- runtime ${lua ...} cannot hand a device name to any of them.
--
-- Every name below used to be this laptop's, written in: coretemp, asus, nvme,
-- iwlwifi_1, BAT1, ACAD, wlan0, /dev/nvme0n1. None of those are portable -- a
-- ThinkPad has thinkpad and BAT0 and AC, an AMD box has k10temp -- and a wrong
-- one is NOT an error. conky logs `can't parse device` and renders an empty
-- string, so the failure looks like a blank column with a °C after it. Anything
-- that resolves to nil is therefore dropped from the panel entirely, rather than
-- left to print a unit with no number.

local function first_line(path)
    local f = io.open(path, "r"); if not f then return nil end
    local v = f:read("*l"); f:close(); return v
end

local function exists(path)
    local f = io.open(path, "r"); if not f then return false end
    f:close(); return true
end

-- The first of `names` that is a registered hwmon chip. coretemp is Intel,
-- k10temp/zenpower are AMD; asus and thinkpad are the two fan controllers this
-- setup has run on; acpitz is the fallback nearly every machine has.
local function hwmon(...)
    local have = {}
    for i = 0, 31 do
        local n = first_line(("/sys/class/hwmon/hwmon%d/name"):format(i))
        if n then have[n] = true end
    end
    for _, want in ipairs({...}) do
        if have[want] then return want end
    end
    return nil
end

-- A /sys/class/power_supply entry of the given type, by asking each candidate
-- what it IS rather than trusting the name. BAT1 here and there is no BAT0,
-- which is the exact trap this replaces.
local function power_supply(kind, names)
    for _, n in ipairs(names) do
        if first_line("/sys/class/power_supply/" .. n .. "/type") == kind then return n end
    end
    return nil
end

-- The wireless interface, from /proc/net/wireless rather than a guessed name:
-- it lists exactly the interfaces that have a wireless extension, after two
-- header lines. wlan0 here, wlp3s0 or wlo1 elsewhere.
local function wifi_iface()
    local f = io.open("/proc/net/wireless", "r"); if not f then return nil end
    local found
    for l in f:lines() do
        found = found or l:match("^%s*([%w%-_]+):")
    end
    f:close()
    return found
end

-- Every interface named in /proc/net/wireless, as a set. wifi_iface() returns
-- only the first; the wired scan below needs to reject ALL of them.
local function wireless_set()
    local set = {}
    local f = io.open("/proc/net/wireless", "r"); if not f then return set end
    for l in f:lines() do
        local n = l:match("^%s*([%w%-_]+):")
        if n then set[n] = true end
    end
    f:close()
    return set
end

-- The wired interface, from /proc/net/dev filtered by what the kernel says each
-- name IS. A `device/uevent` means real hardware behind it, which drops lo,
-- tailscale0 and any docker or virbr bridge; /proc/net/wireless drops the radio.
--
-- Testing for a `wireless` DIRECTORY is what this first tried and it silently
-- matched nothing -- io.open cannot stat a directory, and the file inside it is
-- not named `link`. wlan0 came back wired and only lost to eth0 because eth0 is
-- listed first. Same authority as wifi_iface() is used instead, so the two
-- cannot disagree. /sys/class/net/<n>/phy80211/name is the other honest marker.
-- eth0 here, enp0s31f6 or eno1 elsewhere.
local function wired_iface()
    local radios = wireless_set()
    local f = io.open("/proc/net/dev", "r"); if not f then return nil end
    local found
    for l in f:lines() do
        local n = l:match("^%s*([%w%-_]+):")
        if n and n ~= "lo" and not radios[n]
           and exists("/sys/class/net/" .. n .. "/device/uevent") then
            found = found or n
        end
    end
    f:close()
    return found
end

-- Block device backing /, partition suffix removed, for ${diskio}.
local function root_disk()
    local f = io.open("/proc/mounts", "r"); if not f then return nil end
    local dev
    for l in f:lines() do
        local d, m = l:match("^(%S+)%s+(%S+)")
        if m == "/" and d and d:match("^/dev/") then dev = d break end
    end
    f:close()
    if not dev then return nil end
    return (dev:gsub("^/dev/", ""):gsub("p?%d+$", ""))
end

local cpu_chip  = hwmon("coretemp", "k10temp", "zenpower", "acpitz")
local fan_chip  = hwmon("asus", "thinkpad", "dell_smm", "acpi_fan")
local nvme_chip = hwmon("nvme")
local wifi_chip = hwmon("iwlwifi_1", "iwlwifi", "mt7921_phy0")
local bat  = power_supply("Battery", {"BAT0", "BAT1", "BAT2", "CMB0"})
local ac   = power_supply("Mains",   {"AC", "AC0", "ACAD", "ADP0", "ADP1"})
local net  = wifi_iface()
local wnet = wired_iface()
local disk = root_disk()

conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',

    -- 1s because the clock shows seconds. Everything expensive is on its own
    -- longer interval below, so this costs almost nothing: the per-second work
    -- is all built-in variables reading /proc and /sys.
    -- This is the single biggest lever on the panel's cost. Measured by diffing
    -- CPU between a 20-tick and an 80-tick run, so startup amortises out:
    -- 0.5 -> 4.6% of a core, 1.0 -> 3.3%, and that is console rendering only;
    -- the Wayland draw and font shaping of ~102 lines halves as well. Nothing
    -- animates faster than the clock any more, so there is no reason to pay for
    -- 0.5 -- the audio visualiser that wanted it is gone.
    update_interval = 1.0,
    double_buffer = true,
    no_buffers = true,

    alignment = 'top_right',
    gap_x = 24,
    gap_y = 24,
    -- Width DERIVED from the font size, not fixed. A fixed width plus a
    -- top_right anchor pins the right edge and left-aligns the text inside it,
    -- so shrinking the font pulls the text away from the corner and leaves a gap
    -- -- the window has to shrink with the text for the anchor to mean anything.
    --
    -- 0.825px per point is SFMono's advance width, measured off the rendered
    -- panel: 9.9px at size 12 and 7.4px at size 9. 55 is the longest line, and it
    -- is a WEATHER row: the current-condition line runs to 36 columns before the
    -- description with three-digit temperatures, and weather.jq caps a
    -- description at 19. That beats 45 for the widest thing above it (a
    -- two-column process row, which is what top_name_width sets). Text past the
    -- width is CLIPPED mid-character rather than wrapped, so the panel is sized
    -- to the longest description rather than the descriptions cut to fit -- see
    -- the short-name table in weather.jq, which is what keeps 19 achievable.
    minimum_width = math.ceil(55 * c.px_per_col * size),
    maximum_width = math.ceil(55 * c.px_per_col * size),
    border_inner_margin = 0,
    border_outer_margin = 0,

    use_xft = true,
    -- Size from coat too, not just the family. coat.yaml has a per-module
    -- override pinning conky's desktop size, because this readout is ~102 lines
    -- and the global desktop size is tuned for things that are not. Raising it
    -- much past 8 runs the block off the bottom of a 1600px panel.
    font = c.font .. ':size=' .. size,
    override_utf8_locale = true,

    -- base05 is base16's foreground slot, so it is light on a dark scheme and
    -- dark on a light one with no branching needed here -- which is exactly the
    -- behaviour wanted, and why the primary colour is not spelled out per variant.
    default_color = c.base05,
    color1 = c.base05,  -- full weight: section names, the clock
    color2 = dim,       -- labels, icons, meters, anything supporting
    color3 = alert,     -- see above; nothing else is coloured

    -- A one-pixel drop shadow in the background colour. This is the thing that
    -- actually makes text readable over an arbitrary wallpaper: base05 alone is
    -- fine against base00 and can still vanish into a bright photo. base00 is the
    -- right shade in both variants, since it is whatever the scheme calls the
    -- background.
    draw_shades = true,
    default_shade_color = c.base00,

    -- conky silently drops an exec command past ~200 chars. The weather jq
    -- program lives in weather.jq for that reason; this buys headroom for the
    -- rest. A blank block with no error is what hitting the cap looks like.
    lua_load = os.getenv('HOME') .. '/.config/conky/conky.lua',

    -- 4096, not 2048: the whole weather block arrives as ONE execpi output, and
    -- 23 lines carrying ${color} codes overrun 2048 -- which truncates silently.
    text_buffer_size = 4096,

    short_units = true,
    pad_percents = 2,
    -- 12, not 14: two columns of names plus their percentages is what sets the
    -- panel width, and 14 pushed the second column's value off the edge.
    top_name_width = 12,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
}


-- The panel lines that name a device, assembled from what was found above. Each
-- is empty when its hardware is absent, and empty DROPS the line -- the point of
-- the exercise is not printing "°C" with nothing in front of it.
--
-- [==[ ]==] rather than "..." wherever an awk program appears, so the printf
-- format strings keep their own double quotes instead of being escaped.

local function hw(chip, kind) return "${hwmon " .. chip .. " " .. kind .. "}" end

local l_temp = ""
if cpu_chip then
    local t = hw(cpu_chip, "temp 1")
    l_temp = "${color2} ${color}${if_match " .. t .. ">80}${color " .. alert .. "}${endif}"
          .. t .. "°C${color} ${color2}${lua spark tmp " .. t .. " 22 100}${color}"
    if fan_chip then
        l_temp = l_temp .. " ${color2} ${color}" .. hw(fan_chip, "fan 1")
    end
    l_temp = l_temp .. "\n"
end

local l_disk = ""
do
    local parts = {}
    if nvme_chip then parts[#parts + 1] = hw(nvme_chip, "temp 1") .. "°C nvme" end
    if disk then
        parts[#parts + 1] = "r ${diskio_read " .. disk .. "} w ${diskio_write " .. disk .. "}"
    end
    if #parts > 0 then
        l_disk = "${color2} " .. table.concat(parts, " · ") .. "${color}\n"
    end
end

-- Which link the panel reports is decided at DRAW time, not here: ${if_up} is
-- live, so a cable going in or out flips the block on the next tick without a
-- reload. It has to be ${if_up} and not ${gw_iface} -- with a cable in there are
-- two default routes (wifi stays associated at a worse metric, which is the
-- whole reason this block was wrong), and conky answers "multiple" to both
-- ${gw_iface} and ${gw_ip} rather than naming the one that wins. The names
-- themselves are still startup literals, per the note at the top.
local b_net = ""
do
    local wt = wifi_chip and (" ·  " .. hw(wifi_chip, "temp 1") .. "°C") or ""
    local function rate(n)
        return "${color2} ${color}${color2}${lua spark dn ${downspeedf " .. n .. "} 22}${color} ${downspeed " .. n .. "} ${color2}· ${totaldown " .. n .. "}${color}\n"
            .. "${color2} ${color}${color2}${lua spark up ${upspeedf " .. n .. "} 22}${color} ${upspeed " .. n .. "} ${color2}· ${totalup " .. n .. "}${color}\n"
            .. "${color2} ${addr " .. n .. "} ·  ${lua gw}\n"
    end

    local b_wired = ""
    if wnet then
        b_wired =
            "${color2} ${color}wired ${color2}· " .. wnet .. "${color}\n"
         .. rate(wnet)
         .. "${color2}wifi idle on ${wireless_essid " .. (net or "") .. "}${color}"
    end

    local b_wifi = ""
    if net then
        b_wifi =
            "${color2} ${color}${wireless_essid " .. net .. "}  ${color2}${lua fbar ${wireless_link_qual_perc " .. net .. "} 10}${color} ${wireless_link_qual_perc " .. net .. "}%\n"
         .. rate(net)
         .. "${wireless_bitrate " .. net .. "} · ch ${wireless_channel " .. net .. "}" .. wt
    end

    local offline = "${color " .. alert .. "} offline${color}"

    if wnet and net then
        b_net = "${if_up " .. wnet .. "}" .. b_wired
             .. "${else}${if_up " .. net .. "}" .. b_wifi
             .. "${else}" .. offline .. "${endif}${endif}\n"
    elseif wnet then
        b_net = "${if_up " .. wnet .. "}" .. b_wired .. "${else}" .. offline .. "${endif}\n"
    elseif net then
        b_net = "${if_up " .. net .. "}" .. b_wifi .. "${else}" .. offline .. "${endif}\n"
    end
end

local b_power = ""
if bat then
    local d = "/sys/class/power_supply/" .. bat

    -- All three are sysfs reads done in Lua (conky.lua), not ${execi}. They were a
    -- shell plus an awk, another awk, and a cat piped into a sed, on 5 and 10
    -- second timers -- processes, forever, to open files. conky_watts picks
    -- power_now vs current_now x voltage_now itself, so the energy/charge split
    -- lives with the arithmetic instead of being decided here.
    local draw  = "${lua watts " .. d .. "}"
    local volts = "${lua volts " .. d .. "}"
    local mains = ac and (" ·  ${lua mains /sys/class/power_supply/" .. ac .. "/online}") or ""

    b_power =
        "${color2} ${color}${if_match ${battery_percent " .. bat .. "}<20}${lua_parse pulse "
        .. alert .. " " .. c.base05 .. "}${endif}${battery_percent " .. bat .. "}%${color}  ${color2}${lua fbar ${battery_percent "
        .. bat .. "} 14}${color}  ${battery_time " .. bat .. "}\n"
     .. "${color2} ${color}" .. draw .. " ${color2}· " .. volts .. mains .. "${color}\n"

    -- charge_* on this machine, energy_* on a ThinkPad. conky_health tries both,
    -- so the only question left here is whether to draw the line at all.
    if exists(d .. "/charge_full_design") or exists(d .. "/energy_full_design") then
        b_power = b_power .. "${color2}health ${lua health " .. d .. "}"
        if exists(d .. "/cycle_count") then
            b_power = b_power .. " · ${lua cycles " .. d .. "} cycles"
        end
        b_power = b_power .. "${color}\n"
    end
end

-- Per-core bars, one per thread, eight to a row -- GENERATED, and not because
-- writing sixteen of them out is tedious.
--
-- ${cpu cpuN} past the last core is FATAL. conky prints "attempting to use more
-- CPUs than you have (requested CPU 9, but only 8 available)" and EXITS: it does
-- not skip the variable and it does not warn, the whole panel is gone and the
-- supervisor in mango's config restarts it into the same error every 3 seconds.
-- That is not how a missing hwmon chip behaves, which is why this one is worth
-- spelling out -- hardcoded cpu1..cpu16 was a panel that could only ever run on
-- this machine, and an 8-thread ThinkPad died at cpu9 with the left panel, which
-- has no per-core bars, still drawing perfectly.
local b_cores = ""
do
    local n = 0
    local f = io.open("/proc/cpuinfo", "r")
    if f then
        for l in f:lines() do if l:match("^processor") then n = n + 1 end end
        f:close()
    end
    local row = {}
    for i = 1, n do
        row[#row + 1] = "${lua fbar ${cpu cpu" .. i .. "} 3}"
        if #row == 8 or i == n then
            b_cores = b_cores .. "${color2}" .. table.concat(row, " ") .. "${color}\n"
            row = {}
        end
    end
end



conky.text = [[
${color1}${font ]] .. c.font .. ':size=' .. math.floor(size * 2.75 + 0.5) .. [[}${time %H:%M:%S}${font}${color} ${color1}${lua spin}${color}
${color2} ${color}${time %a %d %b %Y} · wk ${time %V} · day ${time %j}
${color2} ${color}${lua tags}   ${color2} ${color}${lua appid}
${color1}host ${color2}┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈${color}
${color2} ${color}${nodename}   ${color2} ${color}${execi 99999 . /etc/os-release; echo $PRETTY_NAME}
${color2} ${color}${kernel}   ${color2} ${color}${execi 3600 pacman -Qq 2>/dev/null | wc -l}, ${execi 3600 pacman -Qu 2>/dev/null | wc -l} stale
${color2} ${color}${uptime}   ${color2} ${color}${loadavg}
${color2} ${color}${processes}p ${threads}t ${running_processes}r · ${entropy_avail}b ent
${color1}cpu ${color2}┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈${color}
${color2} ${color}${cpu cpu0}%  ${color2}${lua fbar ${cpu cpu0} 14}${color}  ${freq_g}GHz ${color2}${lua governor}${color}
${color2}${lua spark cpu ${cpu cpu0} 34 100}${color}
]] .. b_cores .. [[]] .. l_temp .. [[${color2}${execi 99999 grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | cut -c2-30}${color}
${top name 1} ${top cpu 1}%   ${top name 2} ${top cpu 2}%
${top name 3} ${top cpu 3}%   ${top name 4} ${top cpu 4}%
${color1}memory ${color2}┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈${color}
${color2} ${color}${memperc}%  ${color2}${lua fbar ${memperc} 14}${color}  ${mem}/${memmax}
${color2}swap ${swapperc}% · cache ${cached} · buf ${buffers}
${color}${top_mem name 1} ${top_mem mem_res 1}   ${top_mem name 2} ${top_mem mem_res 2}
${top_mem name 3} ${top_mem mem_res 3}   ${top_mem name 4} ${top_mem mem_res 4}
${color1}disk ${color2}┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈${color}
${color2} ${color}${fs_used_perc /}%  ${color2}${lua fbar ${fs_used_perc /} 14}${color}  ${fs_used /}/${fs_size /}
