-- ~/.config/conky/conky.conf — the persistent readout, in place of a bar.
--
-- conky because it is the one desktop monitor in BOTH Arch (extra/conky) and
-- OpenBSD (sysutils/conky), and 1.24 has a native Wayland backend -- `conky -v`
-- lists a Wayland section, so this is layer-shell, not XWayland.
--
-- own_window_type = 'desktop' puts it on the BACKGROUND layer, so it sits under
-- windows and is visible on an empty tag. That is the classic conky trade and
-- the right one for a tiler: it costs no screen space and never covers a window.
-- Change it to 'override' to float it on top of everything instead.
--
-- Almost everything here is a built-in variable, which means no forks. The two
-- exceptions are the tag row, the player line and the weather line, at 2s, 5s
-- and 15min. The tag row is the one thing a bar showed that nothing else does --
-- mango's overview (Super+O) is the only other way to see it.

conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',

    update_interval = 2,
    double_buffer = true,
    no_buffers = true,

    alignment = 'top_right',
    gap_x = 24,
    gap_y = 24,
    minimum_width = 240,
    border_inner_margin = 0,
    border_outer_margin = 0,

    -- SFMono is what coat sets everywhere else, and the columns below only line
    -- up in a monospace face.
    use_xft = true,
    font = 'SFMono Nerd Font Mono:size=10',
    override_utf8_locale = true,

    -- Colours match the current coat scheme. coat has no conky module yet, so a
    -- scheme change does NOT reach this file -- these are hand-set.
    default_color = 'F4F4FF',
    color1 = '96A6C8',  -- accent: labels
    color2 = '52494E',  -- dim: separators and units

    short_units = true,
    pad_percents = 2,
    top_name_width = 10,
}

-- No seconds anywhere. The clock is HH:MM and update_interval is 2s, so a
-- ticking seconds field would be wrong as often as it was right.
conky.text = [[
${color1}${font SFMono Nerd Font Mono:size=15}${time %H:%M}${font}${color}  ${color2}${time %a %d %b}${color}
${color1}tag ${color}${execi 2 mmsg get all-tags 2>/dev/null | jq -r '[.all_tags[0].tags[] | select(.is_active or (.client_count // 0) > 0) | if .is_active then "[\(.index)]" else "\(.index)" end] | join(" ")'}
${color1}cpu ${color}${cpu cpu0}%${goto 96}${color2}${hwmon coretemp temp 1}°C${color}
${color1}mem ${color}${memperc}%${goto 96}${color2}swap ${swapperc}%${color}
${color1}ssd ${color}${fs_used_perc /}%${goto 96}${color2}${fs_free /} free${color}
${color1}tmp ${color}${hwmon nvme temp 1}°C${goto 96}${color2}fan ${hwmon asus fan 1}${color}
${color1}bat ${color}${battery_percent BAT1}%${goto 96}${color2}${battery_short BAT1}${color}
${color1}vol ${color}${pa_sink_volume}%
${color1}net ${color}${if_up wlan0}${wireless_essid wlan0} ${color2}${wireless_link_qual_perc wlan0}%${else}${color2}offline${endif}${color}
${color1}wx  ${color}${execi 900 wttrbar --fahrenheit --nerd --hide-conditions --custom-indicator '{ICON} {temp_F}°' 2>/dev/null | jq -r '.text // empty'}
${color1}up  ${color}${uptime_short}
${execi 5 playerctl metadata --format '{{artist}} — {{title}}' 2>/dev/null | cut -c1-30}]]
