-- ~/.config/conky/conky.conf — the desktop readout, in place of a bar.
--
-- conky because it is the one desktop monitor in BOTH Arch (extra/conky) and
-- OpenBSD (sysutils/conky), and 1.24 has a native Wayland backend -- `conky -v`
-- prints a Wayland section, so this is layer-shell, not XWayland.
--
-- own_window_type = 'desktop' puts it on the BACKGROUND layer: under windows,
-- visible on an empty tag, costing no screen space and covering nothing. That is
-- the right trade on a tiler. 'override' floats it on top instead.
--
-- NO GPU SECTION, deliberately. The RTX 4070 sits in D3cold and conky's nvidia
-- variables (and nvidia-smi) wake it on every read, which on this machine means
-- holding the discrete card powered for a number nobody is looking at. Check it
-- with `cat /sys/bus/pci/devices/0000:01:00.0/power_state` before reconsidering.
--
-- Validate any edit by rendering to stdout instead of guessing:
--   sed 's/out_to_wayland = true/out_to_console=true, total_run_times=1, out_to_wayland=false/' \
--     ~/.config/conky/conky.conf > /tmp/r.conf && conky -c /tmp/r.conf
-- That is how BAT1 (there is no BAT0) and ${pa_sink_volume} (pa_sink_volumeperc
-- does not exist and renders as literal text) were caught.

conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',

    -- 1s because the clock shows seconds. Everything expensive is on its own
    -- longer interval below, so this costs almost nothing: the per-second work
    -- is all built-in variables reading /proc and /sys.
    update_interval = 1,
    double_buffer = true,
    no_buffers = true,

    alignment = 'top_right',
    gap_x = 24,
    gap_y = 24,
    minimum_width = 300,
    maximum_width = 300,
    border_inner_margin = 0,
    border_outer_margin = 0,

    use_xft = true,
    font = 'SFMono Nerd Font Mono:size=9',
    override_utf8_locale = true,

    -- Matches the current coat scheme. coat has no conky module yet, so a scheme
    -- change does NOT reach this file -- these are hand-set.
    default_color = 'F4F4FF',
    color1 = '96A6C8',  -- accent: labels and headings
    color2 = '52494E',  -- dim: units, separators, secondary values
    color3 = 'F43841',  -- alert

    -- conky silently drops an exec command past ~200 chars. The weather jq
    -- program lives in weather.jq for that reason; this buys headroom for the
    -- rest. A blank block with no error is what hitting the cap looks like.
    text_buffer_size = 2048,

    short_units = true,
    pad_percents = 2,
    top_name_width = 12,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
}

conky.text = [[
${color1}${font SFMono Nerd Font Mono:size=22}${time %H:%M:%S}${font}${color}
${color2}${time %A %d %B %Y}${color}
${color1}tag ${color}${execi 2 mmsg get all-tags 2>/dev/null | jq -r '[.all_tags[0].tags[] | select(.is_active or (.client_count // 0) > 0) | if .is_urgent then "!\(.index)" elif .is_active then "[\(.index)]" else "\(.index)" end] | join(" ")'}
${color2}${stippled_hr 1}${color}
${color1}SYSTEM${color}
host  ${color2}${nodename}${color}
kern  ${color2}${kernel}${color}
up    ${color2}${uptime}${color}
load  ${color2}${loadavg}${color}
proc  ${color2}${processes} procs, ${threads} threads, ${running_processes} run${color}
${color2}${stippled_hr 1}${color}
${color1}CPU${color}  ${cpu cpu0}%${goto 120}${freq_g} GHz${goto 210}${hwmon coretemp temp 1}°C
${cpugraph cpu0 26,300}
${cpubar cpu1 5,34}${goto 38}${cpubar cpu2 5,34}${goto 76}${cpubar cpu3 5,34}${goto 114}${cpubar cpu4 5,34}${goto 152}${cpubar cpu5 5,34}${goto 190}${cpubar cpu6 5,34}${goto 228}${cpubar cpu7 5,34}${goto 266}${cpubar cpu8 5,34}
${cpubar cpu9 5,34}${goto 38}${cpubar cpu10 5,34}${goto 76}${cpubar cpu11 5,34}${goto 114}${cpubar cpu12 5,34}${goto 152}${cpubar cpu13 5,34}${goto 190}${cpubar cpu14 5,34}${goto 228}${cpubar cpu15 5,34}${goto 266}${cpubar cpu16 5,34}
${color2}${top name 1}${goto 190}${top cpu 1}%${goto 250}${top mem 1}%${color}
${color2}${top name 2}${goto 190}${top cpu 2}%${goto 250}${top mem 2}%${color}
${color2}${top name 3}${goto 190}${top cpu 3}%${goto 250}${top mem 3}%${color}
${color2}${stippled_hr 1}${color}
${color1}MEMORY${color}
ram   ${mem} / ${memmax}${goto 240}${memperc}%
${membar 6,300}
cache ${color2}${cached}${goto 150}swap ${swapperc}%${color}
${color2}${top_mem name 1}${goto 200}${top_mem mem_res 1}${color}
${color2}${top_mem name 2}${goto 200}${top_mem mem_res 2}${color}
${color2}${top_mem name 3}${goto 200}${top_mem mem_res 3}${color}
${color2}${stippled_hr 1}${color}
${color1}DISK${color}
/     ${fs_used /} / ${fs_size /}${goto 240}${fs_used_perc /}%
${fs_bar 6,300 /}
io    ${color2}r ${diskio_read /dev/nvme0n1}${goto 150}w ${diskio_write /dev/nvme0n1}${color}
temp  ${color2}${hwmon nvme temp 1}°C${goto 150}fan ${hwmon asus fan 1} rpm${color}
${color2}${stippled_hr 1}${color}
${color1}NETWORK${color}
${if_up wlan0}wifi  ${wireless_essid wlan0}${goto 240}${wireless_link_qual_perc wlan0}%
ip    ${color2}${addr wlan0}${goto 170}gw ${gw_ip}${color}
down  ${downspeed wlan0}${goto 150}${color2}tot ${totaldown wlan0}${color}
up    ${upspeed wlan0}${goto 150}${color2}tot ${totalup wlan0}${color}${else}${color3}offline${color}${endif}
${color2}${stippled_hr 1}${color}
${color1}POWER / AUDIO${color}
batt  ${battery_percent BAT1}%${goto 110}${color2}${battery_short BAT1}${goto 190}${battery_time BAT1}${color}
${battery_bar 6,300 BAT1}
vol   ${pa_sink_volume}%${goto 110}${color2}${pa_sink_description}${color}
play  ${color2}${execi 5 playerctl metadata --format '{{artist}} - {{title}}' 2>/dev/null | cut -c1-34}${color}
${color2}${stippled_hr 1}${color}
${color1}WEATHER${color}  ${color2}${execi 3600 jq -r '.nearest_area[0].areaName[0].value' $HOME/.cache/conky-wx.json 2>/dev/null}${color}
${execi 1800 (curl -sm 15 'https://wttr.in/?format=j1' -o ~/.cache/wx.new && mv -f ~/.cache/wx.new ~/.cache/conky-wx.json) >/dev/null 2>&1 &}${execpi 1800 jq -rf ~/.config/conky/weather.jq ~/.cache/conky-wx.json 2>/dev/null}]]
