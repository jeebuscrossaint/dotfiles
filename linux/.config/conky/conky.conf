-- ~/.config/conky/conky.conf — system readout, top-right. Weather and todo are
-- conky-left.conf. Plain text by design: dim label, value, nothing else.
--
-- No GPU section: nvidia variables wake the dGPU out of D3cold on every read.
--
-- No ${hr}, ${*bar}, ${*graph} or ${goto}: on Wayland they silently END the
-- render, and console mode does not show it -- check changes on the screen.
-- Variable NAMES can be checked in console mode, which also gives the line count:
--   sed 's/out_to_wayland = true/out_to_console=true, total_run_times=1, out_to_wayland=false/' \
--     ~/.config/conky/conky.conf > /tmp/r.conf && conky -c /tmp/r.conf

-- palette.lua reads coat-colors.lua (rewritten and SIGUSR1'd by `coat set`).
local c = dofile(os.getenv("HOME") .. "/.config/conky/palette.lua")

-- Measured with the recipe above. The surface cannot grow after the first frame.
local panel_lines = 22
local cols = 37
-- coat's size is a ceiling; this shrinks it on a smaller screen.
local size = c.fit_size(panel_lines, cols, c.size_desktop, 0.38)

-- Dimmed toward the background with a contrast floor, since it draws on wallpaper.
local dim = c.fade(c.base05, 3.5, 2)[2]
-- The only colour: something is wrong (80°C, flat battery, offline).
local alert = c.lift(c.base08, 4.5)


-- Device names are detected here, not written in: ${hwmon}, ${battery_percent},
-- ${diskio} etc. bind their argument at parse time, and a wrong name renders
-- empty instead of erroring. Anything not found drops its part of the panel.

local function first_line(path)
    local f = io.open(path, "r"); if not f then return nil end
    local v = f:read("*l"); f:close(); return v
end

local function exists(path)
    local f = io.open(path, "r"); if not f then return false end
    f:close(); return true
end

-- The first of `names` that is a registered hwmon chip.
local function hwmon(...)
    local have = {}
    for i = 0, 31 do
        local n = first_line(("/sys/class/hwmon/hwmon%d/name"):format(i))
        if n then have[n] = true end
    end
    for _, want in ipairs({...}) do
        if have[want] then return want end
    end
    return nil
end

-- By type, not name: this machine has BAT1 and no BAT0.
local function power_supply(kind, names)
    for _, n in ipairs(names) do
        if first_line("/sys/class/power_supply/" .. n .. "/type") == kind then return n end
    end
    return nil
end

local function wifi_iface()
    local f = io.open("/proc/net/wireless", "r"); if not f then return nil end
    local found
    for l in f:lines() do
        found = found or l:match("^%s*([%w%-_]+):")
    end
    f:close()
    return found
end

local function wireless_set()
    local set = {}
    local f = io.open("/proc/net/wireless", "r"); if not f then return set end
    for l in f:lines() do
        local n = l:match("^%s*([%w%-_]+):")
        if n then set[n] = true end
    end
    f:close()
    return set
end

-- Real hardware (has device/uevent) that is not a radio: drops lo, tailscale0,
-- bridges and wlan.
local function wired_iface()
    local radios = wireless_set()
    local f = io.open("/proc/net/dev", "r"); if not f then return nil end
    local found
    for l in f:lines() do
        local n = l:match("^%s*([%w%-_]+):")
        if n and n ~= "lo" and not radios[n]
           and exists("/sys/class/net/" .. n .. "/device/uevent") then
            found = found or n
        end
    end
    f:close()
    return found
end

-- Block device backing /, partition suffix removed, for ${diskio}.
local function root_disk()
    local f = io.open("/proc/mounts", "r"); if not f then return nil end
    local dev
    for l in f:lines() do
        local d, m = l:match("^(%S+)%s+(%S+)")
        if m == "/" and d and d:match("^/dev/") then dev = d break end
    end
    f:close()
    if not dev then return nil end
    return (dev:gsub("^/dev/", ""):gsub("p?%d+$", ""))
end

local cpu_chip  = hwmon("coretemp", "k10temp", "zenpower", "acpitz")
local bat  = power_supply("Battery", {"BAT0", "BAT1", "BAT2", "CMB0"})
local ac   = power_supply("Mains",   {"AC", "AC0", "ACAD", "ADP0", "ADP1"})
local net  = wifi_iface()
local wnet = wired_iface()
local fan_chip  = hwmon("asus", "thinkpad", "dell_smm", "acpi_fan")
local nvme_chip = hwmon("nvme")
local wifi_chip = hwmon("iwlwifi_1", "iwlwifi", "mt7921_phy0")
local disk = root_disk()

conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',

    -- 1s for the clock's seconds; slow things are on their own execi intervals.
    update_interval = 1.0,
    double_buffer = true,
    no_buffers = true,

    alignment = 'top_right',
    gap_x = 24,
    gap_y = 24,
    -- Sized to the widest line so the text hugs the corner; past it is clipped.
    minimum_width = math.ceil(cols * c.px_per_col * size),
    maximum_width = math.ceil(cols * c.px_per_col * size),
    -- conky sizes its Wayland surface from the first frame and never grows it.
    minimum_height = math.ceil(panel_lines * c.px_per_line * size),
    border_inner_margin = 0,
    border_outer_margin = 0,

    use_xft = true,
    font = c.font .. ':size=' .. size,
    override_utf8_locale = true,

    default_color = c.base05,
    color1 = c.base05,  -- the clock
    color2 = dim,       -- labels and separators
    color3 = alert,

    -- The background-colour shadow is what keeps text readable on a bright wallpaper.
    draw_shades = true,
    default_shade_color = c.base00,

    lua_load = os.getenv('HOME') .. '/.config/conky/conky.lua',
    text_buffer_size = 4096,

    short_units = true,
    pad_percents = 2,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
}


-- Each label is dim text padded to five columns; the reading follows at full
-- weight. Anything whose hardware is absent drops its part.
local function hw(chip, kind) return "${hwmon " .. chip .. " " .. kind .. "}" end
local function L(name) return "${color2}" .. name .. string.rep(" ", 5 - #name) .. "${color}" end
local pad = "     "
local sep = " ${color2}·${color} "

local b_cpu = L("cpu") .. "${cpu cpu0}%" .. sep .. "${freq_g}GHz" .. sep .. "${lua governor}\n"
if cpu_chip then
    local t = hw(cpu_chip, "temp 1")
    b_cpu = b_cpu .. pad .. "${if_match " .. t .. ">80}${color3}${endif}" .. t .. "°C${color}"
    if fan_chip then b_cpu = b_cpu .. sep .. "fan " .. hw(fan_chip, "fan 1") end
    b_cpu = b_cpu .. "\n"
end

local b_mem = L("mem") .. "${memperc}%" .. sep .. "${mem}/${memmax}\n"

local b_disk = L("disk") .. "${fs_used_perc /}%" .. sep .. "${fs_used /}/${fs_size /}\n"
do
    local parts = {}
    if nvme_chip then parts[#parts + 1] = hw(nvme_chip, "temp 1") .. "°C nvme" end
    if disk then parts[#parts + 1] = "r ${diskio_read " .. disk .. "} w ${diskio_write " .. disk .. "}" end
    if #parts > 0 then b_disk = b_disk .. pad .. table.concat(parts, sep) .. "\n" end
end

-- Decided at draw time so plugging a cable flips it without a reload. operstate,
-- not ${if_up}: an empty ethernet port is still administratively up.
local b_net = ""
do
    local function rate(n)
        return pad .. "${color2}↓${color} ${downspeed " .. n .. "}" .. sep .. "${totaldown " .. n .. "} total\n"
            .. pad .. "${color2}↑${color} ${upspeed " .. n .. "}" .. sep .. "${totalup " .. n .. "} total\n"
            .. pad .. "${addr " .. n .. "}" .. sep .. "gw ${lua gw}"
    end
    local wired = wnet and (L("net") .. "wired" .. sep .. wnet .. "\n" .. rate(wnet)) or ""
    local wt = wifi_chip and (sep .. hw(wifi_chip, "temp 1") .. "°C") or ""
    local wifi = net and (L("wifi") .. "${wireless_essid " .. net .. "}" .. sep .. "${wireless_link_qual_perc " .. net .. "}%\n"
        .. pad .. "${wireless_bitrate " .. net .. "}" .. sep .. "ch ${wireless_channel " .. net .. "}" .. wt .. "\n"
        .. rate(net)) or ""
    local offline = L("net") .. "${color3}offline${color}"
    local function if_live(n) return "${if_existing /sys/class/net/" .. n .. "/operstate up}" end

    if wnet and net then
        b_net = if_live(wnet) .. wired .. "${else}" .. if_live(net) .. wifi
             .. "${else}" .. offline .. "${endif}${endif}\n"
    elseif wnet then
        b_net = if_live(wnet) .. wired .. "${else}" .. offline .. "${endif}\n"
    elseif net then
        b_net = if_live(net) .. wifi .. "${else}" .. offline .. "${endif}\n"
    end
end

local b_power = ""
if bat then
    local d = "/sys/class/power_supply/" .. bat
    local mains = ac and (sep .. "${lua mains /sys/class/power_supply/" .. ac .. "/online}") or ""
    b_power = L("bat") .. "${if_match ${battery_percent " .. bat .. "}<20}${lua_parse pulse "
        .. alert .. " " .. c.base05 .. "}${endif}${battery_percent " .. bat .. "}%${color}"
        .. sep .. "${battery_time " .. bat .. "}" .. mains .. "\n"
        .. pad .. "${lua watts " .. d .. "}" .. sep .. "${lua volts " .. d .. "}\n"
    if exists(d .. "/charge_full_design") or exists(d .. "/energy_full_design") then
        b_power = b_power .. pad .. "health ${lua health " .. d .. "}"
        if exists(d .. "/cycle_count") then b_power = b_power .. sep .. "${lua cycles " .. d .. "} cycles" end
        b_power = b_power .. "\n"
    end
end


conky.text = [[
${color1}${font ]] .. c.font .. ':size=' .. math.floor(size * 2.75 + 0.5) .. [[}${time %H:%M:%S}${font}${color} ${color1}${lua spin}${color}
${time %a %d %b %Y}]] .. sep .. [[wk ${time %V}]] .. sep .. [[day ${time %j}
${lua tags}]] .. sep .. [[${lua appid}
]] .. L("host") .. [[${nodename}
]] .. L("os") .. [[${execi 99999 . /etc/os-release; echo $PRETTY_NAME}]] .. sep .. [[${kernel}
]] .. L("pkg") .. [[${execi 3600 pacman -Qq 2>/dev/null | wc -l}]] .. sep .. [[${execi 3600 pacman -Qu 2>/dev/null | wc -l} updates
]] .. L("up") .. [[${uptime_short}]] .. sep .. [[load ${loadavg}
]] .. b_cpu .. b_mem .. b_disk .. b_net .. b_power
.. L("vol") .. [[${lua vol}%]] .. sep .. [[${scroll 28 ${execi 5 playerctl metadata --format '{{artist}} - {{title}}' 2>/dev/null}    }
]]
