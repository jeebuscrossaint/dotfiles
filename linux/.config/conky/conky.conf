-- ~/.config/conky/conky.conf — the desktop readout, in place of a bar.
--
-- conky because it is the one desktop monitor in BOTH Arch (extra/conky) and
-- OpenBSD (sysutils/conky), and 1.24 has a native Wayland backend -- `conky -v`
-- prints a Wayland section, so this is layer-shell, not XWayland.
--
-- own_window_type = 'desktop' puts it on the BACKGROUND layer: under windows,
-- visible on an empty tag, costing no screen space and covering nothing. That is
-- the right trade on a tiler. 'override' floats it on top instead.
--
-- NO GPU SECTION, deliberately. The RTX 4070 sits in D3cold and conky's nvidia
-- variables (and nvidia-smi) wake it on every read, which on this machine means
-- holding the discrete card powered for a number nobody is looking at. Check it
-- with `cat /sys/bus/pci/devices/0000:01:00.0/power_state` before reconsidering.
--
-- NO DRAWING PRIMITIVES. conky's Wayland backend implements almost nothing from
-- the X11 one -- `conky -v` lists a dozen X11 features and only "Mouse events"
-- under Wayland. ${stippled_hr}, ${hr}, ${cpugraph}, ${cpubar}, ${membar},
-- ${fs_bar} and ${battery_bar} are X11 drawing calls, and hitting one does not
-- warn or skip: it silently ENDS THE RENDER, so everything below it disappears.
-- That is why the separators here are literal box characters and every reading
-- is a number. ${goto} is avoided for the same reason -- columns are padded with
-- spaces, which is safe in a monospace face.
--
-- Rendering to stdout does NOT catch this: the console backend happily draws
-- bars that the Wayland one refuses. Check a change by restarting conky and
-- looking at the screen.
--
-- Validate variable NAMES by rendering to stdout:
--   sed 's/out_to_wayland = true/out_to_console=true, total_run_times=1, out_to_wayland=false/' \
--     ~/.config/conky/conky.conf > /tmp/r.conf && conky -c /tmp/r.conf
-- That is how BAT1 (there is no BAT0) and ${pa_sink_volume} (pa_sink_volumeperc
-- does not exist and renders as literal text) were caught.

-- coat writes coat-colors.lua on every `coat set`, and signals this process with
-- SIGUSR1 so it re-reads. dofile rather than require: conky does not put this
-- directory on package.path, and require would need the module name mangling.
--
-- Guarded, and not defensively for its own sake: a bare dofile on a missing file
-- is a Lua error, and a Lua error during a SIGUSR1 reload EXITS conky rather than
-- keeping the old config. That is a real state -- a fresh checkout before the
-- first `coat set`, or the instant coat is rewriting the file -- and it killed
-- conky exactly once during this module's first apply.
local ok, c = pcall(dofile, os.getenv("HOME") .. "/.config/conky/coat-colors.lua")
if not ok or type(c) ~= "table" then
    c = { font = "monospace", base05 = "D0D0D0", base0D = "8AB4F8",
          base03 = "505050", base08 = "F28B82" }
end

conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',

    -- 1s because the clock shows seconds. Everything expensive is on its own
    -- longer interval below, so this costs almost nothing: the per-second work
    -- is all built-in variables reading /proc and /sys.
    update_interval = 1,
    double_buffer = true,
    no_buffers = true,

    alignment = 'top_right',
    gap_x = 24,
    gap_y = 24,
    minimum_width = 340,
    maximum_width = 340,
    border_inner_margin = 0,
    border_outer_margin = 0,

    use_xft = true,
    -- Size from coat too, not just the family. coat.yaml has a per-module
    -- override pinning conky's desktop size, because this readout is ~102 lines
    -- and the global desktop size is tuned for things that are not. Raising it
    -- much past 8 runs the block off the bottom of a 1600px panel.
    font = c.font .. ':size=' .. c.font_size,
    override_utf8_locale = true,

    -- From coat. base05 on base00 is the readable pair in essentially every
    -- scheme; base01/02/04/06 are skipped deliberately, since plenty of schemes
    -- leave those at unusable contrast against the background.
    default_color = c.base05,
    color1 = c.base0D,  -- accent: labels and headings
    color2 = c.base03,  -- dim: units, separators, secondary values
    color3 = c.base08,  -- alert

    -- conky silently drops an exec command past ~200 chars. The weather jq
    -- program lives in weather.jq for that reason; this buys headroom for the
    -- rest. A blank block with no error is what hitting the cap looks like.
    lua_load = os.getenv('HOME') .. '/.config/conky/conky.lua',

    text_buffer_size = 2048,

    short_units = true,
    pad_percents = 2,
    top_name_width = 14,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
}

conky.text = [[
${color1}${font ]] .. c.font .. ':size=' .. math.floor(c.font_size * 2.75 + 0.5) .. [[}${time %H:%M:%S}${font}${color}
${color2} ${time %a %d %b %Y} · wk ${time %V} · day ${time %j}${color}
${color1} ${color}${execi 2 mmsg get all-tags 2>/dev/null | jq -r '[.all_tags[0].tags[] | select(.is_active or (.client_count // 0) > 0) | if .is_urgent then "!\(.index)" elif .is_active then "[\(.index)]" else "\(.index)" end] | join(" ")'}   ${color2} ${execi 2 mmsg get focusing-client 2>/dev/null | jq -r '.appid // "-"'}${color}
${color2}──────────────────────────────────${color}
${color2} ${nodename}   ${execi 99999 . /etc/os-release; echo $PRETTY_NAME}${color}
${color2} ${kernel}   ${execi 3600 pacman -Qq 2>/dev/null | wc -l} pkgs, ${execi 3600 pacman -Qu 2>/dev/null | wc -l} stale${color}
${color2} ${uptime}   ${loadavg}${color}
${color2} ${processes}p ${threads}t ${running_processes}r · ${entropy_avail}b entropy${color}
${color2}──────────────────────────────────${color}
${color1} ${color}${cpu cpu0}%  ${color1}${lua bar ${cpu cpu0} 12}${color}  ${color2}${freq_g} GHz · ${execi 60 cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor}${color}
     ${color1}${lua spark cpu ${cpu cpu0} 24 100}${color}
${color1} ${color}${if_match ${hwmon coretemp temp 1}>80}${color3}${endif}${hwmon coretemp temp 1}°C${color}  ${color2}${lua spark tmp ${hwmon coretemp temp 1} 18 100}${color}  ${color2} ${hwmon asus fan 1}${color}
${color2}${execi 99999 grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | cut -c2-32}${color}
${color2}${top name 1} ${top cpu 1}%   ${top name 2} ${top cpu 2}%${color}
${color2}${top name 3} ${top cpu 3}%   ${top name 4} ${top cpu 4}%${color}
${color2}──────────────────────────────────${color}
${color1} ${color}${memperc}%  ${color1}${lua bar ${memperc} 12}${color}  ${color2}${mem} / ${memmax}${color}
     ${color1}${lua spark mem ${memperc} 24 100}${color}
${color2}swap ${swapperc}% · cache ${cached} · buf ${buffers}${color}
${color2}${top_mem name 1} ${top_mem mem_res 1}   ${top_mem name 2} ${top_mem mem_res 2}${color}
${color2}${top_mem name 3} ${top_mem mem_res 3}   ${top_mem name 4} ${top_mem mem_res 4}${color}
${color2}──────────────────────────────────${color}
${color1} ${color}${fs_used_perc /}%  ${color1}${lua bar ${fs_used_perc /} 12}${color}  ${color2}${fs_used /} / ${fs_size /} ${fs_type /}${color}
${color2} ${hwmon nvme temp 1}°C nvme · r ${diskio_read /dev/nvme0n1} w ${diskio_write /dev/nvme0n1}${color}
${color2}──────────────────────────────────${color}
${if_up wlan0}${color1} ${color}${wireless_essid wlan0}  ${color1}${lua bar ${wireless_link_qual_perc wlan0} 10}${color} ${color2}${wireless_link_qual_perc wlan0}%${color}
${color1} ${color}${color2}${lua spark dn ${downspeedf wlan0} 18} ${downspeed wlan0} · ${totaldown wlan0}${color}
${color1} ${color}${color2}${lua spark up ${upspeedf wlan0} 18} ${upspeed wlan0} · ${totalup wlan0}${color}
${color2} ${addr wlan0}   ${gw_ip}${color}
${color2}${wireless_bitrate wlan0} · ch ${wireless_channel wlan0} ·  ${hwmon iwlwifi_1 temp 1}°C${color}${else}${color3} offline${color}${endif}
${color2}──────────────────────────────────${color}
${color1} ${color}${if_match ${battery_percent BAT1}<20}${color3}${endif}${battery_percent BAT1}%${color}  ${color1}${lua bar ${battery_percent BAT1} 12}${color}  ${color2}${battery_time BAT1}${color}
${color2} ${execi 5 awk 'NR==1{c=$1}NR==2{v=$1}END{printf "%.1f W", c*v/1e12}' /sys/class/power_supply/BAT1/current_now /sys/class/power_supply/BAT1/voltage_now} · ${execi 10 awk '{printf "%.2f V", $1/1e6}' /sys/class/power_supply/BAT1/voltage_now} ·  ${execi 5 cat /sys/class/power_supply/ACAD/online | sed 's/1/AC/;s/0/batt/'}${color}
${color2}health ${execi 600 awk 'NR==1{f=$1}NR==2{d=$1}END{printf "%.0f%%", 100*f/d}' /sys/class/power_supply/BAT1/charge_full /sys/class/power_supply/BAT1/charge_full_design} · ${execi 600 cat /sys/class/power_supply/BAT1/cycle_count} cycles${color}
${color2}──────────────────────────────────${color}
${color1} ${color}${pa_sink_volume}%  ${color1}${lua bar ${pa_sink_volume} 12}${color}
${color2} ${execi 5 playerctl metadata --format '{{artist}} - {{title}}' 2>/dev/null | cut -c1-30}${color}
${color2}──────────────────────────────────${color}
${execi 1800 (curl -sm 15 'https://wttr.in/?format=j1' -o ~/.cache/wx.new && mv -f ~/.cache/wx.new ~/.cache/conky-wx.json) >/dev/null 2>&1 &}${execpi 1800 jq -rf ~/.config/conky/weather.jq ~/.cache/conky-wx.json 2>/dev/null}]]
