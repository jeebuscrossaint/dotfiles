-- ~/.config/conky/conky.conf — the desktop readout, in place of a bar.
--
-- conky because it is the one desktop monitor in BOTH Arch (extra/conky) and
-- OpenBSD (sysutils/conky), and 1.24 has a native Wayland backend -- `conky -v`
-- prints a Wayland section, so this is layer-shell, not XWayland.
--
-- own_window_type = 'desktop' puts it on the BACKGROUND layer: under windows,
-- visible on an empty tag, costing no screen space and covering nothing. That is
-- the right trade on a tiler. 'override' floats it on top instead.
--
-- NO GPU SECTION, deliberately. The RTX 4070 sits in D3cold and conky's nvidia
-- variables (and nvidia-smi) wake it on every read, which on this machine means
-- holding the discrete card powered for a number nobody is looking at. Check it
-- with `cat /sys/bus/pci/devices/0000:01:00.0/power_state` before reconsidering.
--
-- NO DRAWING PRIMITIVES. conky's Wayland backend implements almost nothing from
-- the X11 one -- `conky -v` lists a dozen X11 features and only "Mouse events"
-- under Wayland. ${stippled_hr}, ${hr}, ${cpugraph}, ${cpubar}, ${membar},
-- ${fs_bar} and ${battery_bar} are X11 drawing calls, and hitting one does not
-- warn or skip: it silently ENDS THE RENDER, so everything below it disappears.
-- That is why the separators here are literal box characters and every reading
-- is a number. ${goto} is avoided for the same reason -- columns are padded with
-- spaces, which is safe in a monospace face.
--
-- Rendering to stdout does NOT catch this: the console backend happily draws
-- bars that the Wayland one refuses. Check a change by restarting conky and
-- looking at the screen.
--
-- Validate variable NAMES by rendering to stdout:
--   sed 's/out_to_wayland = true/out_to_console=true, total_run_times=1, out_to_wayland=false/' \
--     ~/.config/conky/conky.conf > /tmp/r.conf && conky -c /tmp/r.conf
-- That is how BAT1 (there is no BAT0) and ${pa_sink_volume} (pa_sink_volumeperc
-- does not exist and renders as literal text) were caught.

-- coat writes coat-colors.lua on every `coat set`, and signals this process with
-- SIGUSR1 so it re-reads. dofile rather than require: conky does not put this
-- directory on package.path, and require would need the module name mangling.
--
-- Guarded, and not defensively for its own sake: a bare dofile on a missing file
-- is a Lua error, and a Lua error during a SIGUSR1 reload EXITS conky rather than
-- keeping the old config. That is a real state -- a fresh checkout before the
-- first `coat set`, or the instant coat is rewriting the file -- and it killed
-- conky exactly once during this module's first apply.
local ok, c = pcall(dofile, os.getenv("HOME") .. "/.config/conky/coat-colors.lua")
if not ok or type(c) ~= "table" then
    c = { font = "monospace", base05 = "D0D0D0", base0D = "8AB4F8",
          base03 = "505050", base08 = "F28B82" }
end

conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',

    -- 1s because the clock shows seconds. Everything expensive is on its own
    -- longer interval below, so this costs almost nothing: the per-second work
    -- is all built-in variables reading /proc and /sys.
    -- 0.5 rather than 1 so the cava line animates rather than stepping. The
    -- per-tick work is /proc reads and the ${execi}s keep their own intervals,
    -- so this does not double the cost of the panel.
    update_interval = 0.5,
    double_buffer = true,
    no_buffers = true,

    alignment = 'top_right',
    gap_x = 24,
    gap_y = 24,
    -- MEASURED: SFMono at size 12 is ~9.9px per character, not the ~8.5 an
    -- earlier guess used -- which is why the process rows were clipping at 460.
    -- Longest line is 45 chars (a two-column process row) = ~446px.
    -- Text past the cap is CLIPPED mid-word rather than wrapped, so the cap, the
    -- font size, top_name_width and weather.jq's truncation all have to agree.
    minimum_width = 500,
    maximum_width = 500,
    border_inner_margin = 0,
    border_outer_margin = 0,

    use_xft = true,
    -- Size from coat too, not just the family. coat.yaml has a per-module
    -- override pinning conky's desktop size, because this readout is ~102 lines
    -- and the global desktop size is tuned for things that are not. Raising it
    -- much past 8 runs the block off the bottom of a 1600px panel.
    font = c.font .. ':size=' .. c.size_desktop,
    override_utf8_locale = true,

    -- base05 is base16's foreground slot, so it is light on a dark scheme and
    -- dark on a light one with no branching needed here -- which is exactly the
    -- behaviour wanted, and why the primary colour is not spelled out per variant.
    --
    -- color2 was base03 and that was wrong. base03 is a DARK grey, and this draws
    -- straight onto the wallpaper with no background of its own, so "dim" meant
    -- "invisible over a photo" -- and 34 of the lines here use it. The secondary
    -- tier is the same foreground now; hierarchy comes from the accent on labels
    -- and from layout, not from dimming text into the picture behind it.
    default_color = c.base05,
    color1 = c.base0D,  -- accent: icons and labels
    color2 = c.base05,  -- secondary: same weight, see above
    color3 = c.base08,  -- alert

    -- A one-pixel drop shadow in the background colour. This is the thing that
    -- actually makes text readable over an arbitrary wallpaper: base05 alone is
    -- fine against base00 and can still vanish into a bright photo. base00 is the
    -- right shade in both variants, since it is whatever the scheme calls the
    -- background.
    draw_shades = true,
    default_shade_color = c.base00,

    -- conky silently drops an exec command past ~200 chars. The weather jq
    -- program lives in weather.jq for that reason; this buys headroom for the
    -- rest. A blank block with no error is what hitting the cap looks like.
    lua_load = os.getenv('HOME') .. '/.config/conky/conky.lua',

    text_buffer_size = 2048,

    short_units = true,
    pad_percents = 2,
    -- 12, not 14: two columns of names plus their percentages is what sets the
    -- panel width, and 14 pushed the second column's value off the edge.
    top_name_width = 12,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
}

conky.text = [[
${color1}${font ]] .. c.font .. ':size=' .. math.floor(c.size_desktop * 2.75 + 0.5) .. [[}${time %H:%M:%S}${font}${color} ${color1}${lua spin}${color}
${color1} ${color}${time %a %d %b %Y} · wk ${time %V} · day ${time %j}
${color1} ${color}${execi 2 mmsg get all-tags 2>/dev/null | jq -r '[.all_tags[0].tags[] | select(.is_active or (.client_count // 0) > 0) | if .is_urgent then "!\(.index)" elif .is_active then "[\(.index)]" else "\(.index)" end] | join(" ")'}   ${color1} ${color}${execi 2 mmsg get focusing-client 2>/dev/null | jq -r '.appid // "-"'}
${color2}────────────────────────────────────────────${color}
${color1} ${color}${nodename}   ${color1} ${color}${execi 99999 . /etc/os-release; echo $PRETTY_NAME}
${color1} ${color}${kernel}   ${color1} ${color}${execi 3600 pacman -Qq 2>/dev/null | wc -l}, ${execi 3600 pacman -Qu 2>/dev/null | wc -l} stale
${color1} ${color}${uptime}   ${color1} ${color}${loadavg}
${color1} ${color}${processes}p ${threads}t ${running_processes}r · ${entropy_avail}b ent
${color2}────────────────────────────────────────────${color}
${color1} ${color}${cpu cpu0}%  ${color1}${lua fbar ${cpu cpu0} 14}${color}  ${freq_g}GHz ${color2}${execi 60 cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor}${color}
${color1}${lua spark cpu ${cpu cpu0} 34 100}${color}
${color2}${lua fbar ${cpu cpu1} 3} ${lua fbar ${cpu cpu2} 3} ${lua fbar ${cpu cpu3} 3} ${lua fbar ${cpu cpu4} 3} ${lua fbar ${cpu cpu5} 3} ${lua fbar ${cpu cpu6} 3} ${lua fbar ${cpu cpu7} 3} ${lua fbar ${cpu cpu8} 3}${color}
${color2}${lua fbar ${cpu cpu9} 3} ${lua fbar ${cpu cpu10} 3} ${lua fbar ${cpu cpu11} 3} ${lua fbar ${cpu cpu12} 3} ${lua fbar ${cpu cpu13} 3} ${lua fbar ${cpu cpu14} 3} ${lua fbar ${cpu cpu15} 3} ${lua fbar ${cpu cpu16} 3}${color}
${color1} ${color}${if_match ${hwmon coretemp temp 1}>80}${color ]] .. c.base08 .. [[}${endif}${hwmon coretemp temp 1}°C${color} ${color2}${lua spark tmp ${hwmon coretemp temp 1} 22 100}${color} ${color1} ${color}${hwmon asus fan 1}
${color2}${execi 99999 grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | cut -c2-30}${color}
${color ]] .. c.base08 .. [[}${top name 1} ${top cpu 1}%${color}   ${color ]] .. c.base09 .. [[}${top name 2} ${top cpu 2}%${color}
${color ]] .. c.base0A .. [[}${top name 3} ${top cpu 3}%${color}   ${color ]] .. c.base0B .. [[}${top name 4} ${top cpu 4}%${color}
${color2}────────────────────────────────────────────${color}
${color1} ${color}${memperc}%  ${color1}${lua fbar ${memperc} 14}${color}  ${mem}/${memmax}
${color1}${lua spark mem ${memperc} 34 100}${color}
${color2}swap ${swapperc}% · cache ${cached} · buf ${buffers}
${color}${color ]] .. c.base08 .. [[}${top_mem name 1} ${top_mem mem_res 1}${color}   ${color ]] .. c.base09 .. [[}${top_mem name 2} ${top_mem mem_res 2}${color}
${color ]] .. c.base0A .. [[}${top_mem name 3} ${top_mem mem_res 3}${color}   ${color ]] .. c.base0B .. [[}${top_mem name 4} ${top_mem mem_res 4}${color}
${color2}────────────────────────────────────────────${color}
${color1} ${color}${fs_used_perc /}%  ${color1}${lua fbar ${fs_used_perc /} 14}${color}  ${fs_used /}/${fs_size /}
${color2} ${hwmon nvme temp 1}°C nvme · r ${diskio_read /dev/nvme0n1} w ${diskio_write /dev/nvme0n1}${color}
${color2}────────────────────────────────────────────${color}
${if_up wlan0}${color1} ${color}${wireless_essid wlan0}  ${color1}${lua fbar ${wireless_link_qual_perc wlan0} 10}${color} ${wireless_link_qual_perc wlan0}%
${color1} ${color}${color2}${lua spark dn ${downspeedf wlan0} 22}${color} ${downspeed wlan0} ${color2}· ${totaldown wlan0}${color}
${color1} ${color}${color2}${lua spark up ${upspeedf wlan0} 22}${color} ${upspeed wlan0} ${color2}· ${totalup wlan0}${color}
${color2} ${addr wlan0} ·  ${gw_ip}
${wireless_bitrate wlan0} · ch ${wireless_channel wlan0} ·  ${hwmon iwlwifi_1 temp 1}°C${color}${else}${color ]] .. c.base08 .. [[} offline${color}${endif}
${color2}────────────────────────────────────────────${color}
${color1} ${color}${if_match ${battery_percent BAT1}<20}${color ${lua pulse ]] .. c.base08 .. [[ ]] .. c.base05 .. [[}}${endif}${battery_percent BAT1}%${color}  ${color1}${lua fbar ${battery_percent BAT1} 14}${color}  ${battery_time BAT1}
${color1} ${color}${execi 5 awk 'NR==1{c=$1}NR==2{v=$1}END{printf "%.1f W", c*v/1e12}' /sys/class/power_supply/BAT1/current_now /sys/class/power_supply/BAT1/voltage_now} ${color2}· ${execi 10 awk '{printf "%.2f V", $1/1e6}' /sys/class/power_supply/BAT1/voltage_now} ·  ${execi 5 cat /sys/class/power_supply/ACAD/online | sed 's/1/AC/;s/0/batt/'}${color}
${color2}health ${execi 600 awk 'NR==1{f=$1}NR==2{d=$1}END{printf "%.0f%%", 100*f/d}' /sys/class/power_supply/BAT1/charge_full /sys/class/power_supply/BAT1/charge_full_design} · ${execi 600 cat /sys/class/power_supply/BAT1/cycle_count} cycles${color}
${color2}────────────────────────────────────────────${color}
${color1} ${color}${pa_sink_volume}%  ${color1}${lua fbar ${pa_sink_volume} 14}${color}
${color1} ${color}${lua cava 28}
${color1} ${color}${scroll 34 ${execi 5 playerctl metadata --format '{{artist}} - {{title}}' 2>/dev/null}    }
]]
