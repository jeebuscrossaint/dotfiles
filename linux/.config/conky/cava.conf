# cava, configured to emit numbers instead of drawing bars, for conky.
#
# Lives here rather than in ~/.config/cava because that directory holds the
# normal cava config, which coat themes; this one is not a cava you look at, it
# is a data source. cava takes -p so the path does not matter.
#
# The pipeline is: cava writes one line per frame to stdout, mango pipes it
# through a loop that keeps only the newest line in ~/.cache/cava.state, and
# conky's Lua reads that file. A state file rather than a fifo, because a fifo
# blocks the writer when nothing is reading and conky only reads on its own tick.

# Listen to what is PLAYING, not to the microphone. cava's default input picks a
# capture source; the sink's .monitor is the loopback of output audio, which is
# what a visualiser wants. Named explicitly rather than left on auto, since auto
# resolved to something silent here.
[input]
method = pulse
source = alsa_output.pci-0000_00_1f.3.analog-stereo.monitor

[general]
# Frames the WRITER produces. conky samples the file at its own update_interval,
# so this only needs to be at least as fast as conky -- past that it is wasted.
framerate = 15
bars = 28
autosens = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
# 0-8, which maps onto the eight block heights plus blank for silence.
ascii_max_range = 8
bar_delimiter = 59
