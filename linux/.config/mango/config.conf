#ov_tab_mode_launch_next=             # int
#scratchpad_cross_monitor=            # int
scratchpad_height_ratio=0.9
scratchpad_width_ratio=0.8
#single_scratchpad=                   # int
sloppyfocus=1
snap_distance=30
#tag_carousel=                        # float
#tag_gather=                          # int
#view_current_to_back=                # int

# --- group bar ---------------------------------------------------------------
#group_bar_decorate_bg_color=         # color
#group_bar_decorate_border_color=     # color
group_bar_decorate_border_width=0
group_bar_decorate_corner_radius=8
#group_bar_decorate_fg_color=         # color
#group_bar_decorate_focus_bg_color=   # color
#group_bar_decorate_focus_fg_color=   # color
group_bar_decorate_font_desc=Adwaita Sans 10
group_bar_decorate_padding_x=10
group_bar_decorate_padding_y=3
# mango has NO titlebars and no window buttons, so traffic lights are impossible. The
# nearest thing is this: a GROUP of windows gets a tab strip carrying each window's title.
# Verified in the source -- mango_group_bar_update() is passed the title -- but it only
# draws for grouped windows, NOT every window, so a lone window shows nothing. Join with
# Super+Shift+G. Set 0 if you never group.
group_bar_height=24

