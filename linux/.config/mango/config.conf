# Added by coat — pulls in the generated colour/font fragment. Never edit that file.
source=/home/amarnath/.config/mango/coat-colors.conf

# mango config. Colours live in coat-colors.conf -- don't set any here, last
# write wins. Unset options fall back to mango's defaults.
# Check: mango -c ~/.config/mango/config.conf -p     Reload: Super+Shift+C


# ============================================================================
#  Appearance
# ============================================================================

# --- border / opacity ---
border_px=2
border_radius=8
no_border_when_single=1
no_radius_when_single=1
# Opacity fades the whole window, text included; translucency is per-app via coat.
focused_opacity=1.0
unfocused_opacity=0.67

# --- gaps ---
gap_inner_horizontal=25
gap_inner_vertical=25
gap_outer_horizontal=25
gap_outer_vertical=25
smart_gaps=1
overview_gap_inner=12
overview_gap_outer=40
overcircle_center_ratio=0.5

# --- blur ---
# Only affects transparent areas; the alpha comes from coat's opacity settings.
blur=1
blur_layer=1
# Blurs against the cached wallpaper instead of live windows -- much cheaper.
blur_optimized=1
blur_params_brightness=0.85
blur_params_contrast=1.1
blur_params_noise=0.02
blur_params_num_passes=3
blur_params_radius=10
blur_params_saturation=1.25

# --- shadows ---
shadows=1
shadow_only_floating=0
layer_shadows=1
shadows_blur=40
shadows_position_x=0
shadows_position_y=12
shadows_size=25


# ============================================================================
#  Animations
# ============================================================================
# Curves are left unset on purpose: stock beat every tuned set tried.
animations=1
animation_fade_in=1
animation_fade_out=1
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
zoom_initial_ratio=0.4
zoom_end_ratio=0.8

animation_type_open=slide
# Not slide: mango hardcodes the close slide to go up/down.
animation_type_close=zoom

animation_duration_open=310
animation_duration_close=390
# Also drives the overview, which re-arranges clients rather than using tags.
animation_duration_move=300
# Stock 0 snaps border colour/opacity on focus change.
animation_duration_focus=300

layer_animations=1
layer_animation_type_open=slide
layer_animation_type_close=slide
tag_animation_direction=1


# ============================================================================
#  Layouts
# ============================================================================
# What Super+space cycles; a tag on an unlisted layout jumps to the first.
circle_layout=tile,scroller,vertical_scroller,center_tile
default_master_factor=0.55
default_master_count=1
new_is_master=0
tag_num=9
center_master_overspread=1

# --- scroller ---
scroller_default_proportion=1.0
scroller_default_proportion_single=1.0
# Must be 0 or the _single proportion above is ignored.
scroller_ignore_proportion_single=0
scroller_focus_center=0
scroller_prefer_center=0
scroller_proportion_preset=0.5,0.8,1.0
scroller_structs=20
edge_scroller_focus_allow_speed=0.0
edge_scroller_pointer_focus=1

# --- dwindle ---
dwindle_drop_simple_split=1
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_manual_split=0
dwindle_preserve_split=0
dwindle_smart_split=0


# ============================================================================
#  Input
# ============================================================================

# --- keyboard ---
xkb_rules_layout=us
repeat_delay=200
repeat_rate=50
numlock_on=0

# --- mouse ---
# libinput enums: 0=none 1=flat 2=adaptive
mouse_accel_profile=1
mouse_accel_speed=0.0
mouse_natural_scrolling=0
axis_bind_apply_timeout=100

# --- trackpad ---
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=0
trackpad_accel_profile=2
trackpad_accel_speed=0.0
trackpad_disable_while_typing=1
trackpad_natural_scrolling=0

# --- gestures ---
swipe_min_threshold=1
# Transition tracks the fingers instead of waiting for release.
gesture_live=1

# --- dragging ---
drag_tile_small=1
drag_tile_to_tile=1

# --- cursor ---
cursor_theme=WhiteSur-cursors
cursor_size=24
cursor_hide_timeout=3
warp_cursor=1
enable_hotarea=0
hotarea_size=10


# ============================================================================
#  Behaviour
# ============================================================================
sloppy_focus=1
focus_on_activate=1
focus_cross_monitor=0
focus_cross_tag=0
idle_inhibit_ignore_visible=0
enable_floating_snap=1
snap_distance=30
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9


# ============================================================================
#  Decorations
# ============================================================================
# The group bar is the only place a window title is drawn (grouped windows only).
group_bar_height=28
group_bar_decorate_font_desc=Adwaita Sans 10
group_bar_decorate_border_width=0
group_bar_decorate_corner_radius=8
group_bar_decorate_padding_x=12
group_bar_decorate_padding_y=5

jump_label_decorate_font_desc=Adwaita Sans Bold 16
jump_label_decorate_border_width=2
jump_label_decorate_corner_radius=8
jump_label_decorate_padding_x=12
jump_label_decorate_padding_y=5


# ============================================================================
#  Outputs & rules
# ============================================================================
# HDR needs the vulkan renderer, which rules out blur/shadows/radius (scenefx).
# To switch: uncomment this and set hdr:1 on eDP-1.
#env=WLR_RENDERER,vulkan

monitor_rule=name:eDP-1,x:0,y:0,scale:1,vrr:0,hdr:0,hdr_max_lum:616,hdr_max_avg_lum:400,hdr_min_lum:0.0005
monitor_rule=name:HDMI-A-1,width:3840,height:2160,refresh:30,x:2560,y:0,scale:1,vrr:0

window_rule=app_id:kitty,is_term:1,no_swallow:1
window_rule=app_id:pinentry.*,is_floating:1
window_rule=title:Picture-in-Picture,is_floating:1

# Namespaces: fuzzel = launcher, dunst = notifications, slurp = selection.
# Only one layerrule per layer_name per option set -- a second replaces the first.
layer_rule=animation_type_open:zoom,layer_name:launcher
layer_rule=animation_type_close:zoom,layer_name:launcher
layer_rule=animation_type_open:slide,layer_name:notifications
layer_rule=animation_type_close:slide,layer_name:notifications
# Keeps frost and the close animation out of screenshots.
layer_rule=no_blur:1,no_animation:1,layer_name:selection


# ============================================================================
#  Environment
# ============================================================================
env=QT_QPA_PLATFORM,wayland
env=MOZ_ENABLE_WAYLAND,1
env=_JAVA_AWT_WM_NONREPARENTING,1
env=XDG_CURRENT_DESKTOP,mango
env=XCURSOR_THEME,WhiteSur-cursors
env=XCURSOR_SIZE,24


# ============================================================================
#  Autostart  (exec-once = startup only; exec would re-run on every reload)
# ============================================================================
exec_once=dbus-update-activation-environment --all
exec_once=start-polkit
exec_once=audio-ensure
exec_once=dunst
exec_once=udiskie
exec_once=nvibrant 0 0 0 0
exec_once=osd nightlight start
exec_once=battery-watch
exec_once=rog-control-center --background

# conky exits when its output disappears (lid close), so it is supervised.
# ~/.cache/conky.off (Super+p) parks the loop instead of restarting it.
exec_once=while :; do if [ -e /home/amarnath/.cache/conky.off ]; then sleep 0.2; else conky >> /home/amarnath/.cache/conky.log 2>&1; sleep 3; fi; done
exec_once=while :; do if [ -e /home/amarnath/.cache/conky.off ]; then sleep 0.2; else conky -c /home/amarnath/.config/conky/conky-left.conf >> /home/amarnath/.cache/conky-left.log 2>&1; sleep 3; fi; done

# Lock at 5 min, blank at 5:30 (OLED). idle-guard skips both while audio plays.
exec_once=swayidle -w timeout 300 'idle-guard lock' resume 'idle-guard cancel' timeout 330 'idle-guard blank' resume 'idle-guard wake' before-sleep 'idle-guard now' after-resume 'idle-guard wake'

exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store
exec_once=wl-clip-persist --clipboard regular

# ActivityWatch -- full path, the package never links it into /usr/bin.
exec_once=/opt/activitywatch/aw-server-rust/aw-server-rust
exec_once=aw-awatcher


# ============================================================================
#  Keybinds
# ============================================================================
# Commas split a bind's arguments, so spawn_shell commands must not contain any.

# --- apps ---
bind=SUPER,q,spawn,kitty
bind=SUPER+SHIFT,Return,spawn,kitty
bind=SUPER+SHIFT,b,spawn,firefox-developer-edition
# fuzzel sized from the real screen: the ini's 2560x1600 numbers, scaled.
bind=SUPER,d,spawn_shell,read v < /sys/class/graphics/fb0/virtual_size; exec fuzzel --width=$(( ${v%%[!0-9]*} * 50 / 2560 )) --line-height=$(( ${v##*[!0-9]} * 26 / 1600 ))
bind=SUPER,v,spawn_shell,read v < /sys/class/graphics/fb0/virtual_size; cliphist list | fuzzel --dmenu --prompt "clip " --width=$(( ${v%%[!0-9]*} * 50 / 2560 )) --line-height=$(( ${v##*[!0-9]} * 26 / 1600 )) | cliphist decode | wl-copy
bind=SUPER+SHIFT,s,spawn,screenshot
bind=SUPER+SHIFT,e,spawn,screenshot-edit
bind=SUPER+SHIFT,p,spawn,pickcolor

# --- theme ---
bind=SUPER,t,spawn,theme-pick
bind=SUPER+SHIFT,t,spawn,theme-random
bind=SUPER+ALT,t,spawn,coat match

# --- session ---
bind=SUPER,l,spawn,idle-guard dark
bind=SUPER,Escape,spawn,idle-guard now
bind=SUPER,p,spawn_shell,if [ -e /home/amarnath/.cache/conky.off ]; then rm -f /home/amarnath/.cache/conky.off; else touch /home/amarnath/.cache/conky.off; pkill -x conky; fi
bind=SUPER+SHIFT,c,reload_config
bind=SUPER+SHIFT,q,quit

# --- toggles (osd tracks state itself, so trackpad must stay an osd bind) ---
bind=SUPER+ALT,n,spawn,osd nightlight
bind=SUPER+ALT,bracketleft,spawn,osd nightlight warmer
bind=SUPER+ALT,bracketright,spawn,osd nightlight cooler
bind=SUPER+ALT,v,spawn,osd touchpad
bind=none,XF86TouchpadToggle,spawn,osd touchpad
bind=none,XF86Launch1,spawn,rog-control-center
bind=SUPER,F5,togglehdr

# --- window state ---
bind=SUPER,c,killclient
bind=SUPER,Return,zoom
bind=SUPER,f,togglemaximizescreen
bind=SUPER,e,togglefullscreen
bind=SUPER,m,togglefullscreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,a,togglefakefullscreen
bind=SUPER+SHIFT,space,togglefloating
bind=SUPER+SHIFT,v,togglefloating
bind=SUPER+SHIFT,w,toggle_all_floating
bind=SUPER,g,toggleglobal
bind=SUPER,minus,minimized
bind=SUPER+SHIFT,minus,restore_minimized
bind=SUPER,z,toggle_scratchpad
bind=SUPER,grave,toggle_scratchpad

# --- groups ---
bind=SUPER+SHIFT,g,groupjoin
bind=SUPER+ALT,g,groupleave
bind=SUPER+ALT,Tab,groupfocus

# --- overview / jump ---
bind=SUPER,o,overcircle
bind=SUPER,s,togglejump

# --- focus ---
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev
