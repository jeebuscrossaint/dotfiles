# Added by coat — pulls in the generated colour/font fragment. Never edit that file.
source=/home/amarnath/.config/mango/coat-colors.conf

# mango 0.18.5 config. Colours live in coat-colors.conf -- don't set any here,
# last write wins. Unset options fall back to mango's defaults.
# Check: mango -p     Reload: automatic on save (auto_reload_config), or Super+Shift+C


# ============================================================================
#  Appearance
# ============================================================================

# --- border / opacity ---
border_px=2
border_radius=8
no_border_when_single=1
no_radius_when_single=1
monocle_no_border=1
monocle_no_gap=0
monocle_no_radius=1
# Opacity fades the whole window, text included; translucency is per-app via coat.
focused_opacity=1.0
unfocused_opacity=0.75

# --- gaps ---
gap_inner_horizontal=25
gap_inner_vertical=25
gap_outer_horizontal=25
gap_outer_vertical=25
smart_gaps=1
overview_gap_inner=12
overview_gap_outer=40
overcircle_center_ratio=0.5

# --- blur ---
# Only affects transparent areas; the alpha comes from coat's opacity settings.
blur=1
blur_layer=1
# 1 blurs against the cached wallpaper instead of live windows -- much cheaper.
blur_optimized=0
blur_params_brightness=1.0
blur_params_contrast=0.9
blur_params_noise=0.02
blur_params_num_passes=3
blur_params_radius=5
blur_params_saturation=1.1

# --- shadows ---
shadows=1
shadow_only_floating=0
layer_shadows=1
shadows_blur=40
shadows_position_x=0
shadows_position_y=12
shadows_size=25


# ============================================================================
#  Animations
# ============================================================================
# Curves are left unset on purpose: stock beat every tuned set tried.
animations=1
animation_fade_in=1
animation_fade_out=1
fade_in_begin_opacity=0.0
fade_out_begin_opacity=0.75
zoom_initial_ratio=0.5
zoom_end_ratio=0.8

animation_type_open=zoom
# Not slide: mango hardcodes the close slide to go up/down.
animation_type_close=zoom

animation_duration_open=300
animation_duration_close=220
# Also drives the overview, which re-arranges clients rather than using tags.
animation_duration_move=300
# Stock 0 snaps border colour/opacity on focus change.
animation_duration_focus=250

layer_animations=1
layer_animation_type_open=zoom
layer_animation_type_close=zoom
tag_animation_direction=1


# ============================================================================
#  Layout -- dwindle everywhere, nothing to cycle
# ============================================================================
circle_layout=dwindle
default_master_factor=0.5
default_master_count=1
new_is_master=0
tag_num=9

dwindle_drop_simple_split=1
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_manual_split=0
dwindle_preserve_split=0
dwindle_smart_split=0

# Without a rule a tag starts on tile, and there is no option to change that.
tag_rule=id:1,layout_name:dwindle
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:dwindle
tag_rule=id:5,layout_name:dwindle
tag_rule=id:6,layout_name:dwindle
tag_rule=id:7,layout_name:dwindle
tag_rule=id:8,layout_name:dwindle
tag_rule=id:9,layout_name:dwindle


# ============================================================================
#  Input
# ============================================================================

# --- keyboard ---
xkb_rules_layout=us
#xkb_rules_variant=colemak
#xkb_rules_options=caps:escape
repeat_delay=200
repeat_rate=50
numlock_on=0

# --- mouse ---
# libinput enums: 0=none 1=flat 2=adaptive
mouse_accel_profile=1
mouse_accel_speed=0.0
mouse_natural_scrolling=0
mouse_left_handed=0
mouse_middle_button_emulation=0
axis_scroll_factor=1.0
axis_bind_apply_timeout=100

# --- trackpad ---
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_accel_profile=2
trackpad_accel_speed=0.0
trackpad_disable_while_typing=1
trackpad_natural_scrolling=1
# 1=two-finger 2=edge 4=button
trackpad_scroll_method=1
# 1=button areas 2=clickfinger (1/2/3 fingers = left/right/middle)
trackpad_click_method=2
trackpad_scroll_factor=1.0
trackpad_left_handed=0
trackpad_middle_button_emulation=0
button_map=0

# --- gestures ---
swipe_min_threshold=1
# Transition tracks the fingers instead of waiting for release.
gesture_live=1
gesture_swipe_distance=300
gesture_swipe_cancel_ratio=0.5
gesture_swipe_min_speed_to_force=10

# --- dragging ---
drag_tile_small=1
drag_tile_to_tile=1
drag_warp_cursor=1
enable_border_resize=1
border_resize_size=10

# --- cursor ---
cursor_theme=WhiteSur-cursors
cursor_size=24
cursor_hide_timeout=3
cursor_hide_on_keypress=0
warp_cursor=1
enable_hotarea=0
hotarea_size=10


# ============================================================================
#  Behaviour
# ============================================================================
sloppy_focus=1
focus_on_activate=1
focus_cross_monitor=0
focus_cross_tag=0
focus_direction_only_zone_overlap=1
exchange_cross_monitor=0
view_current_to_back=0
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=1
enable_floating_snap=1
snap_distance=30
float_full_to_top=0
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
scratchpad_cross_monitor=0
single_scratchpad=1
special_tag_cross_monitor=0
tag_gather=0
tag_carousel=0
auto_reload_config=1
allow_shortcuts_inhibit=1
allow_lock_transparent=0
disable_middle_paste=0
xwayland_persistence=1
xwayland_ignore_scale=0
# Requires a restart.
sync_obj_enable=1


# ============================================================================
#  Decorations
# ============================================================================
# The group bar is the only place a window title is drawn (grouped windows only).
group_bar_height=28
group_bar_decorate_font_desc=Adwaita Sans 10
group_bar_decorate_border_width=0
group_bar_decorate_corner_radius=8
group_bar_decorate_padding_x=12
group_bar_decorate_padding_y=5

jump_label_decorate_font_desc=Adwaita Sans Bold 16
jump_label_decorate_border_width=2
jump_label_decorate_corner_radius=8
jump_label_decorate_padding_x=12
jump_label_decorate_padding_y=5


# ============================================================================
#  Outputs & rules
# ============================================================================
# HDR needs the vulkan renderer, which rules out blur/shadows/radius (scenefx).
# To switch: uncomment this and set hdr:1 on eDP-1.
#env=WLR_RENDERER,vulkan

monitor_rule=name:eDP-1,x:0,y:0,scale:1,vrr:0,hdr:0,hdr_max_lum:616,hdr_max_avg_lum:400,hdr_min_lum:0.0005
monitor_rule=name:HDMI-A-1,width:3840,height:2160,refresh:30,x:2560,y:0,scale:1,vrr:0

window_rule=app_id:kitty,is_term:1,no_swallow:1,focused_opacity:0.92
window_rule=app_id:discord,focused_opacity:0.92
window_rule=app_id:pinentry.*,is_floating:1
window_rule=app_id:com.saivert.pwvucontrol,is_floating:1
window_rule=app_id:org.pulseaudio.pavucontrol,is_floating:1
window_rule=app_id:rog-control-center,is_floating:1
window_rule=app_id:blueman-manager,is_floating:1
window_rule=title:Picture-in-Picture,is_floating:1
window_rule=app_id:steam,title:notificationtoasts_.*,is_floating:1

# Namespaces: fuzzel = launcher, dunst = notifications, slurp = selection.
# Only one layerrule per layer_name per option set -- a second replaces the first.
layer_rule=animation_type_open:zoom,layer_name:launcher
layer_rule=animation_type_close:zoom,layer_name:launcher
layer_rule=animation_type_open:slide,layer_name:notifications
layer_rule=animation_type_close:slide,layer_name:notifications
# Keeps frost and the close animation out of screenshots.
layer_rule=no_blur:1,no_animation:1,layer_name:selection


# ============================================================================
#  Environment
# ============================================================================
env=QT_QPA_PLATFORM,wayland;xcb
env=MOZ_ENABLE_WAYLAND,1
env=_JAVA_AWT_WM_NONREPARENTING,1
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_DESKTOP,mango
env=XCURSOR_THEME,WhiteSur-cursors
env=XCURSOR_SIZE,24


# ============================================================================
#  Autostart  (exec_once = startup only; exec would re-run on every reload)
# ============================================================================
# Portals and systemd user units need this session's WAYLAND_DISPLAY and
# XDG_CURRENT_DESKTOP (which selects mango-portals.conf).
exec_once=dbus-update-activation-environment --systemd --all
exec_once=/usr/lib/hyprpolkitagent/hyprpolkitagent
exec_once=audio-ensure
exec_once=dunst
exec_once=udiskie
exec_once=battery-watch
exec_once=rog-control-center --background --autostart
exec_once=osd nightlight start
# Lock at 5 min, blank at 5:30 -- see ~/.config/hypr/hypridle.conf.
exec_once=hypridle

# conky exits when its output disappears (lid close), so it is supervised.
# ~/.cache/conky.off (Super+p) parks the loop instead of restarting it.
exec_once=c=$HOME/.cache; while :; do if [ -e $c/conky.off ]; then sleep 0.2; else conky >> $c/conky.log 2>&1 & r=$!; conky -c $HOME/.config/conky/conky-left.conf >> $c/conky-left.log 2>&1 & l=$!; wait -n $r $l; kill $r $l 2>/dev/null; wait; sleep 3; fi; done

exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store
exec_once=wl-clip-persist --clipboard regular

# ActivityWatch -- full path, the package never links it into /usr/bin.
exec_once=/opt/activitywatch/aw-server-rust/aw-server-rust
exec_once=aw-awatcher


# ============================================================================
#  Keybinds
# ============================================================================
# Commas split a bind's arguments, so spawn_shell commands must not contain any.

# --- apps ---
bind=SUPER,q,spawn,kitty
bind=SUPER+SHIFT,Return,spawn,kitty
bind=SUPER+SHIFT,b,spawn,helium-browser
# fuzzel sized from the real screen: the ini's 2560x1600 numbers, scaled.
bind=SUPER,d,spawn_shell,read v < /sys/class/graphics/fb0/virtual_size; exec fuzzel --width=$(( ${v%%[!0-9]*} * 50 / 2560 )) --line-height=$(( ${v##*[!0-9]} * 26 / 1600 ))
bind=SUPER,v,spawn_shell,read v < /sys/class/graphics/fb0/virtual_size; cliphist list | fuzzel --dmenu --prompt "clip " --width=$(( ${v%%[!0-9]*} * 50 / 2560 )) --line-height=$(( ${v##*[!0-9]} * 26 / 1600 )) | cliphist decode | wl-copy
bind=SUPER+SHIFT,s,spawn_shell,mkdir -p ~/Pictures/Screenshots; f=~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png; grim -g "$(slurp)" "$f" && wl-copy < "$f"
bind=CTRL,Print,spawn_shell,mkdir -p ~/Pictures/Screenshots; f=~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png; grim "$f" && wl-copy < "$f"
bind=SUPER+SHIFT,e,spawn_shell,mkdir -p ~/Pictures/Screenshots; grim -g "$(slurp)" - | satty --filename - --output-filename "$HOME/Pictures/Screenshots/%Y%m%d_%H%M%S.png" --copy-command wl-copy --early-exit
bind=SUPER+SHIFT,p,spawn,hyprpicker -a -n -r
bind=SUPER,z,spawn_shell,pidof woomer || woomer

# --- theme ---
bind=SUPER,t,spawn_shell,s=$(coat list --no-preview | awk '/Slug:/{print $2}' | sort -u | fuzzel --dmenu --prompt 'theme ') && coat set "$s" >/dev/null 2>&1 && notify-send -t 2000 'Theme' "switched to $s"
bind=SUPER+SHIFT,t,spawn_shell,coat random -y >/dev/null 2>&1; notify-send -t 2000 'Theme' "switched to $(awk '$1=="scheme:"{print $2}' ~/.local/state/coat/state.yaml)"
bind=SUPER+ALT,t,spawn,coat match

# --- session ---
bind=SUPER,l,spawn_shell,pidof hyprlock || hyprlock
bind=SUPER,p,spawn_shell,if [ -e ~/.cache/conky.off ]; then rm -f ~/.cache/conky.off; else touch ~/.cache/conky.off; pkill -x conky; fi
bind=SUPER+SHIFT,c,reload_config
bind=SUPER+SHIFT,q,quit

# --- toggles ---
bind=SUPER+ALT,n,spawn,osd nightlight
bind=SUPER+ALT,bracketleft,spawn,osd nightlight warmer
bind=SUPER+ALT,bracketright,spawn,osd nightlight cooler
bind=none,XF86Launch1,spawn,rog-control-center
bind=SUPER,F5,togglehdr

