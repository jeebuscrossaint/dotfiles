# mango — the only compositor here. dwl underneath, dwm model, hot reload.
#
# Every option mango's parser accepts is below: all 197, from the strcmp(key,...)
# chain in parse_option() in src/config/parse_config.h at 0.16.1. The shipped
# /etc/mango/config.conf documents 98 of them.
#   key=value   in effect
#   #key=       unset, mango's default applies; the comment is the type it wants
#
# Colours are coat's: they live in coat-colors.conf, sourced above. Setting one here
# would win by last-write-wins and silently override the scheme.
#
# Check: mango -c ~/.config/mango/config.conf -p     Reload: Super+Shift+R

# --- border / frame ----------------------------------------------------------
border_radius=0
borderpx=6
focused_opacity=1.0
no_border_when_single=0
no_radius_when_single=0   # 0 = a lone window keeps its corners too
unfocused_opacity=1.0

# --- gaps --------------------------------------------------------------------
gappih=25
gappiv=25
gappoh=25
gappov=25
overviewgappi=5
overviewgappo=30
smartgaps=0   # 0 = keep gaps even for a lone window

# --- blur --------------------------------------------------------------------
blur=0   # per-frame shader pass; first thing to turn off if the laptop runs hot
blur_layer=1   # also frosts waybar/dock/fnott/fuzzel; without it only windows blur
blur_optimized=1
#blur_params_brightness=              # float
#blur_params_contrast=                # float
#blur_params_noise=                   # float
blur_params_num_passes=3
blur_params_radius=6
#blur_params_saturation=              # float

# --- shadows -----------------------------------------------------------------
shadow_only_floating=0
shadows=0
shadows_blur=20
#shadows_position_x=                  # int
#shadows_position_y=                  # int
shadows_size=10
#shadowscolor=                        # color

# --- animations --------------------------------------------------------------
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_opafadein=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_open=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_duration_close=250
animation_duration_focus=0
animation_duration_move=350
animation_duration_open=250
animation_duration_tag=250
animation_fade_in=1
animation_fade_out=1
animation_type_close=zoom
animation_type_open=zoom
animations=0
#layer_animation_type_close=          # ?
#layer_animation_type_open=           # ?
layer_animations=1
tag_animation_direction=1

# --- layouts -----------------------------------------------------------------
#center_master_overspread=            # int
#center_when_single_stack=            # int
#circle_layout=                       # ?
default_mfact=0.55
default_nmaster=1
new_is_master=1
tag_num=9   # the overview is built around 9

# --- scroller layout ---------------------------------------------------------
scroller_default_proportion=0.8
scroller_default_proportion_single=1.0
scroller_focus_center=0
#scroller_ignore_proportion_single=   # int
scroller_prefer_center=0
#scroller_prefer_overspread=          # int
scroller_proportion_preset=0.5,0.8,1.0
scroller_structs=20

# --- dwindle layout ----------------------------------------------------------
dwindle_drop_simple_split=1
dwindle_hsplit=1
dwindle_manual_split=0
dwindle_preserve_split=0
#dwindle_smart_resize=                # int
dwindle_smart_split=0
#dwindle_split_ratio=                 # float
dwindle_vsplit=1

# --- keyboard ----------------------------------------------------------------
