# Three-finger tag switch. gesturebind=MODS,DIRECTION,FINGERS,DISPATCHER -- new
# in 0.17.0, and fingers is 3 or 4 only.
#
# The tag follows the fingers: swipe right and the workspace to the LEFT comes
# in from the left, which is the macOS/GNOME convention and mango's own default.
# It reads backwards against trackpad_natural_scrolling=0 if you think of it as
# scrolling; swap the two dispatchers if it does.
gesturebind=none,right,3,viewtoleft_have_client
gesturebind=none,left,3,viewtoright_have_client
# Up into the carousel. It pairs with gesture_live below: the overview tracks your
# fingers on the way in, so a half-swipe shows it and falls back if you let go.
gesturebind=none,up,3,overcircle
# The 0.17.0 feature that makes it a slide rather than a jump: the transition
# tracks your fingers and follows them back if you change your mind. 0 waits for
# the release and then animates.
gesture_live=1

# --- env + autostart ------------------------------------------------------
# exec-once runs at startup only; exec runs on every reload. Daemons go in
# exec-once -- under dwl, autostart re-ran on reload and tore down pipewire.
env=QT_QPA_PLATFORM,wayland
env=MOZ_ENABLE_WAYLAND,1
env=_JAVA_AWT_WM_NONREPARENTING,1
env=XDG_CURRENT_DESKTOP,mango
env=XCURSOR_THEME,WhiteSur-cursors
env=XCURSOR_SIZE,24
# The .off flag is the toggle (SUPER+p): the loop is what would otherwise
# undo a kill, so it has to agree that conky is meant to be down.
# Supervised, because conky EXITS when its output goes away -- closing the lid
# disables eDP, conky's surface loses the output it was allocated against, its
# next shm buffer fails and it quits:
#
#   creating a buffer file for 1965008B failed: No such file or directory
#   could not allocate shm pool for 382x643 window
#
# It cannot re-attach on its own, so the loop brings it back when the lid
# opens. The sleep caps a bad config at ~20 restarts a minute instead of a
# spin, and stderr is appended so the reason survives the restart -- exec-once
# throws it away otherwise, which is why the first two crashes had no evidence.
exec-once=while :; do [ -e /home/amarnath/.cache/conky.off ] || conky >> /home/amarnath/.cache/conky.log 2>&1; sleep 3; done
# Second instance, top-left: weather, calendar and headlines. Split from the
# main panel because the two together are ~1770px on a 1600px screen, and
# because nothing in it changes in a second -- it runs at 30s, not 1s.
exec-once=while :; do [ -e /home/amarnath/.cache/conky.off ] || conky -c /home/amarnath/.config/conky/conky-left.conf >> /home/amarnath/.cache/conky-left.log 2>&1; sleep 3; done
exec-once=dunst
# Lock at five minutes, power the panel off thirty seconds later. The panel is
# OLED: a lock screen that sits lit on one static frame all night is the thing
# being avoided, so locking without blanking is not half a solution, it is the
# failure mode.
#
# idle-guard, not swaylock or wlopm directly: it waits out anything audibly
# playing rather than locking and blanking in the middle of it.
#
# Each `resume` binds to the timeout before it, so the wake only fires if the
# blank did. after-resume is for the lid -- a suspend that ends with the output
# still powered off wakes to a black panel and no way to see that it is awake.
exec-once=swayidle -w timeout 300 'idle-guard lock' resume 'idle-guard cancel' timeout 330 'idle-guard blank' resume 'idle-guard wake' before-sleep 'idle-guard now' after-resume 'idle-guard wake'
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store
exec-once=wl-clip-persist --clipboard regular
exec-once=dbus-update-activation-environment --all
# Night light, on the sunrise/sunset cycle for this latitude. osd owns it so the
# coordinates and the temperature live in one place and Super+Alt+N can toggle
# the same daemon; `start` is the quiet form, with no popup at login.
exec-once=osd nightlight start
exec-once=start-polkit
exec-once=audio-ensure
# battery-watch documented itself as started from here and never was, so the low
# battery warning has been dead the whole time. It polls; it does not need one of
# the guards above.
exec-once=battery-watch

# --- rule sub-options, reference only -------------------------------------
# windowrule/monitorrule/layerrule/devicerule take these as name:value, comma-
# separated. All 105 the parser accepts.
#
# `mango -p` does NOT check them, whatever it says in `mango --help` ("Check
# configuration file error"): on 0.16.3 it exits 0 on a file containing nothing
# but `this_is_not_a_directive=1`. An earlier note here claimed it rejects an
# unknown sub-option by name; it does not, and a typo'd rule is silently a rule
# that never matches. This list is the only reference there is.
#
#   accel_profile  accel_speed  activation_bypass  allow_csd  allow_shortcuts_inhibit  animation_type_close  animation_type_open
#   appid  button_map  click_method  custom  disable  disable_while_typing  drag_lock
#   focused_opacity  force_fakemaximize  force_render  force_tearing  force_tiled_state  globalkeybinding  hdr
#   hdr_force  hdr_max_avg_lum  hdr_max_lum  hdr_min_lum  height  icc  id
#   idleinhibit_when_focus  ignore_maximize  ignore_minimize  isfakefullscreen  isfloating  isfullscreen  isglobal
#   isnamedscratchpad  isnoanimation  isnoborder  isnoradius  isnoshadow  isnosizehint  isopensilent
#   isoverlay  istagsilent  isterm  isunglobal  kb_layout  kb_model  kb_options
#   kb_rules  kb_variant  layer_name  layout_name  left_handed  make  mfact
#   middle_button_emulation  model  monitor  monitor_make  monitor_model  monitor_name  monitor_serial
#   name  natural_scrolling  nmaster  no_force_center  no_hide  no_render_border  noanim
#   noblur  nofadein  nofadeout  nofocus  noshadow  noswallow  offsetx
#   offsety  open_as_floating  refresh  repeat_delay  repeat_rate  rr  scale
#   scroll_button  scroll_method  scroller_default_proportion  scroller_default_proportion_single  scroller_ignore_proportion_single  scroller_proportion  scroller_proportion_single
#   send_events_mode  serial  shield_when_capture  tags  tap_and_drag  tap_to_click  title
#   type  unfocused_opacity  vrr  vrr_only_fullscreen  width  x  y
