# mango — dwl-based Wayland compositor, dwm model.
#
# This is why mango and not dwl or river:
#   - It IS dwl underneath, so tags, layouts and the whole mental model carry
#     over unchanged.
#   - The config is a RUNTIME file with hot reload. Changing a keybind costs
#     nothing: no rebuild, no session restart, and critically no re-running of
#     the audio launcher (see the exec-once note below -- that is the bug that
#     ate an afternoon under dwl).
#   - It is in OpenBSD ports (0.15.6) as well as the AUR, which river-classic is
#     not. That was the whole reason for the detour through river.
#
# Validate without starting anything:   mango -c ~/.config/mango/config.conf -p
# Reload a running instance:            Super+Shift+R
#
# Option names and argument shapes here were taken from mango's own parser
# (src/config/parse_config.h) and assets/config.conf, not from memory.

# ============================================================== appearance ===
# Framer, from coat. 0xRRGGBBAA.
rootcolor=0x181818ff        # base00
bordercolor=0x747474ff      # base03
focuscolor=0xd0d0d0ff       # base05 -- what dwl used for the focused border
urgentcolor=0xfd886bff      # base08
scratchpadcolor=0x20bcfcff  # base0D, the accent
maximizescreencolor=0x89aa61ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff
dropcolor=0x20bcfc55
splitcolor=0xfd886bff

borderpx=1
border_radius=8
no_radius_when_single=1
no_border_when_single=1

# 8px, the number the dwl config settled on. smartgaps drops the outer gap for a
# lone tiled window, as sway's smart_gaps did.
gappih=8
gappiv=8
gappoh=8
gappov=8
smartgaps=1

focused_opacity=1.0
unfocused_opacity=1.0

# ================================================================= effects ===
# Animations and rounded corners are cheap. BLUR IS NOT -- it is a per-frame
# shader pass, and this is a battery-first laptop with a 2560x1600 240Hz panel.
# It is left off deliberately; set blur=1 to try it, and expect to notice it on
# battery. Shadows are limited to floating windows, which is where they read as
# depth rather than noise.
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5

shadows=1
layer_shadows=0
shadow_only_floating=1
shadows_size=10
shadows_blur=15
shadowscolor=0x00000088

animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
animation_duration_open=300
animation_duration_move=350
animation_duration_tag=250
animation_duration_close=350
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1

# ================================================================= layouts ===
# tile, scroller, grid, deck, monocle, center_tile, vertical_tile,
# vertical_scroller. Eight, against dwl's twelve -- missing the fibonacci
# spiral, snail, bstack and mastercol. Every tag gets its own layout, which dwl
# could not do at all.
tag_num=9
new_is_master=1
default_mfact=0.55
default_nmaster=1

tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:monocle
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:grid
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:scroller

# ================================================================ monitors ===
# Replaces dwl's monrules[] AND kanshi: mango does per-output modes natively, at
# runtime, and re-applies on reload.
#
# vrr is deliberately 0. dwl asked for adaptive sync on both outputs and a
# connector refusing it is what segfaulted it -- get the stack known-good first,
# then turn it on one output at a time.
monitorrule=name:eDP-1,width:2560,height:1600,refresh:240,x:0,y:0,scale:1,vrr:0
monitorrule=name:HDMI-A-1,width:3840,height:2160,refresh:30,x:2560,y:0,scale:1,vrr:0

# ==================================================================== input ===
sloppyfocus=1
warpcursor=1
cursor_size=24
repeat_rate=50
repeat_delay=200
xkb_rules_layout=us

tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
mouse_natural_scrolling=0

# ============================================================== behaviour ====
focus_on_activate=1
enable_floating_snap=1
snap_distance=30
drag_tile_to_tile=1
enable_hotarea=0
overviewgappi=5
overviewgappo=30

# ================================================================ env vars ===
env=QT_QPA_PLATFORM,wayland
env=MOZ_ENABLE_WAYLAND,1
env=_JAVA_AWT_WM_NONREPARENTING,1
env=XDG_CURRENT_DESKTOP,mango

# =============================================================== autostart ===
# exec-once runs ONLY at compositor startup. exec runs on every config reload.
#
# This distinction is the fix for the dwl trap: there, autostart[] re-ran on
# every reload and tore down the whole pipewire stack, repeatedly leaving three
# audio processes alive with no ALSA devices. Anything that owns state or a
# daemon belongs in exec-once and nowhere else.
exec-once=swaybg -m fill -i /home/amarnath/jbwallpapers/wallpapers/Matanuska-River-ENBLA05.jpg
exec-once=fnott
exec-once=waybar
exec-once=swayidle -w -C /home/amarnath/.config/swayidle/config
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store
exec-once=wl-clip-persist --clipboard regular
exec-once=dbus-update-activation-environment --all
exec-once=start-polkit
exec-once=canvas-notify
exec-once=/usr/lib/xdg-desktop-portal-wlr
exec-once=nvibrant 1023 1023 1023 1023
# Guarded: only brings audio up if there is no working sink. Never a bare
# `restart`, and never in `exec`.
exec-once=sh -c 'wpctl status 2>/dev/null | grep -q "Sinks:" || artix-pipewire-launcher restart'
exec-once=refresh-paru-completions

# ================================================================== launch ===
bind=SUPER,q,spawn,foot
bind=SUPER+SHIFT,Return,spawn,foot
bind=SUPER,d,spawn,wmenu-run
bind=SUPER,v,spawn_shell,cliphist list | wmenu -i -p clip | cliphist decode | wl-copy
bind=SUPER+SHIFT,b,spawn,firefox
bind=SUPER,t,spawn,theme-pick
bind=SUPER+SHIFT,t,spawn,theme-random
bind=SUPER+SHIFT,s,spawn,swayscreenshot
bind=SUPER+SHIFT,e,spawn,swayscreenshot-edit
bind=SUPER+SHIFT,p,spawn,grimpicker -n -c
bind=SUPER,Escape,spawn,swaylock -f
bind=SUPER,Delete,spawn,wlboard
# Native. No rebuild, no restart, no dwl-reload script.
bind=SUPER+SHIFT,r,reload_config
bind=SUPER+SHIFT,q,quit

# ================================================================== window ===
bind=SUPER,c,killclient
bind=SUPER+SHIFT,c,killclient
bind=SUPER,Return,zoom
bind=SUPER,f,togglefullscreen
bind=SUPER,e,togglefullscreen
bind=SUPER+SHIFT,space,togglefloating
bind=SUPER+SHIFT,f,togglefakefullscreen
bind=SUPER,a,togglemaximizescreen
bind=SUPER,g,toggleglobal
bind=SUPER,o,toggleoverview
bind=SUPER,z,toggle_scratchpad
bind=SUPER,minus,minimized
bind=SUPER+SHIFT,minus,restore_minimized
# Native touchpad toggle -- no device name to guess, which is what made the dwl
# equivalent a silent no-op for weeks.
bind=SUPER+ALT,v,toggle_trackpad_enable
bind=none,XF86TouchpadToggle,toggle_trackpad_enable
# HDR on the OLED. Experimental upstream; harmless to try, toggle back if the
# colours go strange.
bind=SUPER,F5,togglehdr

# =================================================================== focus ===
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev
bind=SUPER,Tab,focuslast
bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right

# ==================================================================== move ===
bind=SUPER+SHIFT,j,exchange_stack_client,next
bind=SUPER+SHIFT,k,exchange_stack_client,prev
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,less,tagmon,left
bind=SUPER+SHIFT,greater,tagmon,right

# ================================================================== sizing ===
bind=SUPER,h,setmfact,-0.05
bind=SUPER,l,setmfact,+0.05
bind=SUPER,i,incnmaster,1
bind=SUPER+SHIFT,d,incnmaster,-1
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50

# ================================================================= layouts ===
# Super+Ctrl+key, the same namespace the dwl config used.
bind=SUPER+CTRL,t,setlayout,tile
bind=SUPER+CTRL,s,setlayout,scroller
bind=SUPER+CTRL,g,setlayout,grid
bind=SUPER+CTRL,a,setlayout,deck
bind=SUPER+CTRL,m,setlayout,monocle
bind=SUPER+CTRL,u,setlayout,center_tile
bind=SUPER+CTRL,v,setlayout,vertical_tile
bind=SUPER+CTRL,n,setlayout,vertical_scroller
bind=SUPER,space,switch_layout
# scroller-specific
bind=SUPER+ALT,e,set_proportion,1.0
bind=SUPER+ALT,x,switch_proportion_preset

# ==================================================================== gaps ===
bind=SUPER+ALT,l,incgaps,1
bind=SUPER+ALT,h,incgaps,-1
bind=SUPER+ALT,0,togglegaps

# ==================================================================== tags ===
# Nine, not dwl's ten: tag_num defaults to 9 and the overview layout is built
# around it. Tag 10 was only ever `Super+0` for a workspace that saw no use.
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

bind=SUPER+CTRL,1,toggleview,1
bind=SUPER+CTRL,2,toggleview,2
bind=SUPER+CTRL,3,toggleview,3
bind=SUPER+CTRL,4,toggleview,4
bind=SUPER+CTRL,5,toggleview,5
bind=SUPER+CTRL,6,toggleview,6
bind=SUPER+CTRL,7,toggleview,7
bind=SUPER+CTRL,8,toggleview,8
bind=SUPER+CTRL,9,toggleview,9

bind=SUPER+CTRL+SHIFT,1,toggletag,1
bind=SUPER+CTRL+SHIFT,2,toggletag,2
bind=SUPER+CTRL+SHIFT,3,toggletag,3
bind=SUPER+CTRL+SHIFT,4,toggletag,4
bind=SUPER+CTRL+SHIFT,5,toggletag,5
bind=SUPER+CTRL+SHIFT,6,toggletag,6
bind=SUPER+CTRL+SHIFT,7,toggletag,7
bind=SUPER+CTRL+SHIFT,8,toggletag,8
bind=SUPER+CTRL+SHIFT,9,toggletag,9

# Adjacent-tag navigation, which dwl had no equivalent for.
bind=SUPER+ALT,Left,viewtoleft_have_client,0
bind=SUPER+ALT,Right,viewtoright_have_client,0
bind=SUPER+ALT+SHIFT,Left,tagtoleft,0
bind=SUPER+ALT+SHIFT,Right,tagtoright,0

# ============================================================== media keys ===
bind=none,XF86AudioRaiseVolume,spawn,osd volume up
bind=none,XF86AudioLowerVolume,spawn,osd volume down
bind=none,XF86AudioMute,spawn,osd volume mute
bind=none,XF86AudioMicMute,spawn,osd mic mute
bind=none,XF86AudioPlay,spawn,osd playpause
bind=none,XF86Launch3,spawn,osd playpause
bind=none,XF86MonBrightnessUp,spawn,osd brightness up
bind=none,XF86MonBrightnessDown,spawn,osd brightness down

# =================================================================== mouse ===
# btn_left and btn_right cannot be bound with no modifier.
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER,btn_middle,togglefloating,0

# Scroll on Super to walk tags that actually have windows.
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# ============================================================ window rules ===
# isterm+noswallow is mango's built-in swallow, the same patch the dwl tree
# carried -- a terminal hides itself while the GUI it launched is up.
windowrule=appid:foot,isterm:1,noswallow:1
windowrule=appid:pinentry.*,isfloating:1
windowrule=title:Picture-in-Picture,isfloating:1
# Zoom the launcher rather than sliding it, which reads better for a popup.
layerrule=animation_type_open:zoom,layer_name:wmenu
layerrule=animation_type_close:zoom,layer_name:wmenu
