# Added by coat — pulls in the generated colour/font fragment. Never edit that file.
source=/home/amarnath/.config/mango/coat-colors.conf

# mango — the only compositor here. dwl underneath, dwm model, hot reload.
#
# Every option the parser accepts is listed. Written against 0.16.1; 0.17.0 added
# gesturebind + gesture_*, windowrule-once, overcircle_center_ratio,
# focusdir_only_zone_overlap, hotarea_disable_on_fullscreen and
# idleinhibit_when_fullscreen, none of which are set here yet.
#   key=value   in effect
#   #key=       unset, mango's default applies; the comment is the type it wants
#
# Do not set a colour here -- last-write-wins would override coat's fragment.
#
# Check: mango -c ~/.config/mango/config.conf -p     Reload: Super+Shift+R

# --- border / frame ----------------------------------------------------------
# Shadows are off, so the border is the ONLY focus cue -- hence 2px, not the 1px
# that was enough back when a drop shadow did the work.
border_radius=12
borderpx=2
# focused_opacity stays 1.0: mango's opacity fades the whole window, TEXT
# included. Pane translucency is the app's (coat.yaml opacity:), not this.
focused_opacity=1.0
no_border_when_single=1
no_radius_when_single=1
unfocused_opacity=0.9

# --- gaps --------------------------------------------------------------------
gappih=25
gappiv=25
gappoh=25
gappov=25
# 5/30 packed the overview thumbnails almost edge to edge.
overviewgappi=12
overviewgappo=40
# How much of the screen the centred client takes in the carousel. mango's default.
overcircle_center_ratio=0.5
smartgaps=1   # 0 = keep gaps even for a lone window

# --- blur --------------------------------------------------------------------
# Blur only applies to a window's TRANSPARENT areas, and the alpha is not set
# here -- it is coat's: opacity.terminal -> kitty, opacity.popups -> fuzzel+dunst.
# Both were 1.0, which is why blur=1 appeared to do nothing.
blur=1
blur_layer=0   # frosts layer surfaces (fuzzel, dunst) too
# Caches the wallpaper as the blur source -- much cheaper, and this machine is
# tuned for battery. Price: windows blur against the wallpaper, not the window
# under them. 0 gives true see-through and costs a lot of GPU.
blur_optimized=1
blur_params_brightness=0.85
blur_params_contrast=1.1
blur_params_noise=0.02   # the grain is what reads as frost rather than smear
# Passes compound the radius, so 3x10 is a heavy frost. radius ~6 for lighter.
blur_params_num_passes=3
blur_params_radius=10
blur_params_saturation=1.25

# --- shadows -----------------------------------------------------------------
# The macOS-ish lift: large, soft, offset down rather than centred.
shadow_only_floating=0
shadows=1
shadows_blur=40
shadows_position_x=0
shadows_position_y=12
shadows_size=25
#shadowscolor=                        # color — coat owns this

# --- animations --------------------------------------------------------------
# animations=0 is the master switch.
#
# Every CURVE is unset -- mango's own defaults apply. Five tuned sets were tried
# here (end-4, ML4W/hyprdots fast, HyDE optimized, and two assembled by hand)
# and none of them beat stock, so there is nothing to keep. mango ships the SAME
# curve (0.46,1.0,0.29,0.99) on every channel, so curves are never what makes
# one channel feel different from another -- type and duration are.
#animation_curve_close=               # float,float,float,float
#animation_curve_focus=
#animation_curve_move=
#animation_curve_opafadein=
#animation_curve_opafadeout=
#animation_curve_open=
#animation_curve_tag=
#animation_duration_focus=             #             stock 0
#animation_duration_tag=               #             stock 300
#
# The three durations below are all 350: move was cut from its stock 500 (the
# slowest default mango has), and open/close follow it so every window motion
# runs at one speed. Curves stay unset.
#
# open/close also share move's motion TYPE (below). zoom scaled the window up in
# place from zoom_initial_ratio (0.4), so nothing ever travelled and it read as
# a pop next to move's glide; slide starts the window full-size off the nearest
# screen edge -- real displacement, the same thing move animates.
# open: window spawn, stock 400.
animation_duration_open=350
# close: stock 300.
animation_duration_close=350
# move: stock 500, and it is also what the OVERVIEW runs on -- entering and
# leaving it re-arranges every client rather than using the tag channel
# (overview.c clears tagining/tagouting), so the overview was paying the
# longest duration in the config.
animation_duration_move=350
animation_fade_in=1
animation_fade_out=1
animation_type_close=slide
animation_type_open=slide
animations=1
#layer_animation_type_close=          # ?
#layer_animation_type_open=           # ?
layer_animations=1
tag_animation_direction=1

# --- layouts -----------------------------------------------------------------
#center_master_overspread=            # int
#center_when_single_stack=            # int
# NOT the carousel, and not a bool: mango rejects a plain 1 with "Invalid
# circle_layout format". The carousel is the `overcircle` DISPATCH -- see the
# SUPER+o bind. Left unset until the format is known.
#circle_layout=                       # ?
default_mfact=0.55
default_nmaster=1
new_is_master=1
tag_num=9   # the overview is built around 9

# --- scroller layout ---------------------------------------------------------
scroller_default_proportion=0.8
scroller_default_proportion_single=1.0
scroller_focus_center=0
#scroller_ignore_proportion_single=   # int
scroller_prefer_center=0
#scroller_prefer_overspread=          # int
scroller_proportion_preset=0.5,0.8,1.0
scroller_structs=20

# --- dwindle layout ----------------------------------------------------------
dwindle_drop_simple_split=1
dwindle_hsplit=1
dwindle_manual_split=0
dwindle_preserve_split=0
#dwindle_smart_resize=                # int
dwindle_smart_split=0
#dwindle_split_ratio=                 # float
dwindle_vsplit=1

# --- keyboard ----------------------------------------------------------------
#allow_shortcuts_inhibit=             # int
#keymode=                             # int
numlockon=0
