# mango — the only compositor here. dwl underneath, dwm model, runtime config with hot
# reload.
#
# THIS FILE LISTS EVERY OPTION MANGO'S PARSER ACCEPTS -- all 197, extracted from the
# `strcmp(key, ...)` chain in parse_option() in src/config/parse_config.h at 0.16.1.
# The shipped /etc/mango/config.conf documents only 98 of them, so about ninety of the
# lines below appear in no upstream documentation at all.
#
# Nothing here is invented. A line is either set to a real value, or commented out with
# the type mango expects, meaning mango's own built-in default applies. There is no
# defaults table in mango's source to copy, so unset is left honestly unset.
#
# Legend:
#   key=value     set, and this is what is in effect
#   #key=         NOT set; the comment gives the type mango expects. Uncomment to use.
#
# Validate:   mango -c ~/.config/mango/config.conf -p     (exits non-zero, names the line)
# Reload:     Super+Shift+R
#
# NO COLOURS HERE. Every *color option is written by coat into coat-colors.conf, which the
# source= line at the top pulls in. mango applies the file top to bottom with
# last-write-wins, so a colour set further down would silently override coat.

# ============================================================================
# border and window frame
# ============================================================================
# rounded corners. no_radius_when_single=0 keeps them on a lone window too.
border_radius=10
borderpx=4
focused_opacity=1.0
no_border_when_single=1
no_radius_when_single=0
unfocused_opacity=1.0

# ============================================================================
# gaps
# ============================================================================
# inner gaps at 2px. They were 8 and you called them out; 0 here and in gappov
# removes them entirely.
gappih=2
gappiv=2
gappoh=0
gappov=0
overviewgappi=5
overviewgappo=30
smartgaps=0

# ============================================================================
# blur
# ============================================================================
# the expensive one. Per-frame shader pass; this is the first thing to turn off
# if the laptop runs hot. blur_layer also frosts waybar/dock/fnott/fuzzel.
blur=1
blur_layer=1
blur_optimized=1
#blur_params_brightness=                # float; unset, mango's default applies
#blur_params_contrast=                  # float; unset, mango's default applies
#blur_params_noise=                     # float; unset, mango's default applies
blur_params_num_passes=3
blur_params_radius=6
#blur_params_saturation=                # float; unset, mango's default applies

# ============================================================================
# shadows
# ============================================================================
shadow_only_floating=0
# OFF, as asked. Everything below it is still tuned, so shadows=1 brings back
# something sane rather than the 18px halo that was here.
shadows=0
shadows_blur=20
#shadows_position_x=                    # int; unset, mango's default applies
#shadows_position_y=                    # int; unset, mango's default applies
shadows_size=10
#shadowscolor=                          # color; COAT WRITES THIS into coat-colors.conf

# ============================================================================
# animations
# ============================================================================
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_opafadein=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_open=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_duration_close=250
animation_duration_focus=0
animation_duration_move=350
animation_duration_open=250
animation_duration_tag=250
animation_fade_in=1
animation_fade_out=1
animation_type_close=zoom
animation_type_open=zoom
# zoom open/close, 250ms. slide is a phone transition; 300ms+ reads sluggish
# at 240Hz.
animations=1
#layer_animation_type_close=            # ?; unset, mango's default applies
#layer_animation_type_open=             # ?; unset, mango's default applies
layer_animations=1
tag_animation_direction=1

# ============================================================================
# layouts and the master area
# ============================================================================
#center_master_overspread=              # int; unset, mango's default applies
#center_when_single_stack=              # int; unset, mango's default applies
#circle_layout=                         # ?; unset, mango's default applies
default_mfact=0.55
default_nmaster=1
new_is_master=1
# nine tags. The overview is built around 9; 10 was never used.
tag_num=9

# ============================================================================
# scroller layout
# ============================================================================
scroller_default_proportion=0.8
scroller_default_proportion_single=1.0
scroller_focus_center=0
#scroller_ignore_proportion_single=     # int; unset, mango's default applies
scroller_prefer_center=0
#scroller_prefer_overspread=            # int; unset, mango's default applies
scroller_proportion_preset=0.5,0.8,1.0
scroller_structs=20

# ============================================================================
