# ============================================================================
# ENVIRONMENT AND AUTOSTART
#
# exec-once runs ONLY at startup; exec runs on every reload. Anything owning a daemon
# belongs in exec-once -- under dwl, autostart[] re-ran on reload and tore down the whole
# pipewire stack, leaving three audio processes alive with no ALSA devices.
# ============================================================================
env=QT_QPA_PLATFORM,wayland
env=MOZ_ENABLE_WAYLAND,1
env=_JAVA_AWT_WM_NONREPARENTING,1
env=XDG_CURRENT_DESKTOP,mango
exec-once=swaybg -m fill -i /home/amarnath/jbwallpapers/wallpapers/Matanuska-River-ENBLA05.jpg
exec-once=fnott
exec-once=waybar
exec-once=swayidle -w -C /home/amarnath/.config/swayidle/config
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store
exec-once=wl-clip-persist --clipboard regular
exec-once=dbus-update-activation-environment --all
exec-once=start-polkit
exec-once=canvas-notify
exec-once=nvibrant 1023 1023 1023 1023
exec-once=audio-ensure
exec-once=refresh-paru-completions


# ==============================================================================
# RULE SUB-OPTIONS — reference only
# ==============================================================================
# The keys above are top-level. windowrule=, monitorrule=, layerrule= and devicerule=
# take their own sub-keys, comma-separated, each `name:value`. All 105 the parser
# accepts:
#
#   accel_profile  accel_speed  activation_bypass  allow_csd  allow_shortcuts_inhibit  animation_type_close
#   animation_type_open  appid  button_map  click_method  custom  disable
#   disable_while_typing  drag_lock  focused_opacity  force_fakemaximize  force_render  force_tearing
#   force_tiled_state  globalkeybinding  hdr  hdr_force  hdr_max_avg_lum  hdr_max_lum
#   hdr_min_lum  height  icc  id  idleinhibit_when_focus  ignore_maximize
#   ignore_minimize  isfakefullscreen  isfloating  isfullscreen  isglobal  isnamedscratchpad
#   isnoanimation  isnoborder  isnoradius  isnoshadow  isnosizehint  isopensilent
#   isoverlay  istagsilent  isterm  isunglobal  kb_layout  kb_model
#   kb_options  kb_rules  kb_variant  layer_name  layout_name  left_handed
#   make  mfact  middle_button_emulation  model  monitor  monitor_make
#   monitor_model  monitor_name  monitor_serial  name  natural_scrolling  nmaster
#   no_force_center  no_hide  no_render_border  noanim  noblur  nofadein
#   nofadeout  nofocus  noshadow  noswallow  offsetx  offsety
#   open_as_floating  refresh  repeat_delay  repeat_rate  rr  scale
#   scroll_button  scroll_method  scroller_default_proportion  scroller_default_proportion_single  scroller_ignore_proportion_single  scroller_proportion
#   scroller_proportion_single  send_events_mode  serial  shield_when_capture  tags  tap_and_drag
#   tap_to_click  title  type  unfocused_opacity  vrr  vrr_only_fullscreen
#   width  x  y
#
# Which sub-key belongs to which rule is not documented upstream; mango rejects an
# unknown one by name, so `mango -p` is the way to find out.
