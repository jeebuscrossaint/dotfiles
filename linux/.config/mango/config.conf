# --- trackpad / libinput -----------------------------------------------------
#axis_scroll_factor=                  # float
#button_map=                          # float
#drag_corner=                         # int
#drag_floating_refresh_interval=      # float
drag_lock=0
#drag_tile_refresh_interval=          # float
drag_tile_small=1
drag_tile_to_tile=1
#drag_warp_cursor=                    # int
#send_events_mode=                    # int
tap_and_drag=1
tap_to_click=1
trackpad_accel_profile=2
trackpad_accel_speed=0.0
#trackpad_click_method=               # int
trackpad_disable_while_typing=1
#trackpad_left_handed=                # int
#trackpad_middle_button_emulation=    # int
trackpad_natural_scrolling=0
#trackpad_scroll_button=              # int
#trackpad_scroll_factor=              # float
#trackpad_scroll_method=              # int
#trackpad_send_events_mode=           # int

# --- cursor / hot corners ----------------------------------------------------
#cursor_hide_on_keypress=             # int
cursor_hide_timeout=3                 # int
cursor_size=24
cursor_theme=WhiteSur-cursors
enable_hotarea=0
#hotarea_corner=                      # int
hotarea_size=10
warpcursor=1

# --- touch / tablet ----------------------------------------------------------
# [mango 0.17.0: removed] tablet_map_to_mon / touch_map_to_mon -- devicerule now
