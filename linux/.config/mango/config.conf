repeat_rate=50
xkb_rules_layout=us
#xkb_rules_model=                     # ?
#xkb_rules_options=                   # ?
#xkb_rules_rules=                     # ?
#xkb_rules_variant=                   # ?

# --- mouse -------------------------------------------------------------------
