#touch_enable=                        # int
#touch_enable_mouse_emulation=        # int

# --- focus / snap / scratchpad -----------------------------------------------
#allow_lock_transparent=              # int
enable_floating_snap=1
#exchange_cross_monitor=              # int
focus_on_activate=1
#ov_tab_mode_launch_next=             # int
#scratchpad_cross_monitor=            # int
scratchpad_height_ratio=0.9
scratchpad_width_ratio=0.8
#single_scratchpad=                   # int
sloppyfocus=1
snap_distance=30
#tag_carousel=                        # float
#tag_gather=                          # int
#view_current_to_back=                # int

# --- group bar ---------------------------------------------------------------
#group_bar_decorate_bg_color=         # color
#group_bar_decorate_border_color=     # color
group_bar_decorate_border_width=0
group_bar_decorate_corner_radius=8
#group_bar_decorate_fg_color=         # color
#group_bar_decorate_focus_bg_color=   # color
#group_bar_decorate_focus_fg_color=   # color
group_bar_decorate_font_desc=Adwaita Sans 10
group_bar_decorate_padding_x=12
group_bar_decorate_padding_y=5
# mango has no titlebars, so this tab strip is the only place a window title is
# drawn -- and only for GROUPED windows (Super+Shift+G). A lone window shows none.
group_bar_height=28

# --- jump labels -------------------------------------------------------------
# The five jump_label colours are coat's now, in coat-colors.conf with the group
# bar. base05 on base00 with an accent border -- every label has to be readable, so
# none of them get the group bar's dim unfocused treatment.
#jump_label_decorate_bg_color=        # color — coat owns this
#jump_label_decorate_border_color=    # color — coat owns this
jump_label_decorate_border_width=2
jump_label_decorate_corner_radius=8
#jump_label_decorate_fg_color=        # color — coat owns this
#jump_label_decorate_focus_bg_color=  # color — coat owns this
#jump_label_decorate_focus_fg_color=  # color — coat owns this
# Bigger and bolder than the group bar's 10: a label you have to READ is a label
# that defeats the point -- it should land in your eye as a single glyph.
jump_label_decorate_font_desc=Adwaita Sans Bold 16
jump_label_decorate_padding_x=12
jump_label_decorate_padding_y=5
# Unset = mango's own default, HJKLASDFGQWERTYUIOPZXCVBNM: home row first, so the
# first eight windows are all one key without leaving it. Nothing to improve on.
#jump_labels=                         # string
#

# --- outputs / HDR / VRR / tearing -------------------------------------------
# HDR AND BLUR CANNOT BOTH BE ON -- a build constraint, not a taste one. HDR
# needs the vulkan renderer; scenefx (blur, shadows, radius) has no vulkan
# backend. This binary links libscenefx-0.5, so SUPER+F5 togglehdr currently
# logs "HDR not supported on output eDP-1". The switch costs the effects block:
#env=WLR_RENDERER,vulkan
#
# Panel numbers are real, from its DisplayID 2.0 block (edid-decode on
# /sys/class/drm/card1-eDP-1/edid): 616 peak / 400 full-coverage / 0.0005 min,
# and it advertises BT.2020/ST2084 itself, so hdr_force is not needed. They sit
# on the eDP-1 monitorrule below, inert until the renderer changes.
#hdr_depth=2                          # 2 = HDR10, already the default
#allow_tearing=                       # int
#syncobj_enable=                      # int

# --- xwayland ----------------------------------------------------------------
#xwayland_ignore_scale=               # int
#xwayland_persistence=                # int

# --- colours — coat writes these into coat-colors.conf -----------------------
#bordercolor=                         # color
#dropcolor=                           # color
#focuscolor=                          # color
#globalcolor=                         # color
#maximizescreencolor=                 # color
#overlaycolor=                        # color
#rootcolor=                           # color
#scratchpadcolor=                     # color
#splitcolor=                          # color
#urgentcolor=                         # color

# --- everything else the parser accepts ----------------------------------
axis_bind_apply_timeout=100
#devicerule=                          # ?
disable_trackpad=0
edge_scroller_focus_allow_speed=0.0
edge_scroller_pointer_focus=1
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
focus_cross_monitor=0
focus_cross_tag=0
idleinhibit_ignore_visible=0
layer_shadows=1   # dunst and fuzzel get the lift too
# fuzzel's layer-shell namespace is "launcher", not "fuzzel" -- confirmed with
# WAYLAND_DEBUG=1: get_layer_surface(..., "launcher"). With layer_name:fuzzel both
# of these silently never matched, so the launcher only ever got the global fade.
layerrule=animation_type_open:zoom,layer_name:launcher
layerrule=animation_type_close:zoom,layer_name:launcher
# dunst's layer-shell namespace is "notifications", not "dunst".
layerrule=animation_type_open:slide,layer_name:notifications
layerrule=animation_type_close:slide,layer_name:notifications
monitorrule=name:HDMI-A-1,width:3840,height:2160,refresh:30,x:2560,y:0,scale:1,vrr:0
# [mango 0.16.3: removed] ov_tab_mode=1
swipe_min_threshold=1
tagrule=id:9,layout_name:scroller
windowrule=title:Picture-in-Picture,isfloating:1
zoom_end_ratio=0.8
zoom_initial_ratio=0.4

# --- rules ---------------------------------------------------------------
# One line per rule. These were duplicated -- seven of them, 23 lines for 16
# distinct rules -- which is harmless to mango and misleading to read: a second
# copy looks like it might differ until you diff it.
#
# The eDP-1 rule no longer pins width/height/refresh. 2560x1600@240 is this
# panel's PREFERRED mode -- edid-decode reports "DTD: 2560x1600 240.000299 Hz
# (preferred)" -- so pinning it changed nothing here, while naming a mode no
# other machine has. `name:eDP-1` matches the internal panel on every laptop, so
# the rule now sets only what it actually means to override: position, scale and
# vrr. The mode comes from the display.
# hdr:1 once the renderer is vulkan -- see the HDR block above.
monitorrule=name:eDP-1,x:0,y:0,scale:1,vrr:0,hdr:0,hdr_max_lum:616,hdr_max_avg_lum:400,hdr_min_lum:0.0005
tagrule=id:1,layout_name:tile
windowrule=appid:kitty,isterm:1,noswallow:1
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:grid
tagrule=id:8,layout_name:tile
windowrule=appid:pinentry.*,isfloating:1

# --- keybinds, mouse, scroll ----------------------------------------------
bind=SUPER,q,spawn,kitty
bind=SUPER+SHIFT,Return,spawn,kitty
# fuzzel directly. There used to be `menu` and `menu-run` wrappers here, both of
# them a `pgrep -x qs` branch choosing between the Quickshell shell and fuzzel.
# That shell is gone, so the branch had one outcome and the wrappers went too.
# Geometry is computed from the ACTUAL screen, not taken from fuzzel.ini, because
# fuzzel has no percentage units -- `width` is in characters and `line-height` is
# in pixels, so both are written against one resolution or they are written
# against none. The ini keeps the 2560x1600 numbers as the reference and as the
# fallback for launching fuzzel by hand; these scale them by w/2560 and h/1600, so
# this machine gets exactly what the ini says and a 14" 1920x1080 gets 37 columns
# and a 17px line instead of 50 and 26.
#
# No commas anywhere in the command, deliberately: mango splits a bind on them --
# see the movewin binds further down -- so ${v%%[!0-9]*} and ${v##*[!0-9]} take the
# two numbers out of "2560,1600" without naming the separator.
bind=SUPER,d,spawn_shell,read v < /sys/class/graphics/fb0/virtual_size; exec fuzzel --width=$(( ${v%%[!0-9]*} * 50 / 2560 )) --line-height=$(( ${v##*[!0-9]} * 26 / 1600 ))
bind=SUPER,v,spawn_shell,read v < /sys/class/graphics/fb0/virtual_size; cliphist list | fuzzel --dmenu --prompt "clip " --width=$(( ${v%%[!0-9]*} * 50 / 2560 )) --line-height=$(( ${v##*[!0-9]} * 26 / 1600 )) | cliphist decode | wl-copy
bind=SUPER+SHIFT,b,spawn,firefox-developer-edition
bind=SUPER,t,spawn,theme-pick
bind=SUPER+SHIFT,t,spawn,theme-random
# Theme from the current colours. Deliberately a key, not automatic:
# changing the wallpaper is not the same wish as changing the whole desktop, and
# when it was automatic every idle flick through a wallpaper directory rebuilt
# and reapplied a scheme.
bind=SUPER+ALT,t,spawn,coat match
bind=SUPER+SHIFT,s,spawn,screenshot
bind=SUPER+SHIFT,e,spawn,screenshot-edit
bind=SUPER,p,spawn_shell,if [ -e /home/amarnath/.cache/conky.off ]; then rm -f /home/amarnath/.cache/conky.off; else touch /home/amarnath/.cache/conky.off; pkill -x conky; fi
bind=SUPER+SHIFT,p,spawn,pickcolor
# idle-guard, not swaylock: it is what hands swaylock the current wallpaper.
bind=SUPER,l,spawn,idle-guard now
bind=SUPER,Escape,spawn,idle-guard now
bind=SUPER+SHIFT,c,reload_config
bind=SUPER+SHIFT,q,quit
bind=SUPER,c,killclient
bind=SUPER,Return,zoom
bind=SUPER,f,togglefullscreen
bind=SUPER,e,togglefullscreen
bind=SUPER,m,togglefullscreen
bind=SUPER+SHIFT,space,togglefloating
bind=SUPER+SHIFT,w,toggle_all_floating
bind=SUPER+SHIFT,v,togglefloating
bind=SUPER+SHIFT,f,togglefakefullscreen
bind=SUPER,a,togglemaximizescreen
bind=SUPER,g,toggleglobal
bind=SUPER+SHIFT,g,groupjoin
bind=SUPER+ALT,g,groupleave
bind=SUPER+ALT,Tab,groupfocus
# overcircle, not toggleoverview: same overview, carousel instead of the thumbnail
# grid -- focused client centred at overcircle_center_ratio, the rest shrunk out to
