# gtklock — lock screen. Replaced swaylock 2026-08-05 because swaylock reads
# exactly one config file with no include, so coat could not theme it without
# owning the whole thing. gtklock's appearance is GTK CSS, so the theme is an
# @import and this file stays hand-maintained.
#
# glib keyfile format: every key here is the long form of a CLI flag, so
# `--time-format` is `time-format`. Note --daemonize is NOT settable here; it is
# a startup flag and lives in the gtklock-once wrapper.

[main]
# Absolute path on purpose: a relative `style` is resolved against gtklock's
# working directory, which is whatever spawned it (swayidle, a keybind, a TTY).
# style.css is ours and does nothing but @import coat's generated fragment.
style=/home/amarnath/.config/gtklock/style.css

time-format=%H:%M
date-format=%A, %B %d

# Blank the form after 10s idle so a lock left alone stops glowing; any key or
# pointer motion brings it back.
idle-hide=true
idle-timeout=10
