# ~/.config/coat/coat.yaml

enabled:
  - fish
  - kitty
  - micro
  - bat
  - btop
  - zathura
  - gtk
  - discord
  - mpv
  - vscode
  - fastfetch
  - lsd
  - imv
  - satty
  - mango
  - dunst
  - fuzzel
  - swaylock
  - conky

scheme: onedark
prefer_base24: false

# Evens out whatever scheme is loaded. `coat docs normalize` lists the knobs.
normalize:
  enabled: false

opacity:
  # Blur only shows through a translucent surface, so at 1.0 an opaque terminal
  # frosts nothing and the effects block appears to do less than it does.
  terminal: 1.0    # opaque: mango drops blur on fullscreen, so 0.85 showed the windows behind it
  popups: 0.92     # fuzzel + dunst; higher, they sit over arbitrary windows
  applications: 1.0
  desktop: 1.0     # conky, which has only the wallpaper behind it anyway

font:
  emoji: "Noto Color Emoji"
  monospace: "Fragment Mono"
  sansserif: "Fragment Mono"
  serif: "Fragment Mono"
  sizes:
    terminal: 10
    desktop: 10
    popups: 10

# Per-app overrides of the blocks above. Only the keys listed are replaced;
# everything else falls through, so an override is a patch, not a second config.
overrides:
  # A ceiling, not the size: each panel's fit_size shrinks it if it won't fit.
  conky:
    font:
      sizes:
        desktop: 11   # system readout, top-right
        terminal: 11  # weather + todo, top-left
