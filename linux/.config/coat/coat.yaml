# ~/.config/coat/coat.yaml

enabled:
  - fish
  - kitty
  - neovim
  - bat
  - btop
  - zathura
  - gtk
  - vesktop
  - mpv
  - vscode

  - mango
  - waybar
  - fnott
  - swaylock
  - fuzzel
  - kitty
  - hyprland

scheme: gruvbox-dark-pale
prefer_base24: false

# Evens out whatever scheme is loaded. `coat docs normalize` lists the knobs.
normalize:
  enabled: false

opacity:
  # Blur only shows through a translucent surface, so at 1.0 an opaque terminal
  # frosts nothing and the effects block appears to do less than it does.
  terminal: 1.0
  applications: 1.0
  desktop: 1.0
  popups: 1.0

font:
  emoji: "Noto Color Emoji"
  monospace: "SFMono Nerd Font Mono Heavy"
  sansserif: "SFMono Nerd Font Mono Heavy"
  serif: "SFMono Nerd Font Mono Heavy"
  sizes:
    terminal: 10
    desktop: 10
    popups: 10
