# ~/.config/coat/coat.yaml

# The 'enabled' key triggers STATE_ENABLED and expects a sequence (list)
enabled:
  # avizo was retired 2026-07-28 in favour of swayosd (which also does the
  # caps/num-lock indicators). The avizo module still exists in coat — re-add
  # it here to go back.
  - swayosd
  - fish
  - foot
  # kitty is not the daily terminal (foot is) but stays themed: nvim's image.nvim
  # backend is kitty-only, so leetcode diagrams and inline images need it.
  - kitty
  - neovim
  - bat
  - btop
  - dunst
  - zathura
  - gtk
  - vesktop
  - sway
  # swaybar must come after sway: it is the module that runs `swaymsg reload`,
  # so sway's coat-theme has to be on disk by the time it fires.
  - swaybar
  - tofi
  - swaylock
  - firefox
  - mpv
  - vscode

# The 'scheme' key is a top-level scalar
scheme: brewer
prefer_base24: false

# Evens out whatever scheme is loaded: uniform brightness, legible text,
# accents that stay distinct. Defaults are tuned; `coat docs normalize` lists
# the knobs if one ever needs touching.
normalize:
  enabled: false

opacity:
  terminal: 1.0
  applications: 1.0
  desktop: 1.0
  popups: 1.0

# The 'font' key triggers in_font_section and expects a mapping (dictionary)
font:
  emoji: "Noto Color Emoji"
  monospace: "CaskaydiaCove Nerd Font Mono"
  sansserif: "CaskaydiaCove Nerd Font Mono"
  serif: "CaskaydiaCove Nerd Font Mono"
  sizes:
    terminal: 11
    desktop: 11
    popups: 11
