# ~/.config/coat/coat.yaml

enabled:
  - fish
  - kitty
  - micro
  - bat
  - btop
  - zathura
  - gtk
  - discord
  - mpv
  - vscode
  - fastfetch
  - lsd
  - imv
  - satty
  - hyprland
  - dunst
  - fuzzel
  - conky
  - qutebrowser
  - colors
  - qt

# colors.json (the scheme as plain data) also goes to the homelab, where
# term.lab picks it up. `coat docs colors`.
colors:
  send:
    - amarnath@server:/opt/homelab/stacks/terminal/theme

scheme: onedark
prefer_base24: any

# Evens out whatever scheme is loaded. `coat docs normalize` lists the knobs.
normalize:
  enabled: false

opacity:
  # Blur only shows through a translucent surface, so at 1.0 an opaque terminal
  # frosts nothing and the effects block appears to do less than it does.
  terminal: 0.85
  popups: 0.80     # fuzzel + dunst; enough transparency for compositor blur
  applications: 0.85
  desktop: 1.0     # conky, which has only the wallpaper behind it anyway

font:
  emoji: "Noto Color Emoji"
  monospace: "ShureTechMono Nerd Font Mono"
  sansserif: "ShureTechMono Nerd Font Mono"
  serif: "ShureTechMono Nerd Font Mono"
  sizes:
    terminal: 13
    desktop: 13
    popups: 13

# Per-app overrides of the blocks above. Only the keys listed are replaced;
# everything else falls through, so an override is a patch, not a second config.
overrides:
  # A ceiling, not the size: each panel's fit_size shrinks it if it won't fit.
  conky:
    font:
      sizes:
        desktop: 11   # system readout, top-right
        terminal: 11  # weather + todo, top-left
