# ~/.config/coat/coat.yaml

enabled:
  - fish
  - kitty
  - neovim
  - bat
  - btop
  - zathura
  - gtk
  - vesktop
  - mpv
  - vscode

  - yazi
  - cava
  - fastfetch
  - lsd
  - imv
  - satty
  - prismlauncher
  # Teams + Outlook DESKTOP (Electron). Browser tabs are coat-webapps' job.
  - msteams

  - quickshell
  - kitty
  - hyprland

scheme: classic-dark
prefer_base24: false

# Evens out whatever scheme is loaded. `coat docs normalize` lists the knobs.
normalize:
  enabled: false

opacity:
  # Blur only shows through a translucent surface, so at 1.0 an opaque terminal
  # frosts nothing and the effects block appears to do less than it does.
  terminal: 1.0
  applications: 1.0
  desktop: 1.0
  popups: 1.0

font:
  emoji: "Noto Color Emoji"
  monospace: "SFMono Nerd Font Mono"
  sansserif: "SFMono Nerd Font Mono"
  serif: "SFMono Nerd Font Mono"
  sizes:
    terminal: 10
    desktop: 10
    popups: 10

# Per-app overrides of the blocks above. Only the keys listed are replaced;
# everything else falls through, so an override is a patch, not a second config.
overrides:
  # A UI drawn in a monospace font never reads right, and macOS uses SF Pro for
  # chrome with SF Mono kept for code. That distinction cannot be expressed
  # globally -- there is one `sansserif` key and the terminal has to stay on SF
  # Mono -- which is exactly what this block is for.
  quickshell:
    font:
      sansserif: "SFProText Nerd Font"
