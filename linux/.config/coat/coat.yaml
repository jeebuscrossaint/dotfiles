# ~/.config/coat/coat.yaml

enabled:
  - fish
  - kitty
  - neovim
  - bat
  - btop
  - zathura
  - gtk
  - vesktop
  - mpv
  - vscode

  - yazi
  - cava
  - fastfetch
  - lsd
  - imv
  - satty
  - prismlauncher
  # Teams + Outlook DESKTOP (Electron). Browser tabs are coat-webapps' job.
  - msteams

  - mango
  - waybar
  - fnott
  - fuzzel
  - kitty
  - swaylock
  - conky

scheme: spacemacs
prefer_base24: false

# Evens out whatever scheme is loaded. `coat docs normalize` lists the knobs.
normalize:
  enabled: false

opacity:
  # Blur only shows through a translucent surface, so at 1.0 an opaque terminal
  # frosts nothing and the effects block appears to do less than it does.
  terminal: 1.0
  applications: 1.0
  desktop: 1.0
  popups: 1.0

font:
  emoji: "Noto Color Emoji"
  monospace: "SFMono Nerd Font Mono"
  sansserif: "SFMono Nerd Font Mono"
  serif: "SFMono Nerd Font Mono"
  sizes:
    terminal: 12
    desktop: 12
    popups: 12

# Per-app overrides of the blocks above. Only the keys listed are replaced;
# everything else falls through, so an override is a patch, not a second config.
overrides:
  # conky's readout is ~102 lines. The global desktop size is set for things
  # that are a few lines long; at 12 this one runs off the bottom of the panel.
  # It still follows coat -- change this number, not the config file.
  conky:
    font:
      sizes:
        desktop: 8
