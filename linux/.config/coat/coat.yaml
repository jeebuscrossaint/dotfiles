# ~/.config/coat/coat.yaml

# The 'enabled' key triggers STATE_ENABLED and expects a sequence (list)
enabled:
  - avizo
  - fish
  - foot
  - kitty
  - helix
  - neovim
  - hyprland
  - fuzzel
  - ranger
  - bat
  - btop
  - dunst
  - zathura
  - gtk
  - vesktop
  - sway
  - waybar
  - labwc
  - swaylock
  - kde
  - firefox
  - mpv
  - vscode

# The 'scheme' key is a top-level scalar
scheme: windows-10
prefer_base24: false

# Material-You-style perceptual regularization. Colours are converted to Oklch,
# their hue is kept (that's the scheme's identity) and their lightness/chroma are
# snapped toward fixed per-slot targets, so accents end up equally readable and
# visibly distinct no matter which of the ~700 schemes is loaded.
normalize:
  enabled: true
  strength: 1.0        # 0.0 = raw scheme, 1.0 = fully standardized
  ramp: true           # also retone base00..base07, not just the accents
  # 1.0 = tuned baseline. Raising this pushes base00/base07 toward pure
  # black/white, which kills whatever tint the scheme gave them (Shaman's
  # teal-cast black and mint white both die by ~1.15). Leave at 1.0 unless
  # the scheme is already monochrome.
  ramp_contrast: 1.0
  accent_lightness: 0.74   # slight lift over the 0.72 default
  accent_chroma: 0.14      # slight vividness bump over the 0.13 default
  min_hue_sep: 20      # degrees; pushes crowded accents apart
  # WCAG ratio base05 must clear against base00. Dark schemes naturally land
  # around 9:1 while light schemes hit ~18:1, which is why dark themes feel
  # washed out by comparison — this floor closes that gap. Only lifts base05,
  # so it doesn't flatten tinted backgrounds the way ramp_contrast does.
  contrast_floor: 12.0

opacity:
  terminal: 1.0
  applications: 1.0
  desktop: 1.0
  popups: 1.0

# The 'font' key triggers in_font_section and expects a mapping (dictionary)
font:
  emoji: "Noto Color Emoji"
  monospace: "SauceCodePro Nerd Font Mono"
  sansserif: "SauceCodePro Nerd Font Mono"
  serif: "SauceCodePro Nerd Font Mono"
  sizes:
    terminal: 11
    desktop: 11
    popups: 11
