# ~/.config/coat/coat.yaml

# The 'enabled' key triggers STATE_ENABLED and expects a sequence (list)
enabled:
  - avizo
  - fish
  - kitty
  - neovim
  - fuzzel
  - bat
  - btop
  - dunst
  - zathura
  - gtk
  - vesktop
  - sway
  - waybar
  - swaylock
  - firefox
  - mpv
  - vscode

# The 'scheme' key is a top-level scalar
scheme: catppuccin-mocha
prefer_base24: false

# Evens out whatever scheme is loaded: uniform brightness, legible text,
# accents that stay distinct. Defaults are tuned; `coat docs normalize` lists
# the knobs if one ever needs touching.
normalize:
  enabled: false

opacity:
  terminal: 0.85
  applications: 1.0
  desktop: 1.0
  popups: 1.0

# The 'font' key triggers in_font_section and expects a mapping (dictionary)
font:
  emoji: "Noto Color Emoji"
  monospace: "CaskaydiaCove Nerd Font Mono"
  sansserif: "CaskaydiaCove Nerd Font Mono"
  serif: "CaskaydiaCove Nerd Font Mono"
  sizes:
    terminal: 11
    desktop: 11
    popups: 11
