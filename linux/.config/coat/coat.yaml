# ~/.config/coat/coat.yaml

enabled:
  - fish
  - kitty
  - micro
  - bat
  - btop
  - zathura
  - gtk
  - discord
  - mpv
  - vscode
  - yazi
  - fastfetch
  - lsd
  - imv
  - satty
  - prismlauncher
  - mango
  - dunst
  - fuzzel
  - swaylock
  - conky

scheme: onedark
prefer_base24: false

# Evens out whatever scheme is loaded. `coat docs normalize` lists the knobs.
normalize:
  enabled: false

opacity:
  # Blur only shows through a translucent surface, so at 1.0 an opaque terminal
  # frosts nothing and the effects block appears to do less than it does.
  terminal: 0.85   # kitty background_opacity -- glyphs stay opaque
  popups: 0.92     # fuzzel + dunst; higher, they sit over arbitrary windows
  applications: 1.0
  desktop: 1.0     # conky, which has only the wallpaper behind it anyway

font:
  emoji: "Noto Color Emoji"
  monospace: "Ioskeley Mono"
  sansserif: "NeoSpleen Nerd Font"
  serif: "NeoSpleen Nerd Font"
  sizes:
    terminal: 10
    desktop: 10
    popups: 10

# Per-app overrides of the blocks above. Only the keys listed are replaced;
# everything else falls through, so an override is a patch, not a second config.
overrides:
  # Pinned rather than left to follow the global size, because this number is
  # load-bearing for fit: 62 lines at 12 is ~1432px against a 1600px panel, and
  # the window width is sized to the longest line at this size too. If the global
  # size moves, conky should NOT move with it silently.
  #
  # Measure before changing it -- render with out_to_console, count lines and take
  # the longest, then scale. A stale line count is what pinned this at 8 once.
  conky:
    font:
      sizes:
        # coat overrides are per module, and conky is two panels at two
        # densities, so two of the three slots are spoken for:
        desktop: 11   # main panel, top-right -- readings, then the weather
        terminal: 11  # process tree, top-left -- 66 lines, so it has to be small
        # popups is unused by conky: it was the weather's size while that block
        # lived in the left panel, and the weather draws at desktop size now.
