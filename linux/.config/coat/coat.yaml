# ~/.config/coat/coat.yaml

# The 'enabled' key triggers STATE_ENABLED and expects a sequence (list)
enabled:
  # No OSD module here on purpose. avizo was retired 2026-07-28 for swayosd, and
  # swayosd itself was retired 2026-08-11: theming a GTK app that only reads its
  # stylesheet at startup meant coat's apply_swayosd hook had to KILL the server,
  # which raced ~/.local/bin/swayosd-supervise and left the media keys silently
  # dead. The OSD is now a dunst notification (~/.local/bin/osd), so the `dunst`
  # module below themes it for free and there is no hook to break. coat still
  # SHIPS a swayosd module (modules.rs apply_swayosd + templates/swayosd.tera);
  # it is inert while it is off this list, and re-adding it re-adds the kill.
  # avizo has no module left at all — going back there means restoring it first.
  - fish
  - foot
  - neovim
  - bat
  - btop
  - dunst
  - zathura
  - gtk
  - vesktop
  - sway
  - dwl
  # swaybar must come after sway: it is the module that runs `swaymsg reload`,
  # so sway's coat-theme has to be on disk by the time it fires.
  - swaybar
  - tofi
  - wlock
  - tsubu
  # gtklock replaced swaylock 2026-08-05: swaylock reads one config with no
  # include, so coat couldn't theme it without owning the whole file.
  - gtklock
  - mpv
  - vscode

# The 'scheme' key is a top-level scalar
scheme: framer
prefer_base24: false

# Evens out whatever scheme is loaded: uniform brightness, legible text,
# accents that stay distinct. Defaults are tuned; `coat docs normalize` lists
# the knobs if one ever needs touching.
normalize:
  enabled: false

opacity:
  terminal: 1.0
  applications: 1.0
  desktop: 1.0
  popups: 1.0

# The 'font' key triggers in_font_section and expects a mapping (dictionary)
font:
  emoji: "Noto Color Emoji"
  monospace: "MartianMono Nerd Font Mono"
  sansserif: "MartianMono Nerd Font Mono"
  serif: "MartianMono Nerd Font Mono"
  sizes:
    terminal: 12
    desktop: 10
    popups: 12
