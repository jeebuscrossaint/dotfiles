# kitty — the terminal, replacing foot on 2026-08-19.
#
# Colours, font and opacity are coat's. Do not set a colour here: kitty is
# last-write-wins and this include is at the TOP, so anything below would override
# the scheme.
include coat-theme.conf

# What lets coat recolour running windows without a restart (`kitty @ set-colors`).
# Without these, coat falls back to SIGUSR1, which re-reads the whole config.
allow_remote_control yes
listen_on unix:/tmp/kitty

initial_window_width 120c
initial_window_height 34c

# mango tiles, so kitty drawing its own frame is a frame inside a frame.
hide_window_decorations yes
window_padding_width 6
confirm_os_window_close 0

# mango's tags are the workspace model and conky shows the title, so a second row
# of tabs inside the terminal is duplicate furniture.
tab_bar_style hidden

# Scrollback into $PAGER on ctrl+shift+h.
scrollback_lines 10000

# kitty grabs a lot of keys by default; nothing else is remapped, so mango's Super
# binds pass through untouched.
copy_on_select clipboard
strip_trailing_spaces smart
enable_audio_bell no

# Latency, tuned for the 240Hz eDP panel. kitty's defaults (repaint_delay 10,
# input_delay 3) are picked for 60Hz: at 240 a frame is 4.17ms, so a 10ms
# repaint floor throws away most of the refresh rate and typing lags the cursor.
# 4 is the frame time itself -- anything above it caps kitty below the panel
# (6 gave ~166fps), anything below it renders frames the compositor drops.
repaint_delay 4
input_delay 1
# Left on: mango composites and allow_tearing is off there, so kitty rendering
# ahead of the monitor would only burn battery for frames that never present.
sync_to_monitor yes

# IME is for East Asian input methods and nothing here uses one. kitty's own
# docs call the Wayland implementation buggy and say it "introduces latency into
# the input loop" -- this is the one free keystroke-latency win left.
# Not reloadable: needs a fresh kitty, not a config reload.
wayland_enable_ime no
