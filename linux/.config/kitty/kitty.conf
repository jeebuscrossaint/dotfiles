# kitty — the terminal, replacing foot on 2026-08-19.
#
# Colours, font and opacity are coat's: it writes coat-theme.conf next to this file and
# the include below pulls it in. Do not set a colour here -- kitty is last-write-wins like
# everything else, and the include is at the TOP, so a colour further down would override
# the scheme.
include coat-theme.conf

# Remote control is what lets coat recolour running windows without a restart:
# `kitty @ set-colors` talks over the socket listen_on names. Without these two lines coat
# falls back to SIGUSR1, which works but re-reads the whole config.
allow_remote_control yes
listen_on unix:/tmp/kitty

# 120x34, matching what foot was set to.
initial_window_width 120c
initial_window_height 34c

# No tabs, no splits, no window decorations: mango tiles, and kitty drawing its own
# frame inside a tiled window is a frame inside a frame.
hide_window_decorations yes
window_padding_width 6
confirm_os_window_close 0

# kitty's own tab bar is off. mango's tags are the workspace model here and waybar shows
# the title, so a second row of tabs inside the terminal is duplicate furniture.
tab_bar_style hidden

# Scrollback into $PAGER on ctrl+shift+h.
scrollback_lines 10000

# kitty grabs a lot of keys by default. These are the ones worth keeping and nothing else
# is remapped, so mango's Super binds pass through untouched.
copy_on_select clipboard
strip_trailing_spaces smart
enable_audio_bell no
