; conky\Day -- the day panel, top-left: weather and ~/todo.md. Port of
; linux/.config/conky/conky-left.conf, weather-fetch, weather.jq and todo.awk.
;
; The fetches are WebParser measures that only hand the raw JSON to day.lua;
; all formatting happens there, line for line with weather.jq.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=conky day
Author=jeebuscrossaint
Information=Weather (Open-Meteo, air quality, NWS alerts) and a todo list, coat-themed.
License=MIT

[Variables]
@Include=#@#theme.inc
; "lat lon" to skip IP geolocation entirely -- weather.coords on Linux. IP
; location on a campus network reports where the NETWORK is registered.
Coords=
TodoFile=%USERPROFILE%\todo.md
; Wrap width in columns, conky-left.conf's `cols`.
Cols=55
; Set by day.lua once a location is known.
Lat=0
Lon=0
UA=rainmeter-conky (github.com/jeebuscrossaint/dotfiles)

; ---------------------------------------------------------------- fetches
; UpdateRate is in skin updates (1s). The weather ones are driven by day.lua
; instead, so they never fire with coordinates that are not known yet.

[mLoc]
Measure=WebParser
URL=https://ipapi.co/json/
RegExp=(?s)^(.*)$
StringIndex=1
UpdateRate=3600
UserAgent=#UA#
FinishAction=[!CommandMeasure mScript "OnLoc()"]

[mWx]
Measure=WebParser
URL=https://api.open-meteo.com/v1/forecast?latitude=#Lat#&longitude=#Lon#&timezone=auto&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&forecast_days=1&current=temperature_2m,apparent_temperature,relative_humidity_2m,dew_point_2m,weather_code,precipitation,pressure_msl,surface_pressure,visibility,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,uv_index,shortwave_radiation,direct_radiation,diffuse_radiation,cape,lifted_index,convective_inhibition,freezing_level_height,boundary_layer_height,vapour_pressure_deficit,et0_fao_evapotranspiration,soil_temperature_0cm,soil_temperature_6cm,soil_moisture_0_to_1cm,wind_speed_10m,wind_direction_10m,wind_gusts_10m,wind_speed_80m,wind_speed_180m&hourly=temperature_2m,precipitation_probability,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,precipitation_hours,uv_index_max,sunrise,sunset,daylight_duration
RegExp=(?s)^(.*)$
StringIndex=1
UpdateRate=999999
DynamicVariables=1
FinishAction=[!CommandMeasure mScript "OnWx()"]

[mAq]
Measure=WebParser
URL=https://air-quality-api.open-meteo.com/v1/air-quality?latitude=#Lat#&longitude=#Lon#&timezone=auto&current=us_aqi,pm2_5,pm10,ozone
RegExp=(?s)^(.*)$
StringIndex=1
UpdateRate=999999
DynamicVariables=1
FinishAction=[!CommandMeasure mScript "OnWx()"]

; NWS: US only, no key, but it 403s a User-Agent that does not identify the client.
[mAlerts]
Measure=WebParser
URL=https://api.weather.gov/alerts/active?point=#Lat#,#Lon#
RegExp=(?s)^(.*)$
StringIndex=1
UpdateRate=999999
UserAgent=#UA#
DynamicVariables=1
FinishAction=[!CommandMeasure mScript "OnWx()"]

[mScript]
Measure=Script
ScriptFile=#@#day.lua

; ---------------------------------------------------------------- meter

[Body]
Meter=String
FontFace=#Font#
FontSize=#SizeTerminal#
FontColor=#base05#
AntiAlias=1
Text=
InlineSetting=Color | #base03#
InlinePattern=#DimPattern#
InlineSetting2=Color | #base08#
InlinePattern2=#AlertPattern#
DynamicVariables=1
