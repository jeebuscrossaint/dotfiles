; conky\Readout -- the system readout, top-right. Port of linux/.config/conky/conky.conf.
; Plain text by design: dim label, value, nothing else. Weather and todo are Day.ini.
;
; Every line is composed in readout.lua from the measures below and set on two
; String meters (the big clock, then the rest), so the layout reads like the
; conky.text block it came from instead of forty positioned meters.
;
; Differences from the Linux panel, all because Windows has no source for them:
;   temps/fan   no sensors without HWiNFO; drop in an HWiNFO plugin measure if wanted
;   governor    -> the active power plan
;   load        -> processor queue length (the closest thing to loadavg)
;   pkg         -> scoop app count, no update count (scoop status is a git fetch)
;   bat health  -> full-charge capacity only; design capacity is not exposed
;   now playing dropped: no Rainmeter plugin reads Windows' media session

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=conky readout
Author=jeebuscrossaint
Information=System readout, coat-themed. Colours and font from ~/.config/rainmeter/coat.inc.
License=MIT

[Variables]
; Which drive is "/".
Drive=C:
@Include=#@#theme.inc

; ---------------------------------------------------------------- measures

[mCPU]
Measure=CPU
Processor=0
AverageSize=2

; % Processor Performance x the base clock is the current clock; Task Manager
; does the same sum.
[mCPUPerf]
Measure=Plugin
Plugin=UsageMonitor
Category=Processor Information
Counter=% Processor Performance
Name=_Total

[mCPUBase]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=HARDWARE\DESCRIPTION\System\CentralProcessor\0
RegValue=~MHz
UpdateDivider=-1

[mQueue]
Measure=Plugin
Plugin=UsageMonitor
Category=System
Counter=Processor Queue Length
Name=

[mProcs]
Measure=Plugin
Plugin=UsageMonitor
Category=System
Counter=Processes
Name=
UpdateDivider=5

[mPlan]
Measure=Plugin
Plugin=RunCommand
Program=powercfg
Parameter=/getactivescheme
State=Hide
OutputType=ANSI
RegExpSubstitute=1
Substitute="(?s)^.*\((.*)\).*$":"\1"
UpdateDivider=60
OnUpdateAction=[!CommandMeasure mPlan "Run"]

[mScoop]
Measure=Plugin
Plugin=RunCommand
Program=cmd
Parameter=/c dir /b /ad "%USERPROFILE%\scoop\apps" | find /c /v ""
State=Hide
OutputType=ANSI
UpdateDivider=3600
OnUpdateAction=[!CommandMeasure mScoop "Run"]

[mMem]
Measure=PhysicalMemory
[mMemTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=-1

[mDiskFree]
Measure=FreeDiskSpace
Drive=#Drive#
UpdateDivider=10
[mDiskTotal]
Measure=FreeDiskSpace
Drive=#Drive#
Total=1
UpdateDivider=-1

[mDiskR]
Measure=Plugin
Plugin=UsageMonitor
Category=PhysicalDisk
Counter=Disk Read Bytes/sec
Name=_Total
[mDiskW]
Measure=Plugin
Plugin=UsageMonitor
Category=PhysicalDisk
Counter=Disk Write Bytes/sec
Name=_Total

[mNetIn]
Measure=NetIn
Interface=Best
[mNetOut]
Measure=NetOut
Interface=Best
[mNetInTotal]
Measure=NetIn
Interface=Best
Cumulative=1
[mNetOutTotal]
Measure=NetOut
Interface=Best
Cumulative=1

[mSSID]
Measure=Plugin
Plugin=SysInfo
SysInfoType=WIFI_SSID
UpdateDivider=5
[mWifiQual]
Measure=Plugin
Plugin=SysInfo
SysInfoType=WIFI_QUALITY
UpdateDivider=5
[mAdapter]
Measure=Plugin
Plugin=SysInfo
SysInfoType=ADAPTER_DESCRIPTION
SysInfoData=Best
UpdateDivider=5
[mIP]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best
UpdateDivider=5
; The gateway of the route Windows actually uses -- conky needed conky_gw()
; because ${gw_ip} says "multiple"; SysInfo's Best already picks the winner.
[mGW]
Measure=Plugin
Plugin=SysInfo
SysInfoType=GATEWAY_ADDRESS
SysInfoData=Best
UpdateDivider=5
[mOnline]
Measure=Plugin
Plugin=SysInfo
SysInfoType=INTERNET_CONNECTIVITY
UpdateDivider=5

[mHost]
Measure=Plugin
Plugin=SysInfo
SysInfoType=COMPUTER_NAME
UpdateDivider=-1

[mProduct]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SOFTWARE\Microsoft\Windows NT\CurrentVersion
RegValue=ProductName
UpdateDivider=-1
[mBuild]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SOFTWARE\Microsoft\Windows NT\CurrentVersion
RegValue=CurrentBuild
UpdateDivider=-1
[mUBR]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SOFTWARE\Microsoft\Windows NT\CurrentVersion
RegValue=UBR
UpdateDivider=-1

; Boot time as a Unix timestamp, once; readout.lua counts from it. The Uptime
; measure reads a perf counter that showed 0:00 on a box up for hours.
[mBoot]
Measure=Plugin
Plugin=RunCommand
Program=powershell
Parameter=-NoProfile -NonInteractive -Command "[DateTimeOffset]::new((Get-CimInstance Win32_OperatingSystem).LastBootUpTime).ToUnixTimeSeconds()"
State=Hide
OutputType=ANSI
UpdateDivider=-1
OnUpdateAction=[!CommandMeasure mBoot "Run"]

[mBat]
Measure=Plugin
Plugin=PowerPlugin
PowerState=PERCENT
[mBatLife]
Measure=Plugin
Plugin=PowerPlugin
PowerState=LIFETIME
[mAC]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLINE

; Watts, volts and full-charge capacity from root\wmi, in one PowerShell every
; 30s. Prints "rate_mW charging(1/0) voltage_mV fullcap_mWh".
[mBatWmi]
Measure=Plugin
Plugin=RunCommand
Program=powershell
Parameter=-NoProfile -NonInteractive -Command "$s=Get-CimInstance -Namespace root\wmi BatteryStatus|select -First 1; $f=(Get-CimInstance -Namespace root\wmi BatteryFullChargedCapacity|select -First 1).FullChargedCapacity; '{0} {1} {2} {3}' -f [math]::Max($s.ChargeRate,$s.DischargeRate),[int]$s.Charging,$s.Voltage,$f"
State=Hide
OutputType=ANSI
UpdateDivider=30
OnUpdateAction=[!CommandMeasure mBatWmi "Run"]

[mVol]
Measure=Plugin
Plugin=Win7AudioPlugin

[mScript]
Measure=Script
ScriptFile=#@#readout.lua

; ---------------------------------------------------------------- meters

[Clock]
Meter=String
FontFace=#Font#
FontSize=(#SizeDesktop# * 2.75)
FontColor=#base05#
AntiAlias=1
StringAlign=Left
Text=--:--:--
DynamicVariables=1

[Body]
Meter=String
X=0
Y=0R
FontFace=#Font#
FontSize=#SizeDesktop#
FontColor=#base05#
AntiAlias=1
Text=
InlineSetting=Color | #base03#
InlinePattern=#DimPattern#
InlineSetting2=Color | #base08#
InlinePattern2=#AlertPattern#
DynamicVariables=1
